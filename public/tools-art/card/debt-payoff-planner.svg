  <!-- extra payment -->
  <circle cx="595" cy="368" r="34" fill="url(#acc)"/>
  <path d="M583,376 A34,34 0 0 0 624,352" fill="none" stroke="#d946ef" stroke-width="7" opacity="0.35"/>
  <line x1="595" y1="352" x2="595" y2="382" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>
  <path d="M581,371 L595,386 L609,371" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="595" y1="414" x2="595" y2="458" stroke="#8299b8" stroke-width="5" stroke-linecap="round"/>
  <path d="M583,448 L595,462 L607,448" fill="none" stroke="#8299b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- finish flag -->
  <rect x="1306" y="400" width="9" height="360" rx="4" fill="#0e1a2e"/>
  <rect x="1315" y="402" width="96" height="72" fill="#ffffff" stroke="#d7e0ee" stroke-width="3"/>
  <g fill="#0e1a2e">
    <rect x="1315" y="402" width="24" height="24"/>
    <rect x="1363" y="402" width="24" height="24"/>
    <rect x="1339" y="426" width="24" height="24"/>
    <rect x="1387" y="426" width="24" height="24"/>
    <rect x="1315" y="450" width="24" height="24"/>
