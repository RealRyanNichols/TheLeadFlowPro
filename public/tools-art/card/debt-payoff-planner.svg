  <g stroke="#b9c6da" stroke-width="3">
    <line x1="270" y1="760" x2="270" y2="774"/>
    <line x1="400" y1="760" x2="400" y2="774"/>
    <line x1="530" y1="760" x2="530" y2="774"/>
    <line x1="660" y1="760" x2="660" y2="774"/>
    <line x1="790" y1="760" x2="790" y2="774"/>
    <line x1="920" y1="760" x2="920" y2="774"/>
    <line x1="1050" y1="760" x2="1050" y2="774"/>
    <line x1="1180" y1="760" x2="1180" y2="774"/>
    <line x1="1310" y1="760" x2="1310" y2="774"/>
  </g>
</svg>
