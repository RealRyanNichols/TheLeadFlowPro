<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1200" height="675">
  <defs>
    <radialGradient id="w1" gradientUnits="userSpaceOnUse" cx="1000" cy="660" r="620">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="w2" gradientUnits="userSpaceOnUse" cx="1370" cy="320" r="430">
      <stop offset="0" stop-color="#d946ef" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#d946ef" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#d946ef"/>
    </linearGradient>
    <radialGradient id="sh" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0e1a2e" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#0e1a2e" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="#f7f9fc"/>
  <rect width="1600" height="900" fill="url(#w1)"/>
  <rect width="1600" height="900" fill="url(#w2)"/>

  <ellipse cx="780" cy="768" rx="560" ry="16" fill="url(#sh)"/>

  <!-- descending balance -->
  <g fill="url(#acc)">
    <rect x="222" y="280" width="96" height="480" rx="12"/>
    <rect x="352" y="340" width="96" height="420" rx="12"/>
    <rect x="482" y="400" width="96" height="360" rx="12"/>
    <rect x="612" y="500" width="96" height="260" rx="12"/>
    <rect x="742" y="550" width="96" height="210" rx="12"/>
    <rect x="872" y="595" width="96" height="165" rx="12"/>
    <rect x="1002" y="640" width="96" height="120" rx="12"/>
    <rect x="1132" y="680" width="96" height="80" rx="12"/>
  </g>
  <g fill="#d946ef" opacity="0.3">
    <rect x="292" y="288" width="14" height="464" rx="7"/>
    <rect x="422" y="348" width="14" height="404" rx="7"/>
    <rect x="552" y="408" width="14" height="344" rx="7"/>
    <rect x="682" y="508" width="14" height="244" rx="7"/>
    <rect x="812" y="558" width="14" height="194" rx="7"/>
    <rect x="942" y="603" width="14" height="149" rx="7"/>
    <rect x="1072" y="648" width="14" height="104" rx="7"/>
    <rect x="1202" y="688" width="14" height="64" rx="7"/>
  </g>

  <!-- payoff trend -->
  <path d="M270,266 L400,326 L530,386 L660,486 L790,536 L920,581 L1050,626 L1180,666 L1298,702"
