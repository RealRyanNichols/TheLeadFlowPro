<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1200" height="675">
  <defs>
    <linearGradient id="wq-g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <radialGradient id="wq-w1"><stop offset="0" stop-color="#38bdf8" stop-opacity=".11"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></radialGradient>
    <radialGradient id="wq-w2"><stop offset="0" stop-color="#2563eb" stop-opacity=".09"/><stop offset="1" stop-color="#2563eb" stop-opacity="0"/></radialGradient>
  </defs>

  <rect width="1600" height="900" fill="#f7f9fc"/>
  <circle cx="380" cy="200" r="440" fill="url(#wq-w1)"/>
  <circle cx="1260" cy="260" r="430" fill="url(#wq-w2)"/>
  <circle cx="850" cy="780" r="380" fill="url(#wq-w1)"/>

  <!-- cafe counter -->
  <rect x="120" y="636" width="1440" height="26" rx="8" fill="#ffffff" stroke="#d7e0ee" stroke-width="3"/>
  <rect x="150" y="664" width="1380" height="140" fill="#d7e0ee" opacity=".45"/>
  <line x1="150" y1="664" x2="1530" y2="664" stroke="#b9c6da" stroke-width="3"/>
  <line x1="620" y1="678" x2="620" y2="800" stroke="#b9c6da" stroke-width="2.5" opacity=".5"/>
  <line x1="1080" y1="678" x2="1080" y2="800" stroke="#b9c6da" stroke-width="2.5" opacity=".5"/>

  <!-- router at left -->
  <ellipse cx="350" cy="642" rx="135" ry="10" fill="#0e1a2e" opacity=".07"/>
  <line x1="295" y1="566" x2="272" y2="464" stroke="#0e1a2e" stroke-width="9" stroke-linecap="round"/>
  <line x1="405" y1="566" x2="428" y2="464" stroke="#0e1a2e" stroke-width="9" stroke-linecap="round"/>
  <rect x="235" y="566" width="230" height="70" rx="16" fill="#ffffff" stroke="#d7e0ee" stroke-width="3"/>
  <line x1="262" y1="611" x2="368" y2="611" stroke="#d7e0ee" stroke-width="5" stroke-linecap="round"/>
  <circle cx="398" cy="600" r="6" fill="#b9c6da"/>
  <circle cx="420" cy="600" r="6" fill="#b9c6da"/>
  <circle cx="442" cy="600" r="6" fill="#2563eb"/>
  <!-- signal arcs -->
  <path d="M320,520 a44,44 0 0 1 60,0" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" opacity=".7"/>
  <path d="M334,545 a24,24 0 0 1 32,0" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" opacity=".85"/>

  <!-- tent card with wifi QR -->
  <ellipse cx="770" cy="642" rx="125" ry="10" fill="#0e1a2e" opacity=".08"/>
  <path d="M685,412 L855,412 L872,392 L702,392 Z" fill="#b9c6da" opacity=".55"/>
  <path d="M655,636 L685,412 L855,412 L885,636 Z" fill="#ffffff" stroke="#d7e0ee" stroke-width="3" stroke-linejoin="round"/>
  <!-- QR: finder squares -->
  <g fill="none" stroke="#2563eb" stroke-width="7">
    <rect x="700" y="444" width="38" height="38" rx="5"/>
    <rect x="802" y="444" width="38" height="38" rx="5"/>
    <rect x="700" y="546" width="38" height="38" rx="5"/>
  </g>
  <rect x="712" y="456" width="14" height="14" fill="#2563eb"/>
  <rect x="814" y="456" width="14" height="14" fill="#2563eb"/>
  <rect x="712" y="558" width="14" height="14" fill="#2563eb"/>
  <!-- QR modules -->
  <g fill="#0e1a2e">
    <rect x="752" y="444" width="12" height="12"/><rect x="770" y="462" width="12" height="12"/>
    <rect x="752" y="480" width="12" height="12"/><rect x="788" y="480" width="12" height="12"/>
    <rect x="700" y="498" width="12" height="12"/><rect x="730" y="498" width="12" height="12"/>
    <rect x="760" y="504" width="12" height="12"/><rect x="790" y="498" width="12" height="12"/>
    <rect x="820" y="498" width="12" height="12"/><rect x="716" y="522" width="12" height="12"/>
    <rect x="748" y="528" width="12" height="12"/><rect x="778" y="522" width="12" height="12"/>
    <rect x="808" y="528" width="12" height="12"/><rect x="828" y="546" width="12" height="12"/>
    <rect x="756" y="552" width="12" height="12"/><rect x="782" y="564" width="12" height="12"/>
    <rect x="810" y="570" width="12" height="12"/><rect x="756" y="576" width="12" height="12"/>
  </g>
  <!-- wifi chip on card corner -->
  <circle cx="864" cy="416" r="26" fill="#ffffff" stroke="#d7e0ee" stroke-width="3"/>
  <path d="M850,414 a20,20 0 0 1 28,0" fill="none" stroke="#2563eb" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M857,424 a10,10 0 0 1 14,0" fill="none" stroke="#2563eb" stroke-width="4.5" stroke-linecap="round"/>
  <circle cx="864" cy="432" r="3.5" fill="#2563eb"/>

  <!-- scan beam -->
  <polygon points="1046,420 1046,472 852,512 852,468" fill="#38bdf8" opacity=".09"/>
  <line x1="1044" y1="446" x2="856" y2="490" stroke="#38bdf8" stroke-width="4" stroke-dasharray="11 10" stroke-linecap="round" opacity=".8"/>
  <circle cx="856" cy="490" r="5" fill="#38bdf8"/>

  <!-- guest phone, tilted toward the card -->
  <ellipse cx="1160" cy="648" rx="130" ry="11" fill="#0e1a2e" opacity=".07"/>
  <g transform="rotate(-12 1150 410)">
    <rect x="1055" y="210" width="190" height="400" rx="30" fill="#0e1a2e"/>
    <rect x="1067" y="222" width="166" height="376" rx="22" fill="#ffffff"/>
    <rect x="1122" y="234" width="56" height="12" rx="6" fill="#0e1a2e"/>
    <line x1="1247" y1="290" x2="1247" y2="360" stroke="#0e1a2e" stroke-width="6" stroke-linecap="round"/>
    <line x1="1074" y1="250" x2="1074" y2="330" stroke="#ffffff" stroke-width="4" opacity=".3"/>
    <!-- viewfinder brackets -->
    <g fill="none" stroke="#38bdf8" stroke-width="7" stroke-linecap="round">
      <path d="M1090,322 v-24 a8,8 0 0 1 8,-8 h24"/>
      <path d="M1178,290 h24 a8,8 0 0 1 8,8 v24"/>
      <path d="M1090,438 v24 a8,8 0 0 0 8,8 h24"/>
      <path d="M1210,438 v24 a8,8 0 0 1 -8,8 h-24"/>
    </g>
    <!-- mini QR seen through camera -->
    <g fill="none" stroke="#2563eb" stroke-width="4.5">
      <rect x="1114" y="318" width="22" height="22" rx="3"/>
      <rect x="1164" y="318" width="22" height="22" rx="3"/>
      <rect x="1114" y="368" width="22" height="22" rx="3"/>
    </g>
    <g fill="#0e1a2e">
      <rect x="1146" y="322" width="8" height="8"/><rect x="1154" y="342" width="8" height="8"/>
      <rect x="1140" y="352" width="8" height="8"/><rect x="1168" y="356" width="8" height="8"/>
      <rect x="1146" y="372" width="8" height="8"/><rect x="1170" y="378" width="8" height="8"/>
    </g>
    <!-- connected pill -->
    <rect x="1102" y="510" width="96" height="30" rx="15" fill="url(#wq-g)"/>
    <path d="M1138,525 l8,8 l16,-18" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- connected badge -->
  <circle cx="1258" cy="232" r="34" fill="url(#wq-g)" stroke="#ffffff" stroke-width="5"/>
  <path d="M1242,232 l11,11 l22,-24" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- coffee cup -->
  <ellipse cx="1443" cy="640" rx="48" ry="9" fill="#ffffff" stroke="#d7e0ee" stroke-width="2.5"/>
  <path d="M1410,562 L1420,636 L1466,636 L1476,562 Z" fill="#ffffff" stroke="#d7e0ee" stroke-width="3" stroke-linejoin="round"/>
  <path d="M1476,576 a19,19 0 1 1 -6,36" fill="none" stroke="#b9c6da" stroke-width="5"/>
  <path d="M1437,540 c9,-11 -9,-21 0,-33" fill="none" stroke="#b9c6da" stroke-width="4" stroke-linecap="round" opacity=".8"/>
</svg>
