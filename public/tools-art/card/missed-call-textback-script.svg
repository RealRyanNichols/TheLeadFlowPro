    <line x1="-14" y1="12" x2="14" y2="-14" stroke="#ffffff" stroke-width="8"/>
    <line x1="-14" y1="12" x2="14" y2="-14" stroke="#0e1a2e" stroke-width="4" stroke-linecap="round"/>
  </g>
  <rect x="748" y="222" width="150" height="13" rx="6" fill="#8299b8"/>
  <rect x="748" y="248" width="105" height="10" rx="5" fill="#d7e0ee"/>

  <!-- seconds-later connector -->
  <circle cx="800" cy="316" r="5" fill="#b9c6da"/>
  <circle cx="800" cy="344" r="5" fill="#b9c6da"/>
  <circle cx="800" cy="372" r="5" fill="#b9c6da"/>

