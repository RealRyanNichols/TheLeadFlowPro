<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1200" height="675">
  <defs>
    <linearGradient id="flow" x1="170" y1="0" x2="1090" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <radialGradient id="w1"><stop offset="0" stop-color="#38bdf8" stop-opacity=".12"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></radialGradient>
    <radialGradient id="w2"><stop offset="0" stop-color="#2563eb" stop-opacity=".10"/><stop offset="1" stop-color="#2563eb" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1600" height="900" fill="#f7f9fc"/>
  <circle cx="280" cy="260" r="480" fill="url(#w1)"/>
  <circle cx="1290" cy="600" r="470" fill="url(#w2)"/>

  <!-- platform chip receiving the fee -->
  <rect x="630" y="112" width="124" height="124" rx="28" fill="#ffffff" stroke="#d7e0ee" stroke-width="3"/>
  <rect x="654" y="148" width="76" height="12" fill="url(#acc)"/>
  <path d="M654 160 a12 12 0 0 0 24 0 Z" fill="url(#acc)"/>
  <path d="M680 160 a12 12 0 0 0 24 0 Z" fill="url(#acc)"/>
  <path d="M706 160 a12 12 0 0 0 24 0 Z" fill="url(#acc)"/>
  <rect x="660" y="178" width="64" height="34" rx="4" fill="none" stroke="#0e1a2e" stroke-width="4"/>
  <rect x="682" y="188" width="20" height="24" fill="#0e1a2e"/>
  <!-- arrow from slice up into chip -->
  <line x1="692" y1="278" x2="692" y2="252" stroke="#2563eb" stroke-width="4"/>
  <path d="M684 252 H700 L692 238 Z" fill="#2563eb"/>

  <!-- lifted fee slice -->
  <g transform="translate(690 300) rotate(-8)">
    <rect x="-85" y="-17" width="170" height="34" rx="9" fill="#2563eb"/>
    <rect x="-64" y="-7" width="46" height="14" rx="7" fill="#ffffff" opacity=".65"/>
    <rect x="8" y="-7" width="28" height="14" rx="7" fill="#ffffff" opacity=".45"/>
  </g>
  <!-- leader lines from the gap -->
  <line x1="604" y1="434" x2="612" y2="332" stroke="#8299b8" stroke-width="3" stroke-dasharray="8 8"/>
  <line x1="756" y1="434" x2="764" y2="310" stroke="#8299b8" stroke-width="3" stroke-dasharray="8 8"/>

  <!-- gross payout band -->
  <path d="M212 438 H600 V522 H212 A42 42 0 0 1 212 438 Z" fill="url(#flow)"/>
  <rect x="212" y="506" width="388" height="16" fill="#2563eb" opacity=".28"/>
  <!-- gap where the slice came out -->
  <rect x="600" y="438" width="160" height="34" fill="none" stroke="#8299b8" stroke-width="3" stroke-dasharray="10 8"/>
  <rect x="600" y="472" width="160" height="50" fill="url(#flow)"/>
  <!-- thinner net band continuing right -->
  <rect x="760" y="472" width="330" height="50" fill="url(#flow)"/>
  <rect x="760" y="508" width="330" height="14" fill="#2563eb" opacity=".28"/>
  <line x1="770" y1="438" x2="1080" y2="438" stroke="#b9c6da" stroke-width="3" stroke-dasharray="10 10"/>

  <!-- gross sale bag at the origin -->
  <path d="M186 352 V330 A26 26 0 0 1 238 330 V352" fill="none" stroke="#8299b8" stroke-width="5"/>
  <rect x="152" y="350" width="148" height="130" rx="14" fill="#ffffff" stroke="#d7e0ee" stroke-width="3"/>
  <circle cx="310" cy="422" r="27" fill="url(#acc)"/>
  <circle cx="310" cy="422" r="13" fill="none" stroke="#ffffff" stroke-width="3" opacity=".7"/>

  <!-- seller deposit panel with the big figure -->
  <ellipse cx="1262" cy="692" rx="230" ry="18" fill="#0e1a2e" opacity=".07"/>
  <rect x="1080" y="310" width="360" height="350" rx="24" fill="#ffffff" stroke="#d7e0ee" stroke-width="3"/>
  <line x1="1260" y1="352" x2="1260" y2="394" stroke="#0e1a2e" stroke-width="6" stroke-linecap="round"/>
  <path d="M1244 390 H1276 L1260 412 Z" fill="#0e1a2e"/>
  <path d="M1218 408 V424 A14 14 0 0 0 1232 438 H1288 A14 14 0 0 0 1302 424 V408" fill="none" stroke="#0e1a2e" stroke-width="6" stroke-linecap="round"/>
  <rect x="1128" y="462" width="110" height="14" rx="7" fill="#b9c6da"/>
  <rect x="1128" y="492" width="264" height="52" rx="14" fill="url(#acc)"/>
  <rect x="1344" y="492" width="48" height="52" rx="14" fill="#2563eb" opacity=".3"/>
  <rect x="1128" y="568" width="200" height="12" rx="6" fill="#d7e0ee"/>
  <rect x="1128" y="592" width="150" height="12" rx="6" fill="#d7e0ee"/>
</svg>
