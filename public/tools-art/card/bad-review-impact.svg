<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1200" height="675">
  <defs>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f87171"/>
      <stop offset="1" stop-color="#ef4444"/>
    </linearGradient>
    <radialGradient id="wr">
      <stop offset="0" stop-color="#f87171" stop-opacity=".10"/>
      <stop offset="1" stop-color="#f87171" stop-opacity="0"/>
    </radialGradient>
    <path id="st" d="M0,-1 L0.247,-0.34 L0.951,-0.309 L0.399,0.13 L0.588,0.809 L0,0.42 L-0.588,0.809 L-0.399,0.13 L-0.951,-0.309 L-0.247,-0.34 Z"/>
    <g id="fc">
      <rect width="150" height="94" rx="12" fill="#ffffff" stroke="#d7e0ee" stroke-width="3"/>
      <g fill="#b9c6da">
        <use href="#st" transform="translate(27 36) scale(11)"/>
        <use href="#st" transform="translate(51 36) scale(11)"/>
        <use href="#st" transform="translate(75 36) scale(11)"/>
        <use href="#st" transform="translate(99 36) scale(11)"/>
        <use href="#st" transform="translate(123 36) scale(11)"/>
      </g>
      <rect x="24" y="60" width="98" height="10" rx="5" fill="#d7e0ee"/>
    </g>
  </defs>

  <rect width="1600" height="900" fill="#f7f9fc"/>
  <circle cx="450" cy="140" r="380" fill="url(#wr)"/>
  <circle cx="1300" cy="290" r="330" fill="url(#wr)"/>
  <circle cx="840" cy="830" r="310" fill="url(#wr)"/>

  <!-- bright field of positive reviews -->
  <use href="#fc" transform="translate(150 110) rotate(-2)"/>
  <use href="#fc" transform="translate(340 142) rotate(1.5)"/>
  <use href="#fc" transform="translate(530 104) rotate(-1)"/>
  <use href="#fc" transform="translate(720 146) rotate(2)"/>
  <use href="#fc" transform="translate(905 112) rotate(-1.5)"/>
  <use href="#fc" transform="translate(215 274) rotate(1)"/>
  <use href="#fc" transform="translate(415 258) rotate(-2)"/>
  <use href="#fc" transform="translate(610 290) rotate(1)"/>
  <use href="#fc" transform="translate(835 266) rotate(-1.5)"/>
  <use href="#fc" transform="translate(300 430) rotate(2)"/>
  <use href="#fc" transform="translate(680 420) rotate(-1)"/>

  <!-- shadow under the dark card -->
  <ellipse cx="580" cy="694" rx="280" ry="20" fill="#0e1a2e" opacity=".07"/>

  <!-- the one-star review -->
  <g transform="rotate(-4 580 480)">
    <rect x="340" y="300" width="480" height="360" rx="20" fill="#0e1a2e"/>
    <circle cx="430" cy="360" r="22" fill="#8299b8"/>
    <rect x="470" y="346" width="205" height="16" rx="8" fill="#8299b8" opacity=".6"/>
    <use href="#st" transform="translate(425 432) scale(40)" fill="url(#acc)"/>
    <g fill="none" stroke="#8299b8" stroke-width=".13">
      <use href="#st" transform="translate(513 432) scale(40)"/>
      <use href="#st" transform="translate(601 432) scale(40)"/>
      <use href="#st" transform="translate(689 432) scale(40)"/>
      <use href="#st" transform="translate(777 432) scale(40)"/>
    </g>
    <rect x="425" y="502" width="320" height="16" rx="8" fill="#8299b8" opacity=".55"/>
    <rect x="425" y="540" width="240" height="16" rx="8" fill="#8299b8" opacity=".35"/>
    <rect x="425" y="578" width="285" height="16" rx="8" fill="#8299b8" opacity=".2"/>
  </g>

  <!-- tether dragging the rating down -->
  <path d="M 815,588 C 945,665 1070,658 1186,586" fill="none" stroke="#ef4444" stroke-width="5" stroke-dasharray="12 12" opacity=".75"/>

  <!-- falling average meter -->
  <ellipse cx="1250" cy="802" rx="105" ry="14" fill="#0e1a2e" opacity=".06"/>
  <rect x="1210" y="150" width="80" height="620" rx="40" fill="#ffffff" stroke="#d7e0ee" stroke-width="4"/>
  <g stroke="#d7e0ee" stroke-width="3">
    <line x1="1226" y1="242" x2="1274" y2="242"/>
    <line x1="1226" y1="330" x2="1274" y2="330"/>
    <line x1="1226" y1="418" x2="1274" y2="418"/>
    <line x1="1226" y1="506" x2="1274" y2="506"/>
    <line x1="1226" y1="682" x2="1274" y2="682"/>
  </g>
  <circle cx="1250" cy="580" r="56" fill="url(#acc)"/>
  <use href="#st" transform="translate(1250 584) scale(31)" fill="#ffffff"/>

  <!-- down arrow -->
  <line x1="1372" y1="466" x2="1372" y2="646" stroke="#ef4444" stroke-width="9" stroke-linecap="round"/>
  <path d="M 1372,688 L 1350,650 H 1394 Z" fill="#ef4444"/>
</svg>
