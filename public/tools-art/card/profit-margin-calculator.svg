<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1200" height="675">
  <defs>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbbf24"/><stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <radialGradient id="w1"><stop offset="0" stop-color="#fbbf24" stop-opacity=".15"/><stop offset="1" stop-color="#fbbf24" stop-opacity="0"/></radialGradient>
    <radialGradient id="w2"><stop offset="0" stop-color="#f97316" stop-opacity=".09"/><stop offset="1" stop-color="#f97316" stop-opacity="0"/></radialGradient>
    <clipPath id="barClip"><rect x="200" y="285" width="140" height="430" rx="16"/></clipPath>
  </defs>

  <rect width="1600" height="900" fill="#f7f9fc"/>
  <ellipse cx="420" cy="620" rx="540" ry="420" fill="url(#w1)"/>
  <ellipse cx="1220" cy="240" rx="620" ry="430" fill="url(#w2)"/>
  <ellipse cx="1050" cy="800" rx="420" ry="240" fill="url(#w1)" opacity=".7"/>

  <!-- faint margin ring in the negative space -->
  <circle cx="1320" cy="460" r="210" fill="none" stroke="url(#acc)" stroke-width="24" opacity=".1" stroke-dasharray="990 330" transform="rotate(-90 1320 460)" stroke-linecap="round"/>

  <!-- ground shadow -->
  <ellipse cx="400" cy="826" rx="330" ry="26" fill="#0e1a2e" opacity=".07"/>

  <!-- the paperwork -->
  <g transform="rotate(-3 330 470)">
    <rect x="130" y="140" width="400" height="660" rx="10" fill="#ffffff" stroke="#d7e0ee" stroke-width="3"/>
    <path d="M466 140 L530 140 L530 204 Z" fill="#e8eef5" stroke="#d7e0ee" stroke-width="3" stroke-linejoin="round"/>
    <rect x="175" y="190" width="170" height="18" rx="9" fill="#8299b8"/>
    <rect x="175" y="222" width="110" height="12" rx="6" fill="#b9c6da"/>

    <!-- sale price split: profit sliver / overhead / cost -->
    <g clip-path="url(#barClip)">
      <rect x="200" y="285" width="140" height="86" fill="url(#acc)"/>
      <rect x="310" y="285" width="30" height="86" fill="#f97316" opacity=".35"/>
      <rect x="200" y="375" width="140" height="158" fill="#8299b8"/>
      <rect x="200" y="537" width="140" height="178" fill="#b9c6da"/>
      <rect x="200" y="371" width="140" height="4" fill="#ffffff"/>
      <rect x="200" y="533" width="140" height="4" fill="#ffffff"/>
    </g>
    <rect x="200" y="285" width="140" height="430" rx="16" fill="none" stroke="#d7e0ee" stroke-width="3"/>

    <!-- bracket calling out the profit sliver -->
    <path d="M364 288 h16 v82 h-16" fill="none" stroke="#0e1a2e" stroke-width="5" stroke-linecap="round"/>
    <circle cx="414" cy="329" r="11" fill="url(#acc)"/>

    <!-- side labels as quiet rules -->
    <rect x="368" y="446" width="92" height="10" rx="5" fill="#b9c6da"/>
    <rect x="368" y="614" width="108" height="10" rx="5" fill="#b9c6da"/>

    <!-- ledger footer -->
    <rect x="175" y="738" width="272" height="9" rx="4" fill="#d7e0ee"/>
    <rect x="175" y="762" width="200" height="9" rx="4" fill="#b9c6da"/>
  </g>

  <!-- coins and the sale tag at the paper's foot -->
  <ellipse cx="600" cy="828" rx="180" ry="16" fill="#0e1a2e" opacity=".06"/>
  <circle cx="560" cy="778" r="46" fill="url(#acc)"/>
  <path d="M560 732 a46 46 0 0 1 46 46" fill="none" stroke="#f97316" stroke-width="9" opacity=".4"/>
  <circle cx="560" cy="778" r="29" fill="none" stroke="#ffffff" stroke-width="5" opacity=".6"/>
  <circle cx="644" cy="802" r="30" fill="#b9c6da"/>
  <circle cx="644" cy="802" r="18" fill="none" stroke="#ffffff" stroke-width="4" opacity=".7"/>

  <g transform="rotate(-8 780 786)">
    <path d="M756 748 h104 a14 14 0 0 1 14 14 v44 a14 14 0 0 1 -14 14 h-104 l-42 -36 Z" fill="#ffffff" stroke="#d7e0ee" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="734" cy="784" r="9" fill="none" stroke="#8299b8" stroke-width="5"/>
    <rect x="772" y="778" width="72" height="12" rx="6" fill="url(#acc)"/>
  </g>
</svg>
