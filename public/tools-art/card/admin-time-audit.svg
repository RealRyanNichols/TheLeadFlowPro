<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1200" height="675">
  <defs>
    <radialGradient id="w1" gradientUnits="userSpaceOnUse" cx="450" cy="230" r="560">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="w2" gradientUnits="userSpaceOnUse" cx="1250" cy="620" r="560">
      <stop offset="0" stop-color="#2563eb" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
