    <rect id="sheet" width="180" height="30" rx="6" fill="#ffffff" stroke="#d7e0ee" stroke-width="3"/>
    <rect id="sheet2" width="190" height="30" rx="6" fill="#ffffff" stroke="#d7e0ee" stroke-width="3"/>
