<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1200" height="675">
  <defs>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbbf24"/><stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <radialGradient id="w1"><stop offset="0" stop-color="#fbbf24" stop-opacity=".14"/><stop offset="1" stop-color="#fbbf24" stop-opacity="0"/></radialGradient>
    <radialGradient id="w2"><stop offset="0" stop-color="#f97316" stop-opacity=".1"/><stop offset="1" stop-color="#f97316" stop-opacity="0"/></radialGradient>
  </defs>

  <rect width="1600" height="900" fill="#f7f9fc"/>
  <ellipse cx="360" cy="300" rx="520" ry="360" fill="url(#w1)"/>
  <ellipse cx="1220" cy="380" rx="560" ry="420" fill="url(#w1)"/>
  <ellipse cx="800" cy="120" rx="620" ry="260" fill="url(#w2)"/>

  <!-- incoming deposits: banknote stack -->
  <ellipse cx="370" cy="548" rx="240" ry="22" fill="#0e1a2e" opacity=".06"/>
  <rect x="150" y="446" width="380" height="86" rx="12" fill="#ffffff" stroke="#d7e0ee" stroke-width="3"/>
  <rect x="170" y="400" width="380" height="86" rx="12" fill="#ffffff" stroke="#d7e0ee" stroke-width="3"/>
  <rect x="190" y="354" width="380" height="86" rx="12" fill="#ffffff" stroke="#d7e0ee" stroke-width="3"/>
  <ellipse cx="380" cy="397" rx="48" ry="27" fill="url(#acc)"/>
  <!-- the slice cut out of the deposit -->
  <path d="M380 397 L380 370 A48 27 0 0 1 428 397 Z" fill="#ffffff"/>
  <ellipse cx="380" cy="397" rx="48" ry="27" fill="none" stroke="#f97316" stroke-width="3" opacity=".35"/>
  <rect x="212" y="376" width="26" height="9" rx="4" fill="#b9c6da"/>
  <rect x="522" y="410" width="26" height="9" rx="4" fill="#b9c6da"/>

  <!-- transfer arc -->
  <path d="M470 350 C 700 140 1030 116 1222 238" fill="none" stroke="#8299b8" stroke-width="6" stroke-linecap="round" stroke-dasharray="1 26"/>

  <!-- the slice in flight, then coins -->
  <g transform="translate(580 268) rotate(32)">
    <path d="M0 0 L0 -54 A54 30 0 0 1 54 0 Z" fill="url(#acc)"/>
    <path d="M0 0 L0 -54" stroke="#f97316" stroke-width="4" opacity=".45"/>
  </g>
  <circle cx="779" cy="185" r="34" fill="url(#acc)"/>
  <path d="M779 151 a34 34 0 0 1 34 34" fill="none" stroke="#f97316" stroke-width="7" opacity=".4"/>
  <circle cx="779" cy="185" r="21" fill="none" stroke="#ffffff" stroke-width="4" opacity=".65"/>
  <circle cx="1033" cy="171" r="30" fill="url(#acc)"/>
  <circle cx="1033" cy="171" r="18" fill="none" stroke="#ffffff" stroke-width="4" opacity=".65"/>

  <!-- tax savings jar -->
  <ellipse cx="1225" cy="636" rx="190" ry="22" fill="#0e1a2e" opacity=".07"/>
  <rect x="1100" y="300" width="250" height="326" rx="36" fill="#ffffff" opacity=".82" stroke="#d7e0ee" stroke-width="4"/>
  <rect x="1128" y="500" width="194" height="26" rx="13" fill="url(#acc)"/>
  <rect x="1128" y="534" width="194" height="26" rx="13" fill="#f97316" opacity=".8"/>
  <rect x="1128" y="568" width="194" height="26" rx="13" fill="url(#acc)"/>
  <rect x="1152" y="466" width="146" height="26" rx="13" fill="url(#acc)"/>
  <path d="M1124 336 v170" stroke="#ffffff" stroke-width="10" stroke-linecap="round" opacity=".8"/>
  <!-- lid seated on the jar, slot up -->
  <rect x="1108" y="272" width="234" height="38" rx="14" fill="#8299b8"/>
  <rect x="1108" y="272" width="234" height="12" rx="6" fill="#b9c6da"/>
  <rect x="1190" y="278" width="70" height="10" rx="5" fill="#0e1a2e" opacity=".55"/>
  <!-- coin arriving at the slot -->
  <circle cx="1222" cy="216" r="32" fill="url(#acc)"/>
  <path d="M1222 184 a32 32 0 0 1 32 32" fill="none" stroke="#f97316" stroke-width="7" opacity=".4"/>
  <circle cx="1222" cy="216" r="19" fill="none" stroke="#ffffff" stroke-width="4" opacity=".65"/>
  <!-- quarterly pie label -->
  <rect x="1158" y="364" width="134" height="88" rx="12" fill="#ffffff" stroke="#d7e0ee" stroke-width="3"/>
  <circle cx="1225" cy="408" r="27" fill="#ffffff" stroke="#8299b8" stroke-width="4"/>
  <path d="M1225 408 L1225 381 A27 27 0 0 1 1252 408 Z" fill="url(#acc)"/>

  <!-- headline panel: the four quarters -->
  <rect x="120" y="668" width="1360" height="164" rx="24" fill="#ffffff" stroke="#d7e0ee" stroke-width="3"/>
  <line x1="230" y1="750" x2="1370" y2="750" stroke="#d7e0ee" stroke-width="4"/>
  <g>
    <rect x="292" y="722" width="56" height="56" rx="12" fill="#ffffff" stroke="#d7e0ee" stroke-width="3"/>
    <rect x="292" y="722" width="56" height="16" rx="8" fill="#b9c6da"/>
    <rect x="612" y="722" width="56" height="56" rx="12" fill="#ffffff" stroke="#d7e0ee" stroke-width="3"/>
    <rect x="612" y="722" width="56" height="16" rx="8" fill="#b9c6da"/>
    <rect x="932" y="722" width="56" height="56" rx="12" fill="url(#acc)"/>
    <rect x="932" y="722" width="56" height="16" rx="8" fill="#f97316" opacity=".6"/>
    <circle cx="960" cy="758" r="8" fill="#ffffff"/>
    <rect x="1252" y="722" width="56" height="56" rx="12" fill="#ffffff" stroke="#d7e0ee" stroke-width="3"/>
    <rect x="1252" y="722" width="56" height="16" rx="8" fill="#b9c6da"/>
  </g>
</svg>
