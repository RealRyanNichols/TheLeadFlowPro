<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1200" height="675">
  <defs>
    <linearGradient id="crc-acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f87171"/>
      <stop offset="1" stop-color="#ef4444"/>
    </linearGradient>
    <radialGradient id="crc-w1">
      <stop offset="0" stop-color="#f87171" stop-opacity=".13"/>
      <stop offset="1" stop-color="#f87171" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="crc-w2">
      <stop offset="0" stop-color="#ef4444" stop-opacity=".10"/>
      <stop offset="1" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="#f7f9fc"/>
  <circle cx="430" cy="460" r="480" fill="url(#crc-w1)"/>
  <circle cx="1330" cy="240" r="380" fill="url(#crc-w2)"/>

  <!-- horizon, sun, clouds -->
  <line x1="0" y1="228" x2="1600" y2="228" stroke="#d7e0ee" stroke-width="3"/>
  <circle cx="1452" cy="152" r="44" fill="#ffffff" stroke="#d7e0ee" stroke-width="3"/>
  <rect x="150" y="112" width="130" height="13" rx="6.5" fill="#ffffff" stroke="#d7e0ee" stroke-width="3"/>
  <rect x="238" y="146" width="92" height="13" rx="6.5" fill="#ffffff" stroke="#d7e0ee" stroke-width="3"/>
  <rect x="1120" y="84" width="110" height="13" rx="6.5" fill="#ffffff" stroke="#d7e0ee" stroke-width="3"/>

  <!-- runway receding right -->
  <polygon points="60,618 758,618 1410,236 1352,236" fill="#b9c6da" opacity=".32"/>
  <line x1="60" y1="618" x2="1352" y2="236" stroke="#8299b8" stroke-width="3"/>
  <line x1="758" y1="618" x2="1410" y2="236" stroke="#8299b8" stroke-width="3"/>
  <line x1="60" y1="618" x2="758" y2="618" stroke="#8299b8" stroke-width="3"/>

  <!-- centerline dashes: month markers -->
  <g fill="#ffffff">
    <rect x="462" y="580" width="50" height="14" rx="4" transform="rotate(-21.5 487 587)"/>
    <rect x="591" y="532" width="44" height="12.5" rx="4" transform="rotate(-21.5 613 538)"/>
    <rect x="720" y="483" width="38" height="11" rx="3.5" transform="rotate(-21.5 739 488)"/>
    <rect x="850" y="434" width="32" height="9.5" rx="3" transform="rotate(-21.5 866 438)"/>
    <rect x="979" y="385" width="26" height="8" rx="2.5" transform="rotate(-21.5 992 389)"/>
    <rect x="1109" y="336" width="20" height="6.5" rx="2" transform="rotate(-21.5 1119 339)"/>
    <rect x="1238" y="287" width="15" height="5" rx="1.5" transform="rotate(-21.5 1245 289)"/>
  </g>

  <!-- month marker posts with pennants along the left edge -->
  <g stroke="#0e1a2e" stroke-width="3" stroke-linecap="round">
    <line x1="448" y1="503" x2="448" y2="467"/>
    <line x1="771" y1="408" x2="771" y2="379"/>
    <line x1="1068" y1="320" x2="1068" y2="297"/>
  </g>
  <polygon points="448,467 478,474 448,481" fill="#ef4444" opacity=".85"/>
  <polygon points="771,379 795,385 771,391" fill="#ef4444" opacity=".85"/>
  <polygon points="1068,297 1087,302 1068,307" fill="#ef4444" opacity=".85"/>

  <!-- reserve stack, near end -->
  <ellipse cx="300" cy="612" rx="155" ry="14" fill="#0e1a2e" opacity=".07"/>
  <g fill="url(#crc-acc)" stroke="#ef4444" stroke-width="3" stroke-opacity=".3">
    <rect x="170" y="564" width="260" height="42" rx="5"/>
    <rect x="174" y="522" width="260" height="42" rx="5"/>
    <rect x="167" y="480" width="260" height="42" rx="5"/>
    <rect x="173" y="438" width="260" height="42" rx="5"/>
    <rect x="168" y="396" width="260" height="42" rx="5"/>
    <rect x="171" y="354" width="260" height="42" rx="5"/>
  </g>
  <rect x="177" y="360" width="14" height="30" rx="4" fill="#ef4444" opacity=".25"/>
  <rect x="181" y="362" width="240" height="26" rx="5" fill="none" stroke="#ffffff" stroke-width="3" opacity=".45"/>
  <circle cx="301" cy="375" r="13" fill="none" stroke="#ffffff" stroke-width="3" opacity=".6"/>

  <!-- receding stacks along the runway -->
  <ellipse cx="727" cy="507" rx="92" ry="9" fill="#0e1a2e" opacity=".06"/>
  <g fill="url(#crc-acc)" stroke="#ef4444" stroke-width="3" stroke-opacity=".3">
    <rect x="646" y="477" width="161" height="26" rx="4"/>
    <rect x="650" y="451" width="161" height="26" rx="4"/>
    <rect x="644" y="425" width="161" height="26" rx="4"/>
  </g>
  <circle cx="726" cy="438" r="8" fill="none" stroke="#ffffff" stroke-width="3" opacity=".6"/>

  <ellipse cx="929" cy="422" rx="64" ry="7" fill="#0e1a2e" opacity=".06"/>
  <g fill="url(#crc-acc)" stroke="#ef4444" stroke-width="3" stroke-opacity=".3">
    <rect x="870" y="400" width="117" height="19" rx="3.5"/>
    <rect x="873" y="381" width="117" height="19" rx="3.5"/>
    <rect x="869" y="362" width="117" height="19" rx="3.5"/>
  </g>

  <ellipse cx="1089" cy="353" rx="46" ry="5" fill="#0e1a2e" opacity=".06"/>
  <g fill="url(#crc-acc)" stroke="#ef4444" stroke-width="3" stroke-opacity=".3">
    <rect x="1048" y="337" width="83" height="14" rx="3"/>
    <rect x="1051" y="323" width="83" height="14" rx="3"/>
  </g>

  <g fill="url(#crc-acc)" stroke="#ef4444" stroke-width="3" stroke-opacity=".3">
    <rect x="1197" y="287" width="57" height="10" rx="2.5"/>
    <rect x="1199" y="277" width="57" height="10" rx="2.5"/>
  </g>
  <ellipse cx="1303" cy="264" rx="14" ry="5" fill="url(#crc-acc)" stroke="#ef4444" stroke-width="3" stroke-opacity=".3"/>

  <!-- quiet title band -->
  <rect x="0" y="648" width="1600" height="252" fill="#ffffff"/>
  <line x1="0" y1="648" x2="1600" y2="648" stroke="#d7e0ee" stroke-width="3"/>
  <circle cx="1000" cy="810" r="420" fill="url(#crc-w1)" opacity=".5"/>
  <rect x="96" y="762" width="40" height="10" rx="5" fill="url(#crc-acc)" opacity=".85"/>
  <rect x="152" y="762" width="40" height="10" rx="5" fill="#d7e0ee"/>
  <rect x="208" y="762" width="40" height="10" rx="5" fill="#d7e0ee"/>
</svg>
