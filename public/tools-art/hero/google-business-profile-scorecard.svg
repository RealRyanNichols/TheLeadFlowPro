  <circle cx="1395" cy="552" r="20" fill="#ffffff"/>

  <!-- phone -->
  <ellipse cx="982" cy="818" rx="230" ry="20" fill="#0e1a2e" opacity=".08"/>
  <rect x="810" y="115" width="344" height="674" rx="52" fill="#0e1a2e"/>
  <rect x="1154" y="280" width="8" height="96" rx="4" fill="#0e1a2e"/>
  <rect x="802" y="300" width="8" height="70" rx="4" fill="#0e1a2e"/>
  <rect x="818" y="123" width="328" height="658" rx="44" fill="none" stroke="#ffffff" stroke-width="3" opacity=".12"/>
  <rect x="828" y="133" width="308" height="638" rx="36" fill="#ffffff"/>
  <circle cx="982" cy="158" r="7" fill="#0e1a2e" opacity=".85"/>

