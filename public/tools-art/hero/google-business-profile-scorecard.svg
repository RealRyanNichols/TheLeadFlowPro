  <path d="M 852 242 L 1112 234" stroke="#d7e0ee" stroke-width="7" stroke-linecap="round" fill="none"/>
  <path d="M 962 184 L 950 300" stroke="#d7e0ee" stroke-width="7" stroke-linecap="round" fill="none"/>
  <path d="M 982 258 C 972 244 968 237 968 228 A 14 14 0 1 1 996 228 C 996 237 992 244 982 258 Z"
