<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="gbp-acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f87171"/>
      <stop offset="1" stop-color="#ef4444"/>
    </linearGradient>
    <radialGradient id="gbp-w1">
      <stop offset="0" stop-color="#f87171" stop-opacity=".12"/>
      <stop offset="1" stop-color="#f87171" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gbp-w2">
      <stop offset="0" stop-color="#ef4444" stop-opacity=".07"/>
      <stop offset="1" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>
    <polygon id="gbp-star" points="0,-13 3.2,-4.5 12.4,-4 5.2,1.7 7.6,10.5 0,5.5 -7.6,10.5 -5.2,1.7 -12.4,-4 -3.2,-4.5"/>
  </defs>

  <rect width="1600" height="900" fill="#f7f9fc"/>
  <circle cx="1060" cy="430" r="520" fill="url(#gbp-w1)"/>
  <circle cx="260" cy="220" r="340" fill="url(#gbp-w2)"/>
  <circle cx="1430" cy="780" r="300" fill="url(#gbp-w2)"/>

  <!-- soft map under the phone -->
  <g opacity=".85">
    <g fill="none" stroke="#d7e0ee" stroke-width="16" stroke-linecap="round" opacity=".9">
      <path d="M 660 880 Q 900 620 1080 470 T 1520 120"/>
      <path d="M 640 310 L 1600 250"/>
      <path d="M 700 640 L 1600 600"/>
      <path d="M 940 60 L 900 880"/>
      <path d="M 1300 60 L 1260 880"/>
    </g>
    <g fill="#ffffff" opacity=".75">
      <rect x="1330" y="320" width="180" height="220" rx="16"/>
      <rect x="1340" y="660" width="200" height="150" rx="16"/>
      <rect x="680" y="360" width="190" height="200" rx="16"/>
      <rect x="700" y="660" width="160" height="160" rx="16"/>
      <rect x="990" y="60" width="240" height="170" rx="16"/>
    </g>
    <rect x="1340" y="100" width="200" height="130" rx="16" fill="#b9c6da" opacity=".3"/>
    <circle cx="1390" cy="150" r="10" fill="#8299b8" opacity=".5"/>
    <circle cx="1440" cy="180" r="10" fill="#8299b8" opacity=".5"/>
    <circle cx="1490" cy="140" r="10" fill="#8299b8" opacity=".5"/>
  </g>

  <!-- neutral pin, far side -->
  <path d="M 735 322 C 717 296 710 283 710 265 A 25 25 0 1 1 760 265 C 760 283 753 296 735 322 Z"
        fill="#8299b8" opacity=".8"/>
  <circle cx="735" cy="266" r="10" fill="#ffffff"/>

  <!-- accent pin on the map -->
  <ellipse cx="1395" cy="672" rx="42" ry="9" fill="#0e1a2e" opacity=".08"/>
  <path d="M 1395 660 C 1360 610 1345 585 1345 550 A 50 50 0 1 1 1445 550 C 1445 585 1430 610 1395 660 Z"
