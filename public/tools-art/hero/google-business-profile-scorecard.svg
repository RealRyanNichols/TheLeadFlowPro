  <use href="#gbp-star" x="864" y="404" fill="url(#gbp-acc)"/>
  <use href="#gbp-star" x="898" y="404" fill="url(#gbp-acc)"/>
  <use href="#gbp-star" x="932" y="404" fill="url(#gbp-acc)"/>
  <use href="#gbp-star" x="966" y="404" fill="url(#gbp-acc)"/>
  <use href="#gbp-star" x="1000" y="404" fill="#d7e0ee"/>
  <line x1="846" y1="436" x2="1118" y2="436" stroke="#d7e0ee" stroke-width="3"/>

  <!-- listing: call / directions / hours buttons -->
  <circle cx="886" cy="490" r="30" fill="url(#gbp-acc)"/>
  <circle cx="982" cy="490" r="30" fill="url(#gbp-acc)"/>
  <circle cx="1078" cy="490" r="30" fill="url(#gbp-acc)"/>
  <circle cx="886" cy="490" r="26" fill="none" stroke="#ef4444" stroke-width="3" opacity=".35"/>
  <circle cx="982" cy="490" r="26" fill="none" stroke="#ef4444" stroke-width="3" opacity=".35"/>
  <circle cx="1078" cy="490" r="26" fill="none" stroke="#ef4444" stroke-width="3" opacity=".35"/>
  <path d="M 875 493 A 15 15 0 0 1 889 479" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>
  <circle cx="874" cy="494" r="5" fill="#ffffff"/>
  <circle cx="890" cy="478" r="5" fill="#ffffff"/>
  <polyline points="974,496 974,486 986,486" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="984,478 998,486 984,494" fill="#ffffff"/>
  <circle cx="1078" cy="490" r="13" fill="none" stroke="#ffffff" stroke-width="3"/>
  <line x1="1078" y1="490" x2="1078" y2="481" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <line x1="1078" y1="490" x2="1085" y2="493" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>

  <!-- listing: hours row -->
  <line x1="846" y1="544" x2="1118" y2="544" stroke="#d7e0ee" stroke-width="3"/>
  <circle cx="864" cy="574" r="11" fill="none" stroke="#8299b8" stroke-width="3"/>
  <line x1="864" y1="574" x2="864" y2="567" stroke="#8299b8" stroke-width="3" stroke-linecap="round"/>
  <line x1="864" y1="574" x2="870" y2="577" stroke="#8299b8" stroke-width="3" stroke-linecap="round"/>
  <rect x="890" y="566" width="130" height="12" rx="6" fill="#b9c6da"/>
  <circle cx="1100" cy="572" r="8" fill="url(#gbp-acc)"/>

  <!-- listing: reviews -->
  <line x1="846" y1="610" x2="1118" y2="610" stroke="#d7e0ee" stroke-width="3"/>
  <circle cx="866" cy="646" r="17" fill="#b9c6da"/>
  <rect x="896" y="632" width="110" height="10" rx="5" fill="#8299b8"/>
  <rect x="896" y="652" width="180" height="9" rx="4.5" fill="#d7e0ee"/>
  <use href="#gbp-star" transform="translate(902 678) scale(.5)" fill="url(#gbp-acc)"/>
  <use href="#gbp-star" transform="translate(919 678) scale(.5)" fill="url(#gbp-acc)"/>
  <use href="#gbp-star" transform="translate(936 678) scale(.5)" fill="url(#gbp-acc)"/>
  <use href="#gbp-star" transform="translate(953 678) scale(.5)" fill="url(#gbp-acc)"/>
  <use href="#gbp-star" transform="translate(970 678) scale(.5)" fill="url(#gbp-acc)"/>
  <circle cx="866" cy="712" r="17" fill="#b9c6da"/>
  <rect x="896" y="700" width="90" height="10" rx="5" fill="#8299b8"/>
  <rect x="896" y="718" width="160" height="9" rx="4.5" fill="#d7e0ee"/>
  <!-- score ring -->
  <circle cx="1092" cy="730" r="19" fill="none" stroke="#d7e0ee" stroke-width="7"/>
  <path d="M 1092 711 A 19 19 0 1 1 1073 730" fill="none" stroke="url(#gbp-acc)" stroke-width="7" stroke-linecap="round"/>
</svg>
