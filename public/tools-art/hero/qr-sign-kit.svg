<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="acc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#d946ef"/>
    </linearGradient>
    <radialGradient id="w1"><stop offset="0" stop-color="#a78bfa" stop-opacity=".14"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
    <radialGradient id="w2"><stop offset="0" stop-color="#d946ef" stop-opacity=".08"/><stop offset="1" stop-color="#d946ef" stop-opacity="0"/></radialGradient>
  </defs>

  <rect width="1600" height="900" fill="#f7f9fc"/>
  <ellipse cx="800" cy="400" rx="700" ry="430" fill="url(#w1)"/>
  <ellipse cx="1350" cy="700" rx="380" ry="260" fill="url(#w2)"/>

  <!-- shelf line the pieces stand on -->
  <line x1="120" y1="700" x2="1480" y2="700" stroke="#d7e0ee" stroke-width="4"/>
  <ellipse cx="800" cy="722" rx="620" ry="20" fill="#0e1a2e" opacity=".05"/>

  <!-- shared tiny QR mark, reused at each size via use would need ids; draw a helper group each time -->
  <!-- ============ poster, largest, left ============ -->
  <g>
    <ellipse cx="330" cy="704" rx="170" ry="14" fill="#0e1a2e" opacity=".07"/>
    <rect x="180" y="180" width="300" height="520" rx="14" fill="#ffffff" stroke="#d7e0ee" stroke-width="4"/>
    <rect x="180" y="180" width="300" height="52" rx="14" fill="url(#acc)"/>
    <path d="M180 218 h300 v14 h-300 z" fill="url(#acc)"/>
    <rect x="216" y="258" width="200" height="14" rx="7" fill="#0e1a2e"/>
    <rect x="216" y="284" width="150" height="9" rx="4.5" fill="#b9c6da"/>
    <g transform="translate(234 330) scale(1.92)">
      <g fill="#0e1a2e">
        <rect x="0" y="0" width="28" height="28" rx="4"/><rect x="68" y="0" width="28" height="28" rx="4"/><rect x="0" y="68" width="28" height="28" rx="4"/>
        <rect x="8" y="8" width="12" height="12" fill="#ffffff" rx="2"/><rect x="76" y="8" width="12" height="12" fill="#ffffff" rx="2"/><rect x="8" y="76" width="12" height="12" fill="#ffffff" rx="2"/>
        <rect x="38" y="4" width="10" height="10" rx="2"/><rect x="52" y="18" width="10" height="10" rx="2"/><rect x="38" y="34" width="20" height="20" rx="3"/>
        <rect x="70" y="40" width="10" height="10" rx="2"/><rect x="86" y="52" width="10" height="10" rx="2"/><rect x="40" y="66" width="10" height="10" rx="2"/>
        <rect x="56" y="80" width="10" height="10" rx="2"/><rect x="76" y="72" width="10" height="10" rx="2"/>
      </g>
    </g>
    <rect x="216" y="560" width="228" height="9" rx="4.5" fill="#d7e0ee"/>
    <rect x="216" y="580" width="160" height="9" rx="4.5" fill="#d7e0ee"/>
  </g>

  <!-- ============ counter card, mid ============ -->
  <g>
    <ellipse cx="660" cy="704" rx="110" ry="12" fill="#0e1a2e" opacity=".06"/>
    <path d="M742 420 L790 700 L756 700 L716 470 Z" fill="#b9c6da"/>
    <rect x="550" y="400" width="220" height="300" rx="12" fill="#ffffff" stroke="#d7e0ee" stroke-width="3.4"/>
    <rect x="550" y="400" width="220" height="34" rx="12" fill="url(#acc)"/>
    <path d="M550 424 h220 v10 h-220 z" fill="url(#acc)"/>
    <rect x="576" y="452" width="140" height="11" rx="5.5" fill="#0e1a2e"/>
    <g transform="translate(586 486) scale(1.5)">
      <g fill="#0e1a2e">
        <rect x="0" y="0" width="28" height="28" rx="4"/><rect x="68" y="0" width="28" height="28" rx="4"/><rect x="0" y="68" width="28" height="28" rx="4"/>
        <rect x="8" y="8" width="12" height="12" fill="#ffffff" rx="2"/><rect x="76" y="8" width="12" height="12" fill="#ffffff" rx="2"/><rect x="8" y="76" width="12" height="12" fill="#ffffff" rx="2"/>
        <rect x="38" y="4" width="10" height="10" rx="2"/><rect x="52" y="18" width="10" height="10" rx="2"/><rect x="38" y="34" width="20" height="20" rx="3"/>
        <rect x="70" y="40" width="10" height="10" rx="2"/><rect x="86" y="52" width="10" height="10" rx="2"/><rect x="40" y="66" width="10" height="10" rx="2"/>
        <rect x="56" y="80" width="10" height="10" rx="2"/><rect x="76" y="72" width="10" height="10" rx="2"/>
      </g>
    </g>
    <rect x="576" y="652" width="164" height="8" rx="4" fill="#d7e0ee"/>
  </g>

  <!-- ============ table tent ============ -->
  <g>
    <ellipse cx="950" cy="704" rx="105" ry="11" fill="#0e1a2e" opacity=".06"/>
    <path d="M860 700 L950 480 L1040 700 Z" fill="#ffffff" stroke="#d7e0ee" stroke-width="3.4"/>
    <path d="M860 700 L950 480 L978 548 L916 700 Z" fill="#eef2f8"/>
    <g transform="translate(924 566) scale(0.82)">
      <g fill="#0e1a2e">
        <rect x="0" y="0" width="28" height="28" rx="4"/><rect x="68" y="0" width="28" height="28" rx="4"/><rect x="0" y="68" width="28" height="28" rx="4"/>
        <rect x="8" y="8" width="12" height="12" fill="#ffffff" rx="2"/><rect x="76" y="8" width="12" height="12" fill="#ffffff" rx="2"/><rect x="8" y="76" width="12" height="12" fill="#ffffff" rx="2"/>
        <rect x="38" y="4" width="10" height="10" rx="2"/><rect x="52" y="18" width="10" height="10" rx="2"/><rect x="38" y="34" width="20" height="20" rx="3"/>
        <rect x="70" y="40" width="10" height="10" rx="2"/><rect x="86" y="52" width="10" height="10" rx="2"/><rect x="40" y="66" width="10" height="10" rx="2"/>
      </g>
    </g>
    <rect x="912" y="664" width="76" height="7" rx="3.5" fill="url(#acc)"/>
  </g>

  <!-- ============ sticker, smallest ============ -->
  <g transform="rotate(-8 1150 660)">
    <rect x="1096" y="596" width="110" height="110" rx="14" fill="#ffffff" stroke="#d7e0ee" stroke-width="3"/>
    <g transform="translate(1112 610) scale(0.58)">
      <g fill="#0e1a2e">
        <rect x="0" y="0" width="28" height="28" rx="4"/><rect x="68" y="0" width="28" height="28" rx="4"/><rect x="0" y="68" width="28" height="28" rx="4"/>
        <rect x="8" y="8" width="12" height="12" fill="#ffffff" rx="2"/><rect x="76" y="8" width="12" height="12" fill="#ffffff" rx="2"/><rect x="8" y="76" width="12" height="12" fill="#ffffff" rx="2"/>
        <rect x="38" y="4" width="10" height="10" rx="2"/><rect x="52" y="18" width="10" height="10" rx="2"/><rect x="38" y="34" width="20" height="20" rx="3"/>
        <rect x="70" y="40" width="10" height="10" rx="2"/><rect x="86" y="52" width="10" height="10" rx="2"/>
      </g>
    </g>
    <rect x="1112" y="682" width="78" height="6" rx="3" fill="url(#acc)"/>
  </g>

  <!-- ============ phone scanning the sticker, lower right ============ -->
  <g transform="rotate(12 1340 620)">
    <rect x="1268" y="430" width="150" height="290" rx="24" fill="#0e1a2e"/>
    <rect x="1276" y="438" width="134" height="274" rx="18" fill="#ffffff"/>
    <rect x="1318" y="446" width="46" height="7" rx="3.5" fill="#0e1a2e"/>
    <!-- viewfinder with corners -->
    <g stroke="url(#acc)" stroke-width="6" fill="none" stroke-linecap="round">
      <path d="M1296 500 h-8 v-8 M1388 492 v8 h8 M1296 660 h-8 v8 M1396 660 v8 h-8"/>
      <path d="M1296 492 h18 M1296 492 v18" />
      <path d="M1390 492 h-18 M1390 492 v18"/>
      <path d="M1296 668 h18 M1296 668 v-18"/>
      <path d="M1390 668 h-18 M1390 668 v-18"/>
    </g>
    <line x1="1296" y1="580" x2="1390" y2="580" stroke="url(#acc)" stroke-width="5" opacity=".75"/>
    <rect x="1316" y="686" width="54" height="10" rx="5" fill="#d7e0ee"/>
  </g>

  <!-- ============ tape measure along the base ============ -->
  <g>
    <rect x="150" y="742" width="1180" height="34" rx="8" fill="#f2c94c" opacity=".92"/>
    <g stroke="#8a5a00" stroke-width="3">
      <line x1="210" y1="742" x2="210" y2="760"/><line x1="290" y1="742" x2="290" y2="754"/>
      <line x1="370" y1="742" x2="370" y2="760"/><line x1="450" y1="742" x2="450" y2="754"/>
      <line x1="530" y1="742" x2="530" y2="760"/><line x1="610" y1="742" x2="610" y2="754"/>
      <line x1="690" y1="742" x2="690" y2="760"/><line x1="770" y1="742" x2="770" y2="754"/>
      <line x1="850" y1="742" x2="850" y2="760"/><line x1="930" y1="742" x2="930" y2="754"/>
      <line x1="1010" y1="742" x2="1010" y2="760"/><line x1="1090" y1="742" x2="1090" y2="754"/>
      <line x1="1170" y1="742" x2="1170" y2="760"/><line x1="1250" y1="742" x2="1250" y2="754"/>
    </g>
    <rect x="1330" y="734" width="46" height="50" rx="8" fill="#8a5a00"/>
    <rect x="1344" y="750" width="18" height="18" rx="4" fill="#f7f9fc"/>
  </g>
</svg>
