  <rect x="140" y="300" width="520" height="480" fill="#ffffff" stroke="#d7e0ee" stroke-width="3"/>
  <rect x="126" y="270" width="548" height="34" rx="8" fill="#b9c6da" opacity=".6"/>
  <!-- sign board -->
  <rect x="170" y="322" width="460" height="64" rx="10" fill="#0e1a2e"/>
  <rect x="205" y="345" width="150" height="18" rx="9" fill="#ffffff" opacity=".92"/>
  <rect x="375" y="345" width="90" height="18" rx="9" fill="#ffffff" opacity=".55"/>
  <!-- awning: scalloped stripes -->
  <g stroke="#d7e0ee" stroke-width="2">
