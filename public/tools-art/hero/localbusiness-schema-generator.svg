  <path d="M330,148 c-24,0 -41,18 -41,39 c0,29 41,63 41,63 c0,0 41,-34 41,-63 c0,-21 -17,-39 -41,-39 z" fill="url(#ls-gv)"/>
  <circle cx="330" cy="189" r="12" fill="#ffffff"/>
  <!-- callout dots -->
  <circle cx="628" cy="354" r="8" fill="#22d3ee" stroke="#ffffff" stroke-width="3"/>
  <circle cx="490" cy="560" r="8" fill="#22d3ee" stroke="#ffffff" stroke-width="3"/>

  <!-- structured data card -->
  <ellipse cx="1215" cy="742" rx="240" ry="15" fill="#0e1a2e" opacity=".06"/>
  <rect x="960" y="200" width="510" height="520" rx="20" fill="#ffffff" stroke="#d7e0ee" stroke-width="3"/>
  <line x1="960" y1="258" x2="1470" y2="258" stroke="#d7e0ee" stroke-width="3"/>
  <circle cx="996" cy="229" r="7" fill="#b9c6da"/>
  <circle cx="1020" cy="229" r="7" fill="#b9c6da"/>
  <circle cx="1044" cy="229" r="7" fill="#22d3ee"/>
