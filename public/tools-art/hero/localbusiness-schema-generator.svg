    <path d="M220,398 h60 v46 a30,30 0 0 1 -60,0 z" fill="#ffffff"/>
    <path d="M280,398 h60 v46 a30,30 0 0 1 -60,0 z" fill="url(#ls-gv)"/>
    <path d="M340,398 h60 v46 a30,30 0 0 1 -60,0 z" fill="#ffffff"/>
    <path d="M400,398 h60 v46 a30,30 0 0 1 -60,0 z" fill="url(#ls-gv)"/>
    <path d="M460,398 h60 v46 a30,30 0 0 1 -60,0 z" fill="#ffffff"/>
    <path d="M520,398 h60 v46 a30,30 0 0 1 -60,0 z" fill="url(#ls-gv)"/>
    <path d="M580,398 h60 v46 a30,30 0 0 1 -60,0 z" fill="#ffffff"/>
  </g>
  <line x1="160" y1="398" x2="640" y2="398" stroke="#b9c6da" stroke-width="3"/>
  <!-- window -->
  <rect x="185" y="505" width="235" height="195" fill="#d7e0ee" opacity=".4" stroke="#b9c6da" stroke-width="4"/>
  <line x1="302" y1="505" x2="302" y2="700" stroke="#ffffff" stroke-width="5"/>
  <line x1="185" y1="600" x2="420" y2="600" stroke="#ffffff" stroke-width="5"/>
  <rect x="173" y="700" width="259" height="14" rx="4" fill="#b9c6da" opacity=".6"/>
  <!-- hours plate -->
  <rect x="440" y="524" width="52" height="76" rx="6" fill="#ffffff" stroke="#d7e0ee" stroke-width="3"/>
  <rect x="450" y="538" width="32" height="6" rx="3" fill="#8299b8"/>
  <rect x="450" y="552" width="32" height="6" rx="3" fill="#8299b8"/>
  <rect x="450" y="566" width="32" height="6" rx="3" fill="#8299b8"/>
  <circle cx="466" cy="586" r="7" fill="none" stroke="#8299b8" stroke-width="3"/>
