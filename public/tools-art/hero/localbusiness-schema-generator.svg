<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="ls-g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="ls-gv" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <radialGradient id="ls-w1"><stop offset="0" stop-color="#22d3ee" stop-opacity=".11"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
    <radialGradient id="ls-w2"><stop offset="0" stop-color="#3b82f6" stop-opacity=".09"/><stop offset="1" stop-color="#3b82f6" stop-opacity="0"/></radialGradient>
  </defs>

  <rect width="1600" height="900" fill="#f7f9fc"/>
  <circle cx="1250" cy="200" r="460" fill="url(#ls-w1)"/>
  <circle cx="300" cy="740" r="440" fill="url(#ls-w2)"/>
  <circle cx="760" cy="140" r="300" fill="url(#ls-w1)"/>

  <!-- mapping lines -->
  <path d="M372,200 C640,140 840,220 1048,313" fill="none" stroke="#3b82f6" stroke-width="3.5" stroke-dasharray="10 9" opacity=".55"/>
  <path d="M634,354 C800,360 900,368 1048,367" fill="none" stroke="#3b82f6" stroke-width="3.5" stroke-dasharray="10 9" opacity=".55"/>
  <path d="M494,560 C740,560 880,470 1048,421" fill="none" stroke="#3b82f6" stroke-width="3.5" stroke-dasharray="10 9" opacity=".55"/>
  <circle cx="1048" cy="313" r="6" fill="#3b82f6"/>
  <circle cx="1048" cy="367" r="6" fill="#3b82f6"/>
  <circle cx="1048" cy="421" r="6" fill="#3b82f6"/>

  <!-- storefront -->
