  <path d="M1032,296 C994,296 1018,392 990,414 C1018,436 994,532 1032,532" fill="none" stroke="#8299b8" stroke-width="5" stroke-linecap="round"/>
  <!-- rows -->
  <rect x="1060" y="300" width="88" height="26" rx="13" fill="url(#ls-g)"/>
  <circle cx="1166" cy="313" r="4" fill="#8299b8"/>
  <rect x="1184" y="300" width="236" height="26" rx="13" fill="#d7e0ee"/>
  <rect x="1060" y="354" width="88" height="26" rx="13" fill="url(#ls-g)"/>
  <circle cx="1166" cy="367" r="4" fill="#8299b8"/>
  <rect x="1184" y="354" width="160" height="26" rx="13" fill="#d7e0ee"/>
  <rect x="1060" y="408" width="88" height="26" rx="13" fill="url(#ls-g)"/>
  <circle cx="1166" cy="421" r="4" fill="#8299b8"/>
  <rect x="1184" y="408" width="200" height="26" rx="13" fill="#d7e0ee"/>
  <rect x="1096" y="462" width="72" height="26" rx="13" fill="#b9c6da"/>
  <rect x="1186" y="462" width="140" height="26" rx="13" fill="#d7e0ee"/>
  <rect x="1096" y="516" width="72" height="26" rx="13" fill="#b9c6da"/>
  <rect x="1186" y="516" width="190" height="26" rx="13" fill="#d7e0ee"/>
  <rect x="1060" y="580" width="88" height="26" rx="13" fill="url(#ls-g)"/>
  <circle cx="1166" cy="593" r="4" fill="#8299b8"/>
  <rect x="1184" y="580" width="120" height="26" rx="13" fill="#d7e0ee"/>
  <circle cx="1076" cy="652" r="5" fill="#b9c6da"/>
  <circle cx="1098" cy="652" r="5" fill="#b9c6da"/>
  <circle cx="1120" cy="652" r="5" fill="#b9c6da"/>
  <!-- search badge on card corner -->
  <circle cx="1450" cy="214" r="38" fill="url(#ls-g)"/>
  <circle cx="1443" cy="207" r="13" fill="none" stroke="#ffffff" stroke-width="5"/>
  <line x1="1453" y1="217" x2="1466" y2="230" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
</svg>
