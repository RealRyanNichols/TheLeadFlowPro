<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f87171"/><stop offset="1" stop-color="#ef4444"/>
    </linearGradient>
    <radialGradient id="w1"><stop offset="0" stop-color="#f87171" stop-opacity=".12"/><stop offset="1" stop-color="#f87171" stop-opacity="0"/></radialGradient>
    <radialGradient id="w2"><stop offset="0" stop-color="#ef4444" stop-opacity=".09"/><stop offset="1" stop-color="#ef4444" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1600" height="900" fill="#f7f9fc"/>
  <circle cx="300" cy="240" r="500" fill="url(#w1)"/>
  <circle cx="1320" cy="660" r="460" fill="url(#w2)"/>

  <!-- cost ring -->
  <circle cx="800" cy="430" r="330" fill="none" stroke="#b9c6da" stroke-width="4" stroke-dasharray="3 18" stroke-linecap="round"/>

  <!-- truck, centered, facing left -->
  <ellipse cx="820" cy="686" rx="340" ry="22" fill="#0e1a2e" opacity=".07"/>
  <g>
    <rect x="752" y="452" width="368" height="90" rx="8" fill="#0e1a2e"/>
    <path d="M560 528 L560 500 Q560 484 576 480 L604 474 L648 392 Q654 380 668 380 H746 Q760 380 760 392 V528 Z" fill="#0e1a2e"/>
    <rect x="540" y="520" width="580" height="88" rx="12" fill="#0e1a2e"/>
    <path d="M660 396 L740 396 L740 462 L630 462 Z" fill="#ffffff"/>
    <rect x="540" y="556" width="580" height="14" fill="url(#acc)" opacity=".9"/>
    <rect x="528" y="562" width="22" height="34" rx="7" fill="#8299b8"/>
    <rect x="546" y="530" width="12" height="18" rx="4" fill="#ffffff" opacity=".9"/>
    <line x1="778" y1="470" x2="1104" y2="470" stroke="#ffffff" stroke-width="3" opacity=".25"/>
    <circle cx="648" cy="616" r="54" fill="#0e1a2e" stroke="#f7f9fc" stroke-width="10"/>
    <circle cx="648" cy="616" r="22" fill="#ffffff"/><circle cx="648" cy="616" r="9" fill="#0e1a2e"/>
    <circle cx="1002" cy="616" r="54" fill="#0e1a2e" stroke="#f7f9fc" stroke-width="10"/>
    <circle cx="1002" cy="616" r="22" fill="#ffffff"/><circle cx="1002" cy="616" r="9" fill="#0e1a2e"/>
  </g>

  <!-- odometer, forward -->
  <rect x="650" y="700" width="340" height="86" rx="18" fill="#0e1a2e"/>
  <g>
    <rect x="672" y="716" width="50" height="54" rx="8" fill="#ffffff"/>
    <rect x="734" y="716" width="50" height="54" rx="8" fill="#ffffff"/>
    <rect x="796" y="716" width="50" height="54" rx="8" fill="#ffffff"/>
    <rect x="858" y="716" width="50" height="54" rx="8" fill="#ffffff"/>
    <rect x="920" y="716" width="50" height="54" rx="8" fill="url(#acc)"/>
  </g>
  <g fill="#8299b8">
    <rect x="686" y="736" width="22" height="9" rx="4"/>
    <rect x="748" y="730" width="22" height="9" rx="4"/>
    <rect x="810" y="742" width="22" height="9" rx="4"/>
    <rect x="872" y="734" width="22" height="9" rx="4"/>
  </g>
  <rect x="934" y="738" width="22" height="9" rx="4" fill="#ffffff" opacity=".9"/>

  <!-- cost badges on the ring -->
  <!-- fuel pump (top) -->
  <circle cx="800" cy="100" r="56" fill="#ffffff" stroke="#d7e0ee" stroke-width="3"/>
  <g transform="translate(796 100)" fill="none" stroke="#0e1a2e" stroke-width="5" stroke-linecap="round">
    <rect x="-18" y="-24" width="34" height="46" rx="6"/>
    <rect x="-10" y="-16" width="18" height="12" fill="#0e1a2e" stroke="none"/>
    <path d="M16 -8 C32 -8 32 12 24 20"/>
    <line x1="-24" y1="26" x2="22" y2="26"/>
  </g>
