  <circle cx="567" cy="197" r="56" fill="#ffffff" stroke="#d7e0ee" stroke-width="3"/>
  <path d="M567 168 L591 179 V200 C591 217 581 226 567 231 C553 226 543 217 543 200 V179 Z" fill="none" stroke="#0e1a2e" stroke-width="5" stroke-linejoin="round"/>
  <circle cx="567" cy="199" r="7" fill="url(#acc)"/>
  <!-- tire (left) -->
  <circle cx="470" cy="430" r="56" fill="#ffffff" stroke="#d7e0ee" stroke-width="3"/>
  <circle cx="470" cy="430" r="26" fill="none" stroke="#0e1a2e" stroke-width="13"/>
  <circle cx="470" cy="430" r="8" fill="#0e1a2e"/>
  <g stroke="#ffffff" stroke-width="3" stroke-linecap="round">
    <line x1="470" y1="399" x2="470" y2="409"/><line x1="470" y1="451" x2="470" y2="461"/>
    <line x1="439" y1="430" x2="449" y2="430"/><line x1="491" y1="430" x2="501" y2="430"/>
    <line x1="448" y1="408" x2="455" y2="415"/><line x1="485" y1="445" x2="492" y2="452"/>
    <line x1="492" y1="408" x2="485" y2="415"/><line x1="455" y1="445" x2="448" y2="452"/>
  </g>
  <!-- wrench (upper right) -->
  <circle cx="1033" cy="197" r="56" fill="#ffffff" stroke="#d7e0ee" stroke-width="3"/>
  <g transform="translate(1033 197)" fill="none" stroke="#0e1a2e" stroke-width="7">
    <line x1="-14" y1="14" x2="14" y2="-14" stroke-width="11" stroke-linecap="round"/>
    <path d="M20 -32 A12 12 0 1 0 32 -20"/>
    <path d="M-20 32 A12 12 0 1 0 -32 20"/>
  </g>
  <!-- depreciation (right) -->
  <circle cx="1130" cy="430" r="56" fill="#ffffff" stroke="#d7e0ee" stroke-width="3"/>
  <path d="M1106 416 L1128 438 L1138 428 L1152 442" fill="none" stroke="#0e1a2e" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M1156 446 L1138 444 L1152 430 Z" fill="#0e1a2e"/>
