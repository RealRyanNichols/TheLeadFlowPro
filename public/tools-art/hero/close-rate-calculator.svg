  <path d="M708,508 L738,486 L744,524 Z" fill="#2563eb"/>

  <!-- after panel -->
  <rect x="790" y="215" width="520" height="565" rx="26" fill="#ffffff" stroke="#d7e0ee" stroke-width="3"/>
  <circle cx="832" cy="261" r="11" fill="#b9c6da"/>
  <rect x="855" y="252" width="150" height="18" rx="9" fill="#d7e0ee"/>
  <rect x="1210" y="246" width="58" height="30" rx="15" fill="url(#acc)"/>
  <path d="M1229,266 l10,-11 l10,11" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="814" y1="296" x2="1286" y2="296" stroke="#d7e0ee" stroke-width="3"/>
  <line x1="814" y1="736" x2="1286" y2="736" stroke="#d7e0ee" stroke-width="3"/>
  <use href="#lead" x="862" y="674"/>
