    <radialGradient id="sh" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0e1a2e" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#0e1a2e" stop-opacity="0"/>
    </radialGradient>
    <g id="lead">
      <rect width="56" height="56" rx="12" fill="#ffffff" stroke="#d7e0ee" stroke-width="3"/>
      <circle cx="28" cy="21" r="9" fill="#8299b8"/>
      <path d="M12,44 a16,14 0 0 1 32,0 z" fill="#8299b8"/>
    </g>
    <g id="win">
      <rect width="56" height="56" rx="12" fill="url(#acc)"/>
      <rect x="5" y="42" width="46" height="9" rx="4" fill="#2563eb" opacity="0.35"/>
      <path d="M16,28 l9,10 l16,-19" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </defs>

  <rect width="1600" height="900" fill="#f7f9fc"/>
  <rect width="1600" height="900" fill="url(#w1)"/>
  <rect width="1600" height="900" fill="url(#w2)"/>

  <ellipse cx="430" cy="800" rx="235" ry="24" fill="url(#sh)"/>
  <ellipse cx="1050" cy="802" rx="290" ry="26" fill="url(#sh)"/>

  <!-- before panel -->
  <rect x="215" y="305" width="430" height="475" rx="26" fill="#ffffff" stroke="#d7e0ee" stroke-width="3"/>
  <circle cx="257" cy="349" r="11" fill="#b9c6da"/>
  <rect x="280" y="340" width="130" height="18" rx="9" fill="#d7e0ee"/>
  <line x1="239" y1="384" x2="621" y2="384" stroke="#d7e0ee" stroke-width="3"/>
  <line x1="239" y1="736" x2="621" y2="736" stroke="#d7e0ee" stroke-width="3"/>
  <use href="#lead" x="286" y="674"/>
  <use href="#lead" x="286" y="608"/>
  <use href="#lead" x="286" y="542"/>
  <use href="#lead" x="286" y="476"/>
  <use href="#lead" x="286" y="410"/>
  <g stroke="#b9c6da" stroke-width="4" stroke-linecap="round" fill="none">
    <path d="M374,648 h84"/>
    <path d="M448,637 l12,11 l-12,11"/>
