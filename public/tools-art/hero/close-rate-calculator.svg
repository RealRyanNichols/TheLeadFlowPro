  <use href="#win" x="1128" y="674"/>
  <use href="#win" x="1128" y="608"/>
  <use href="#win" x="1128" y="542"/>
  <use href="#win" x="1128" y="476"/>
  <use href="#win" x="1128" y="410"/>
