<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="md-g" x1="200" y1="600" x2="1400" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="md-gv" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <radialGradient id="md-w1"><stop offset="0" stop-color="#22d3ee" stop-opacity=".12"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
    <radialGradient id="md-w2"><stop offset="0" stop-color="#3b82f6" stop-opacity=".10"/><stop offset="1" stop-color="#3b82f6" stop-opacity="0"/></radialGradient>
  </defs>

  <rect width="1600" height="900" fill="#f7f9fc"/>
  <circle cx="280" cy="130" r="420" fill="url(#md-w1)"/>
  <circle cx="1380" cy="700" r="480" fill="url(#md-w2)"/>
  <circle cx="820" cy="840" r="330" fill="url(#md-w1)"/>

  <!-- map panel -->
  <ellipse cx="800" cy="756" rx="640" ry="20" fill="#0e1a2e" opacity=".06"/>
  <rect x="70" y="90" width="1460" height="640" rx="28" fill="#ffffff" stroke="#d7e0ee" stroke-width="3"/>

  <!-- streets -->
  <line x1="70" y1="300" x2="1530" y2="300" stroke="#d7e0ee" stroke-width="3" opacity=".8"/>
  <line x1="70" y1="520" x2="1530" y2="520" stroke="#d7e0ee" stroke-width="3" opacity=".8"/>
  <line x1="620" y1="90" x2="620" y2="730" stroke="#d7e0ee" stroke-width="3" opacity=".8"/>
  <line x1="1080" y1="90" x2="1080" y2="730" stroke="#d7e0ee" stroke-width="3" opacity=".8"/>

  <!-- city blocks -->
  <rect x="140" y="140" width="220" height="120" rx="10" fill="#b9c6da" opacity=".18"/>
  <rect x="410" y="130" width="170" height="130" rx="10" fill="#b9c6da" opacity=".18"/>
  <rect x="680" y="140" width="170" height="120" rx="10" fill="#b9c6da" opacity=".18"/>
  <rect x="1130" y="130" width="200" height="130" rx="10" fill="#b9c6da" opacity=".18"/>
  <rect x="150" y="345" width="180" height="135" rx="10" fill="#b9c6da" opacity=".18"/>
  <rect x="900" y="345" width="140" height="135" rx="10" fill="#b9c6da" opacity=".18"/>
  <rect x="1130" y="560" width="180" height="130" rx="10" fill="#b9c6da" opacity=".14"/>
  <rect x="250" y="560" width="180" height="130" rx="10" fill="#b9c6da" opacity=".14"/>
  <rect x="680" y="620" width="170" height="90" rx="10" fill="#b9c6da" opacity=".14"/>

  <!-- the logged route -->
  <path d="M170,600 C300,610 350,470 470,455 C570,443 610,560 730,555 C850,550 880,420 1000,405 C1090,394 1140,470 1240,440 C1330,413 1355,340 1395,290"
        fill="none" stroke="#ffffff" stroke-width="24" stroke-linecap="round"/>
  <path d="M170,600 C300,610 350,470 470,455 C570,443 610,560 730,555 C850,550 880,420 1000,405 C1090,394 1140,470 1240,440 C1330,413 1355,340 1395,290"
        fill="none" stroke="url(#md-g)" stroke-width="13" stroke-linecap="round"/>
  <!-- waypoints -->
  <circle cx="470" cy="455" r="10" fill="#ffffff" stroke="#22d3ee" stroke-width="5"/>
  <circle cx="1000" cy="405" r="10" fill="#ffffff" stroke="#3b82f6" stroke-width="5"/>
  <!-- start marker -->
  <circle cx="170" cy="600" r="17" fill="#ffffff" stroke="#22d3ee" stroke-width="6"/>
  <circle cx="170" cy="600" r="6" fill="#22d3ee"/>
  <!-- destination pin -->
  <path d="M1395,192 c-24,0 -41,18 -41,39 c0,29 41,63 41,63 c0,0 41,-34 41,-63 c0,-21 -17,-39 -41,-39 z" fill="url(#md-gv)"/>
  <circle cx="1395" cy="233" r="12" fill="#ffffff"/>

  <!-- work van on the route -->
  <line x1="565" y1="512" x2="612" y2="512" stroke="#8299b8" stroke-width="4" stroke-linecap="round"/>
  <line x1="580" y1="534" x2="620" y2="534" stroke="#8299b8" stroke-width="4" stroke-linecap="round"/>
  <path d="M640,552 v-42 a10,10 0 0 1 10,-10 h108 c9,0 15,3 21,10 l24,26 a12,12 0 0 1 3,8 v8 z" fill="#0e1a2e"/>
  <path d="M766,510 h16 c6,0 10,2 14,7 l14,17 h-44 z" fill="#ffffff" opacity=".92"/>
  <rect x="648" y="524" width="104" height="9" rx="4.5" fill="#22d3ee"/>
  <circle cx="676" cy="554" r="16" fill="#0e1a2e"/><circle cx="676" cy="554" r="6" fill="#ffffff"/>
  <circle cx="778" cy="554" r="16" fill="#0e1a2e"/><circle cx="778" cy="554" r="6" fill="#ffffff"/>

  <!-- mileage log sheet, lower right -->
  <ellipse cx="1315" cy="830" rx="185" ry="14" fill="#0e1a2e" opacity=".07"/>
  <g transform="rotate(4 1315 690)">
    <rect x="1150" y="560" width="330" height="258" rx="14" fill="#ffffff" stroke="#d7e0ee" stroke-width="3"/>
    <rect x="1275" y="546" width="80" height="28" rx="12" fill="#b9c6da"/>
    <circle cx="1315" cy="560" r="7" fill="#ffffff"/>
    <line x1="1178" y1="596" x2="1452" y2="596" stroke="#d7e0ee" stroke-width="2.5"/>
    <!-- rows: check, trip bar, miles bar -->
    <path d="M1180,630 l9,9 l15,-18" fill="none" stroke="#22d3ee" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="1222" y="624" width="130" height="9" rx="4.5" fill="#d7e0ee"/>
    <rect x="1382" y="624" width="60" height="9" rx="4.5" fill="#8299b8"/>
    <path d="M1180,678 l9,9 l15,-18" fill="none" stroke="#22d3ee" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="1222" y="672" width="108" height="9" rx="4.5" fill="#d7e0ee"/>
    <rect x="1382" y="672" width="48" height="9" rx="4.5" fill="#8299b8"/>
    <path d="M1180,726 l9,9 l15,-18" fill="none" stroke="#3b82f6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="1222" y="720" width="120" height="9" rx="4.5" fill="#d7e0ee"/>
    <rect x="1382" y="720" width="54" height="9" rx="4.5" fill="#8299b8"/>
    <circle cx="1191" cy="772" r="9" fill="none" stroke="#b9c6da" stroke-width="4"/>
    <rect x="1222" y="768" width="92" height="9" rx="4.5" fill="#d7e0ee"/>
    <rect x="1382" y="768" width="40" height="9" rx="4.5" fill="#b9c6da"/>
  </g>
</svg>
