<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#0ea371"/>
    </linearGradient>
    <radialGradient id="wa"><stop offset="0" stop-color="#34d399" stop-opacity=".13"/><stop offset="1" stop-color="#34d399" stop-opacity="0"/></radialGradient>
    <radialGradient id="wb"><stop offset="0" stop-color="#0ea371" stop-opacity=".10"/><stop offset="1" stop-color="#0ea371" stop-opacity="0"/></radialGradient>
    <g id="page">
      <rect x="0" y="0" width="120" height="120" rx="14" fill="#ffffff" stroke="#d7e0ee" stroke-width="3"/>
      <path d="M0 14 Q0 0 14 0 H106 Q120 0 120 14 V30 H0 Z" fill="url(#acc)"/>
      <rect x="22" y="-10" width="8" height="22" rx="4" fill="#8299b8"/>
      <rect x="90" y="-10" width="8" height="22" rx="4" fill="#8299b8"/>
      <rect x="30" y="66" width="60" height="12" rx="6" fill="#8299b8"/>
    </g>
  </defs>
  <rect width="1600" height="900" fill="#f7f9fc"/>
  <circle cx="430" cy="270" r="480" fill="url(#wa)"/>
  <circle cx="1160" cy="640" r="500" fill="url(#wb)"/>

  <!-- invoice, left -->
  <ellipse cx="365" cy="794" rx="215" ry="16" fill="#0e1a2e" opacity=".07"/>
  <path d="M188 130 H486 L560 204 V748 Q560 770 538 770 H192 Q170 770 170 748 V152 Q170 130 188 130 Z" fill="#ffffff" stroke="#d7e0ee" stroke-width="3"/>
  <path d="M486 130 L560 204 H486 Z" fill="#d7e0ee" stroke="#d7e0ee" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="238" cy="196" r="18" fill="url(#acc)"/>
  <rect x="274" y="182" width="150" height="14" rx="7" fill="#0e1a2e" opacity=".8"/>
  <rect x="274" y="206" width="96" height="10" rx="5" fill="#8299b8"/>
  <g fill="#b9c6da">
    <rect x="206" y="268" width="160" height="12" rx="6"/>
    <rect x="206" y="316" width="140" height="12" rx="6"/>
    <rect x="206" y="364" width="170" height="12" rx="6"/>
    <rect x="206" y="412" width="130" height="12" rx="6"/>
  </g>
  <g fill="#8299b8">
    <rect x="440" y="268" width="80" height="12" rx="6"/>
    <rect x="440" y="316" width="80" height="12" rx="6"/>
    <rect x="440" y="364" width="80" height="12" rx="6"/>
    <rect x="440" y="412" width="80" height="12" rx="6"/>
  </g>
  <line x1="206" y1="452" x2="524" y2="452" stroke="#d7e0ee" stroke-width="3"/>
  <!-- total block, pre-scored into equal seams -->
  <rect x="200" y="486" width="330" height="108" rx="14" fill="url(#acc)"/>
  <path d="M200 578 H530 V580 Q530 594 516 594 H214 Q200 594 200 580 Z" fill="#0ea371" opacity=".4"/>
  <g stroke="#ffffff" stroke-width="3" stroke-dasharray="8 9" opacity=".65">
    <line x1="266" y1="498" x2="266" y2="582"/>
    <line x1="332" y1="498" x2="332" y2="582"/>
    <line x1="398" y1="498" x2="398" y2="582"/>
    <line x1="464" y1="498" x2="464" y2="582"/>
  </g>
  <rect x="222" y="528" width="90" height="14" rx="7" fill="#ffffff" opacity=".55"/>
  <rect x="392" y="522" width="108" height="24" rx="9" fill="#ffffff" opacity=".95"/>
  <rect x="206" y="634" width="140" height="10" rx="5" fill="#b9c6da" opacity=".7"/>
  <rect x="206" y="658" width="100" height="10" rx="5" fill="#b9c6da" opacity=".7"/>

  <!-- pieces breaking away -->
  <line x1="566" y1="540" x2="648" y2="540" stroke="#0ea371" stroke-width="3" stroke-dasharray="4 10" opacity=".55"/>
  <rect x="580" y="512" width="20" height="20" rx="5" fill="url(#acc)" opacity=".9" transform="rotate(14 590 522)"/>
  <rect x="612" y="552" width="14" height="14" rx="4" fill="url(#acc)" opacity=".6" transform="rotate(-10 619 559)"/>
  <rect x="634" y="522" width="10" height="10" rx="3" fill="url(#acc)" opacity=".4"/>

  <!-- deposit block -->
  <ellipse cx="750" cy="672" rx="100" ry="12" fill="#0e1a2e" opacity=".07"/>
  <rect x="660" y="470" width="180" height="180" rx="18" fill="url(#acc)"/>
  <path d="M660 618 H840 V632 Q840 650 822 650 H678 Q660 650 660 632 Z" fill="#0ea371" opacity=".4"/>
  <circle cx="750" cy="540" r="30" fill="#ffffff" opacity=".95"/>
  <circle cx="750" cy="540" r="19" fill="none" stroke="#0ea371" stroke-width="3" opacity=".55"/>
  <rect x="705" y="590" width="90" height="14" rx="7" fill="#ffffff" opacity=".85"/>

  <!-- monthly payment row: calendar pages -->
  <ellipse cx="1140" cy="646" rx="310" ry="12" fill="#0e1a2e" opacity=".05"/>
  <use href="#page" x="890" y="500"/>
  <use href="#page" x="1035" y="500"/>
  <use href="#page" x="1180" y="500"/>
  <use href="#page" x="1325" y="500"/>
  <path d="M924 598 L938 612 L962 586" fill="none" stroke="#0ea371" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- timeline with calendar ticks -->
  <line x1="660" y1="700" x2="1470" y2="700" stroke="#b9c6da" stroke-width="3"/>
  <path d="M1470 691 L1490 700 L1470 709 Z" fill="#b9c6da"/>
  <g stroke="#8299b8" stroke-width="3">
    <line x1="750" y1="690" x2="750" y2="710"/>
    <line x1="950" y1="690" x2="950" y2="710"/>
    <line x1="1095" y1="690" x2="1095" y2="710"/>
    <line x1="1240" y1="690" x2="1240" y2="710"/>
    <line x1="1385" y1="690" x2="1385" y2="710"/>
  </g>
</svg>
