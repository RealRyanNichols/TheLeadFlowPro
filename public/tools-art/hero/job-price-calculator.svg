  <g transform="rotate(-24 300 660)">
    <rect x="186" y="676" width="230" height="10" rx="5" fill="#0e1a2e" opacity=".06"/>
    <rect x="182" y="646" width="198" height="24" rx="4" fill="#8299b8"/>
