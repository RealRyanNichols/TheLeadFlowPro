<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f87171"/>
      <stop offset="1" stop-color="#ef4444"/>
    </linearGradient>
    <radialGradient id="wr">
      <stop offset="0" stop-color="#f87171" stop-opacity=".11"/>
      <stop offset="1" stop-color="#f87171" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="wr2">
      <stop offset="0" stop-color="#ef4444" stop-opacity=".08"/>
      <stop offset="1" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="#f7f9fc"/>
  <circle cx="800" cy="740" r="420" fill="url(#wr)"/>
  <circle cx="230" cy="280" r="300" fill="url(#wr2)"/>
  <circle cx="1400" cy="230" r="280" fill="url(#wr2)"/>

  <!-- ground shadows -->
  <ellipse cx="545" cy="854" rx="160" ry="16" fill="#0e1a2e" opacity=".07"/>
  <ellipse cx="1055" cy="854" rx="160" ry="16" fill="#0e1a2e" opacity=".07"/>

  <!-- left person -->
  <g fill="#0e1a2e">
    <circle cx="545" cy="372" r="54"/>
    <path d="M 445,845 L 445,620 C 445,505 480,455 545,455 C 610,455 645,505 645,620 L 645,845 Z"/>
    <path d="M 606,600 L 706,552" stroke="#0e1a2e" stroke-width="46" stroke-linecap="round" fill="none"/>
  </g>

  <!-- right person (bun in silhouette) -->
  <g fill="#0e1a2e">
    <circle cx="1055" cy="372" r="54"/>
    <circle cx="1092" cy="320" r="17"/>
    <path d="M 955,845 L 955,620 C 955,505 990,455 1055,455 C 1120,455 1155,505 1155,620 L 1155,845 Z"/>
    <path d="M 994,600 L 894,552" stroke="#0e1a2e" stroke-width="46" stroke-linecap="round" fill="none"/>
  </g>

  <!-- scan arcs where the phones meet -->
  <g fill="none" stroke="#ef4444" stroke-linecap="round">
    <path d="M 772,348 Q 800,320 828,348" stroke-width="7" opacity=".9"/>
    <path d="M 752,322 Q 800,276 848,322" stroke-width="7" opacity=".55"/>
    <path d="M 732,296 Q 800,232 868,296" stroke-width="7" opacity=".3"/>
  </g>

  <!-- phone with QR contact card -->
  <g transform="translate(742 505) rotate(16)">
    <rect x="-70" y="-130" width="140" height="260" rx="22" fill="#0e1a2e"/>
    <rect x="-58" y="-116" width="116" height="232" rx="14" fill="#ffffff"/>
    <!-- QR: finders -->
    <g fill="url(#acc)">
      <rect x="-44" y="-100" width="26" height="26" rx="4"/>
      <rect x="18" y="-100" width="26" height="26" rx="4"/>
      <rect x="-44" y="-38" width="26" height="26" rx="4"/>
    </g>
    <g fill="#ffffff">
      <rect x="-37" y="-93" width="12" height="12" rx="2"/>
      <rect x="25" y="-93" width="12" height="12" rx="2"/>
      <rect x="-37" y="-31" width="12" height="12" rx="2"/>
    </g>
    <!-- QR: modules -->
    <g fill="url(#acc)">
      <rect x="-8" y="-98" width="10" height="10" rx="2"/>
      <rect x="-8" y="-78" width="10" height="10" rx="2"/>
      <rect x="6" y="-64" width="10" height="10" rx="2"/>
      <rect x="-24" y="-64" width="10" height="10" rx="2"/>
      <rect x="-8" y="-50" width="10" height="10" rx="2"/>
      <rect x="20" y="-50" width="10" height="10" rx="2"/>
      <rect x="34" y="-36" width="10" height="10" rx="2"/>
      <rect x="8" y="-32" width="10" height="10" rx="2"/>
    </g>
    <!-- contact strip -->
    <circle cx="-30" cy="52" r="14" fill="#8299b8"/>
    <rect x="-8" y="40" width="56" height="9" rx="4" fill="#b9c6da"/>
    <rect x="-8" y="58" width="42" height="8" rx="4" fill="#d7e0ee"/>
    <line x1="-24" y1="98" x2="24" y2="98" stroke="#d7e0ee" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- phone with saved contact -->
  <g transform="translate(858 505) rotate(-16)">
    <rect x="-70" y="-130" width="140" height="260" rx="22" fill="#0e1a2e"/>
    <rect x="-58" y="-116" width="116" height="232" rx="14" fill="#ffffff"/>
    <circle cx="0" cy="-64" r="27" fill="url(#acc)"/>
    <rect x="-38" y="-22" width="76" height="11" rx="5" fill="#b9c6da"/>
    <rect x="-30" y="2" width="60" height="9" rx="4" fill="#d7e0ee"/>
    <rect x="-38" y="24" width="76" height="9" rx="4" fill="#d7e0ee"/>
    <circle cx="0" cy="76" r="21" fill="url(#acc)"/>
    <path d="M -9,76 L -2,83 L 11,68" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
