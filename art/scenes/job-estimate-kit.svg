<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="acc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <radialGradient id="w1"><stop offset="0" stop-color="#22d3ee" stop-opacity=".13"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
    <radialGradient id="w2"><stop offset="0" stop-color="#3b82f6" stop-opacity=".09"/><stop offset="1" stop-color="#3b82f6" stop-opacity="0"/></radialGradient>
  </defs>

  <rect width="1600" height="900" fill="#f7f9fc"/>
  <ellipse cx="950" cy="420" rx="620" ry="450" fill="url(#w1)"/>
  <ellipse cx="280" cy="240" rx="380" ry="260" fill="url(#w2)"/>

  <!-- ground shadow -->
  <ellipse cx="900" cy="836" rx="360" ry="24" fill="#0e1a2e" opacity=".07"/>

  <!-- ============ the margin sheet behind, offset left, internal ============= -->
  <g transform="rotate(-7 640 480)">
    <rect x="440" y="200" width="400" height="540" rx="14" fill="#eef2f8" stroke="#d7e0ee" stroke-width="3"/>
    <rect x="472" y="238" width="180" height="12" rx="6" fill="#8299b8"/>
    <g>
      <rect x="472" y="278" width="336" height="8" rx="4" fill="#cbd6e5"/>
      <rect x="472" y="304" width="336" height="8" rx="4" fill="#cbd6e5"/>
      <rect x="472" y="330" width="336" height="8" rx="4" fill="#cbd6e5"/>
      <!-- the flagged thin line -->
      <rect x="464" y="350" width="352" height="26" rx="7" fill="#fbe9e7"/>
      <rect x="472" y="359" width="240" height="8" rx="4" fill="#c0605f"/>
      <rect x="744" y="356" width="64" height="14" rx="7" fill="#c0605f"/>
      <rect x="472" y="398" width="336" height="8" rx="4" fill="#cbd6e5"/>
      <rect x="472" y="424" width="336" height="8" rx="4" fill="#cbd6e5"/>
    </g>
  </g>

  <!-- ================= the clipboard estimate, subject ======================= -->
  <g transform="rotate(3 950 480)">
    <!-- board -->
    <rect x="690" y="120" width="520" height="700" rx="26" fill="#b9c6da"/>
    <!-- clip -->
    <rect x="890" y="92" width="120" height="64" rx="16" fill="#8299b8"/>
    <rect x="906" y="76" width="88" height="34" rx="14" fill="#0e1a2e"/>
    <!-- paper -->
    <rect x="714" y="164" width="472" height="628" rx="12" fill="#ffffff"/>
    <!-- brand bar -->
    <rect x="714" y="164" width="472" height="14" fill="url(#acc)"/>
    <!-- letterhead: logo chip + lines -->
    <rect x="750" y="204" width="52" height="52" rx="12" fill="url(#acc)"/>
    <rect x="818" y="212" width="180" height="13" rx="6.5" fill="#0e1a2e"/>
    <rect x="818" y="236" width="120" height="8" rx="4" fill="#b9c6da"/>
    <!-- estimate number chip -->
    <rect x="1044" y="208" width="112" height="30" rx="9" fill="#eef2f8" stroke="#d7e0ee" stroke-width="2"/>
    <rect x="1058" y="219" width="84" height="8" rx="4" fill="#8299b8"/>
    <line x1="750" y1="284" x2="1156" y2="284" stroke="#d7e0ee" stroke-width="2.5"/>

    <!-- line items with prices -->
    <g>
      <rect x="750" y="312" width="240" height="10" rx="5" fill="#0e1a2e" opacity=".68"/>
      <rect x="1082" y="312" width="74" height="10" rx="5" fill="#0e1a2e" opacity=".68"/>
      <rect x="750" y="344" width="204" height="10" rx="5" fill="#b9c6da"/>
      <rect x="1094" y="344" width="62" height="10" rx="5" fill="#b9c6da"/>
      <rect x="750" y="376" width="256" height="10" rx="5" fill="#b9c6da"/>
      <rect x="1086" y="376" width="70" height="10" rx="5" fill="#b9c6da"/>
      <rect x="750" y="408" width="188" height="10" rx="5" fill="#b9c6da"/>
      <rect x="1098" y="408" width="58" height="10" rx="5" fill="#b9c6da"/>
      <line x1="750" y1="440" x2="1156" y2="440" stroke="#0e1a2e" stroke-width="3"/>
      <rect x="750" y="458" width="96" height="12" rx="6" fill="#0e1a2e"/>
      <rect x="1058" y="452" width="98" height="24" rx="7" fill="url(#acc)"/>
    </g>

    <!-- deposit band -->
    <rect x="750" y="504" width="406" height="58" rx="12" fill="#eef7fb" stroke="#bfe3f0" stroke-width="2"/>
    <circle cx="782" cy="533" r="15" fill="url(#acc)"/>
    <path d="M776 533 l5 5 l10 -11" fill="none" stroke="#ffffff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="810" y="520" width="150" height="9" rx="4.5" fill="#0e6f96"/>
    <rect x="810" y="537" width="220" height="8" rx="4" fill="#9ec9db"/>

    <!-- terms lines -->
    <rect x="750" y="590" width="330" height="7" rx="3.5" fill="#d7e0ee"/>
    <rect x="750" y="608" width="380" height="7" rx="3.5" fill="#d7e0ee"/>
    <rect x="750" y="626" width="290" height="7" rx="3.5" fill="#d7e0ee"/>

    <!-- signature lines -->
    <line x1="750" y1="702" x2="990" y2="702" stroke="#0e1a2e" stroke-width="2.5"/>
    <rect x="750" y="712" width="92" height="7" rx="3.5" fill="#b9c6da"/>
    <line x1="1032" y1="702" x2="1156" y2="702" stroke="#0e1a2e" stroke-width="2.5"/>
    <rect x="1032" y="712" width="52" height="7" rx="3.5" fill="#b9c6da"/>
    <!-- a signature scrawl -->
    <path d="M766 694 c 16 -22, 30 -6, 44 -14 c 16 -9, 22 -14, 38 -4 c 12 8, 26 -2, 40 -8"
          fill="none" stroke="#0e1a2e" stroke-width="3.4" stroke-linecap="round"/>
  </g>

  <!-- ======================= the pen, crossing lower third =================== -->
  <g transform="rotate(-24 560 780)">
    <rect x="380" y="762" width="330" height="26" rx="13" fill="#0e1a2e"/>
    <rect x="404" y="762" width="18" height="26" fill="url(#acc)"/>
    <path d="M710 762 l52 10 a4 4 0 0 1 0 6 l-52 10 z" fill="#8299b8"/>
    <path d="M756 770 l16 5 l-16 5 z" fill="#0e1a2e"/>
  </g>
  <ellipse cx="560" cy="812" rx="190" ry="13" fill="#0e1a2e" opacity=".06"/>
</svg>
