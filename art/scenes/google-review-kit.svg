<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="acc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24"/><stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <radialGradient id="w1"><stop offset="0" stop-color="#fbbf24" stop-opacity=".16"/><stop offset="1" stop-color="#fbbf24" stop-opacity="0"/></radialGradient>
    <radialGradient id="w2"><stop offset="0" stop-color="#f97316" stop-opacity=".09"/><stop offset="1" stop-color="#f97316" stop-opacity="0"/></radialGradient>
  </defs>

  <rect width="1600" height="900" fill="#f7f9fc"/>
  <ellipse cx="520" cy="430" rx="600" ry="440" fill="url(#w1)"/>
  <ellipse cx="1280" cy="240" rx="420" ry="300" fill="url(#w2)"/>

  <!-- counter surface -->
  <rect x="0" y="770" width="1600" height="130" fill="#eef2f8"/>
  <line x1="0" y1="770" x2="1600" y2="770" stroke="#d7e0ee" stroke-width="3"/>

  <!-- ground shadows -->
  <ellipse cx="520" cy="792" rx="300" ry="22" fill="#0e1a2e" opacity=".08"/>
  <ellipse cx="1268" cy="788" rx="210" ry="17" fill="#0e1a2e" opacity=".06"/>

  <!-- ================= the counter card, subject, left of center ============= -->
  <g transform="rotate(-3 520 520)">
    <!-- easel back leg -->
    <path d="M700 340 L810 780 L756 780 L668 420 Z" fill="#b9c6da"/>
    <!-- card -->
    <rect x="300" y="240" width="440" height="552" rx="18" fill="#ffffff" stroke="#d7e0ee" stroke-width="4"/>
    <rect x="300" y="240" width="440" height="70" rx="18" fill="url(#acc)"/>
    <rect x="300" y="292" width="440" height="18" fill="url(#acc)"/>
    <!-- headline lines -->
    <rect x="348" y="346" width="300" height="20" rx="10" fill="#0e1a2e"/>
    <rect x="348" y="380" width="222" height="20" rx="10" fill="#0e1a2e" opacity=".82"/>
    <rect x="348" y="418" width="326" height="11" rx="5.5" fill="#b9c6da"/>

    <!-- QR code, chunky and readable -->
    <g transform="translate(374 464)">
      <rect x="-18" y="-18" width="330" height="330" rx="14" fill="#ffffff" stroke="#d7e0ee" stroke-width="3"/>
      <!-- finder squares -->
      <g fill="#0e1a2e">
        <rect x="0" y="0" width="82" height="82" rx="10"/>
        <rect x="212" y="0" width="82" height="82" rx="10"/>
        <rect x="0" y="212" width="82" height="82" rx="10"/>
      </g>
      <g fill="#ffffff">
        <rect x="16" y="16" width="50" height="50" rx="6"/>
        <rect x="228" y="16" width="50" height="50" rx="6"/>
        <rect x="16" y="228" width="50" height="50" rx="6"/>
      </g>
      <g fill="#0e1a2e">
        <rect x="30" y="30" width="22" height="22" rx="3"/>
        <rect x="242" y="30" width="22" height="22" rx="3"/>
        <rect x="30" y="242" width="22" height="22" rx="3"/>
        <!-- data modules -->
        <rect x="108" y="0" width="24" height="24" rx="4"/>
        <rect x="146" y="20" width="24" height="24" rx="4"/>
        <rect x="108" y="58" width="24" height="24" rx="4"/>
        <rect x="184" y="52" width="24" height="24" rx="4"/>
        <rect x="0" y="108" width="24" height="24" rx="4"/>
        <rect x="40" y="128" width="24" height="24" rx="4"/>
        <rect x="82" y="108" width="24" height="24" rx="4"/>
        <rect x="128" y="108" width="40" height="40" rx="6"/>
        <rect x="190" y="118" width="24" height="24" rx="4"/>
        <rect x="240" y="108" width="24" height="24" rx="4"/>
        <rect x="270" y="146" width="24" height="24" rx="4"/>
        <rect x="108" y="168" width="24" height="24" rx="4"/>
        <rect x="146" y="192" width="24" height="24" rx="4"/>
        <rect x="196" y="176" width="24" height="24" rx="4"/>
        <rect x="240" y="204" width="24" height="24" rx="4"/>
        <rect x="108" y="232" width="24" height="24" rx="4"/>
        <rect x="150" y="252" width="24" height="24" rx="4"/>
        <rect x="196" y="240" width="24" height="24" rx="4"/>
        <rect x="240" y="262" width="24" height="24" rx="4"/>
      </g>
    </g>
  </g>

  <!-- ============== stars rising from the card to the review page ============ -->
  <g>
    <path d="M760 420 C 900 330, 1010 300, 1120 288" fill="none" stroke="url(#acc)" stroke-width="6" stroke-linecap="round" stroke-dasharray="2 24" opacity=".6"/>
    <!-- three stars, growing -->
    <path transform="translate(816 392) scale(1.15)" d="M0 -20 L5.9 -6.2 L20 -6.2 L8.6 2.4 L12.9 16 L0 8 L-12.9 16 L-8.6 2.4 L-20 -6.2 L-5.9 -6.2 Z" fill="url(#acc)"/>
    <path transform="translate(950 336) scale(1.5)" d="M0 -20 L5.9 -6.2 L20 -6.2 L8.6 2.4 L12.9 16 L0 8 L-12.9 16 L-8.6 2.4 L-20 -6.2 L-5.9 -6.2 Z" fill="url(#acc)"/>
    <path transform="translate(1096 296) scale(1.9)" d="M0 -20 L5.9 -6.2 L20 -6.2 L8.6 2.4 L12.9 16 L0 8 L-12.9 16 L-8.6 2.4 L-20 -6.2 L-5.9 -6.2 Z" fill="url(#acc)"/>
  </g>

  <!-- ================== the review page, upper right, support ================ -->
  <g transform="rotate(2 1300 300)">
    <rect x="1120" y="128" width="360" height="300" rx="16" fill="#ffffff" stroke="#d7e0ee" stroke-width="3"/>
    <circle cx="1170" cy="184" r="24" fill="#eef2f8" stroke="#d7e0ee" stroke-width="2"/>
    <circle cx="1170" cy="177" r="9" fill="#8299b8"/>
    <path d="M1152 202 a18 12 0 0 1 36 0" fill="#8299b8"/>
    <rect x="1210" y="164" width="150" height="12" rx="6" fill="#0e1a2e" opacity=".7"/>
    <!-- five star row -->
    <g transform="translate(1210 206)">
      <path transform="scale(.55)" d="M0 -20 L5.9 -6.2 L20 -6.2 L8.6 2.4 L12.9 16 L0 8 L-12.9 16 L-8.6 2.4 L-20 -6.2 L-5.9 -6.2 Z" fill="url(#acc)"/>
      <path transform="translate(30 0) scale(.55)" d="M0 -20 L5.9 -6.2 L20 -6.2 L8.6 2.4 L12.9 16 L0 8 L-12.9 16 L-8.6 2.4 L-20 -6.2 L-5.9 -6.2 Z" fill="url(#acc)"/>
      <path transform="translate(60 0) scale(.55)" d="M0 -20 L5.9 -6.2 L20 -6.2 L8.6 2.4 L12.9 16 L0 8 L-12.9 16 L-8.6 2.4 L-20 -6.2 L-5.9 -6.2 Z" fill="url(#acc)"/>
      <path transform="translate(90 0) scale(.55)" d="M0 -20 L5.9 -6.2 L20 -6.2 L8.6 2.4 L12.9 16 L0 8 L-12.9 16 L-8.6 2.4 L-20 -6.2 L-5.9 -6.2 Z" fill="url(#acc)"/>
      <path transform="translate(120 0) scale(.55)" d="M0 -20 L5.9 -6.2 L20 -6.2 L8.6 2.4 L12.9 16 L0 8 L-12.9 16 L-8.6 2.4 L-20 -6.2 L-5.9 -6.2 Z" fill="url(#acc)"/>
    </g>
    <rect x="1152" y="248" width="296" height="10" rx="5" fill="#d7e0ee"/>
    <rect x="1152" y="270" width="270" height="10" rx="5" fill="#d7e0ee"/>
    <rect x="1152" y="292" width="288" height="10" rx="5" fill="#d7e0ee"/>
    <rect x="1152" y="314" width="182" height="10" rx="5" fill="#e6ecf5"/>
    <!-- reply chip -->
    <rect x="1152" y="352" width="188" height="42" rx="12" fill="#eef2f8" stroke="#d7e0ee" stroke-width="2"/>
    <rect x="1172" y="368" width="120" height="10" rx="5" fill="#8299b8"/>
  </g>

  <!-- ======================= till, low right, quiet ========================== -->
  <g>
    <rect x="1150" y="640" width="240" height="132" rx="14" fill="#b9c6da"/>
    <rect x="1166" y="656" width="130" height="52" rx="8" fill="#0e1a2e"/>
    <rect x="1178" y="672" width="72" height="10" rx="5" fill="#f7f9fc" opacity=".7"/>
    <rect x="1310" y="656" width="64" height="100" rx="8" fill="#ffffff"/>
    <line x1="1322" y1="676" x2="1362" y2="676" stroke="#d7e0ee" stroke-width="3"/>
    <line x1="1322" y1="696" x2="1362" y2="696" stroke="#d7e0ee" stroke-width="3"/>
    <line x1="1322" y1="716" x2="1362" y2="716" stroke="#d7e0ee" stroke-width="3"/>
    <rect x="1166" y="722" width="130" height="34" rx="8" fill="#8299b8"/>
  </g>
</svg>
