<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="acc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#0ea371"/>
    </linearGradient>
    <radialGradient id="w1"><stop offset="0" stop-color="#34d399" stop-opacity=".13"/><stop offset="1" stop-color="#34d399" stop-opacity="0"/></radialGradient>
    <radialGradient id="w2"><stop offset="0" stop-color="#0ea371" stop-opacity=".09"/><stop offset="1" stop-color="#0ea371" stop-opacity="0"/></radialGradient>
  </defs>

  <rect width="1600" height="900" fill="#f7f9fc"/>
  <ellipse cx="640" cy="420" rx="620" ry="440" fill="url(#w1)"/>
  <ellipse cx="1330" cy="260" rx="380" ry="280" fill="url(#w2)"/>

  <!-- table surface -->
  <line x1="0" y1="760" x2="1600" y2="760" stroke="#d7e0ee" stroke-width="3"/>
  <ellipse cx="700" cy="784" rx="480" ry="22" fill="#0e1a2e" opacity=".06"/>

  <!-- ============ worksheet lying flat behind, perspective ================== -->
  <g>
    <path d="M760 560 L1250 500 L1420 640 L900 730 Z" fill="#eef2f8" stroke="#d7e0ee" stroke-width="3"/>
    <path d="M810 574 L1040 546 L1052 560 L820 590 Z" fill="#cbd6e5"/>
    <path d="M830 606 L1180 562 L1188 574 L838 620 Z" fill="#d7e0ee"/>
    <path d="M850 640 L1200 594 L1208 606 L858 654 Z" fill="#d7e0ee"/>
    <path d="M870 674 L1120 642 L1128 654 L878 688 Z" fill="#d7e0ee"/>
    <!-- highlighted total row -->
    <path d="M888 704 L1240 656 L1250 670 L898 720 Z" fill="url(#acc)" opacity=".55"/>
  </g>

  <!-- ================= the rate card standing, subject ====================== -->
  <g transform="rotate(-2 480 470)">
    <!-- easel leg -->
    <path d="M640 300 L716 758 L668 758 L604 360 Z" fill="#b9c6da"/>
    <rect x="230" y="180" width="420" height="580" rx="18" fill="#ffffff" stroke="#d7e0ee" stroke-width="4"/>
    <rect x="230" y="180" width="420" height="64" rx="18" fill="#0e1a2e"/>
    <path d="M230 226 h420 v18 h-420 z" fill="#0e1a2e"/>
    <rect x="266" y="202" width="150" height="14" rx="7" fill="#ffffff" opacity=".9"/>
    <!-- service rows with price chips -->
    <g>
      <rect x="272" y="284" width="196" height="12" rx="6" fill="#0e1a2e" opacity=".7"/>
      <rect x="536" y="278" width="76" height="26" rx="8" fill="url(#acc)"/>
      <line x1="272" y1="330" x2="612" y2="330" stroke="#eef2f8" stroke-width="3"/>
      <rect x="272" y="356" width="166" height="12" rx="6" fill="#0e1a2e" opacity=".7"/>
      <rect x="536" y="350" width="76" height="26" rx="8" fill="url(#acc)"/>
      <line x1="272" y1="402" x2="612" y2="402" stroke="#eef2f8" stroke-width="3"/>
      <rect x="272" y="428" width="220" height="12" rx="6" fill="#0e1a2e" opacity=".7"/>
      <rect x="536" y="422" width="76" height="26" rx="8" fill="url(#acc)"/>
      <line x1="272" y1="474" x2="612" y2="474" stroke="#eef2f8" stroke-width="3"/>
      <rect x="272" y="500" width="180" height="12" rx="6" fill="#0e1a2e" opacity=".7"/>
      <rect x="536" y="494" width="76" height="26" rx="8" fill="url(#acc)"/>
      <line x1="272" y1="546" x2="612" y2="546" stroke="#eef2f8" stroke-width="3"/>
      <rect x="272" y="572" width="204" height="12" rx="6" fill="#0e1a2e" opacity=".7"/>
      <rect x="536" y="566" width="76" height="26" rx="8" fill="url(#acc)"/>
    </g>
    <!-- footer band -->
    <rect x="272" y="646" width="230" height="10" rx="5" fill="#b9c6da"/>
    <rect x="272" y="668" width="170" height="10" rx="5" fill="#d7e0ee"/>
    <rect x="272" y="706" width="120" height="24" rx="8" fill="#eef2f8" stroke="#d7e0ee" stroke-width="2"/>
  </g>

  <!-- ================= rising price tag, right ============================== -->
  <g>
    <!-- the rising arrow -->
    <path d="M980 470 C 1090 430, 1180 350, 1280 250" fill="none" stroke="url(#acc)" stroke-width="10" stroke-linecap="round"/>
    <path d="M1280 250 l-44 4 M1280 250 l-8 42" stroke="url(#acc)" stroke-width="10" stroke-linecap="round"/>
    <!-- the tag hanging off the arrow's midpoint -->
    <g transform="rotate(14 1150 420)">
      <path d="M1064 356 L1204 356 L1246 398 L1246 500 L1064 500 Z" fill="#ffffff" stroke="#d7e0ee" stroke-width="4"/>
      <circle cx="1216" cy="392" r="12" fill="#f7f9fc" stroke="#8299b8" stroke-width="4"/>
      <path d="M1216 380 C 1240 330, 1210 316, 1188 336" fill="none" stroke="#8299b8" stroke-width="5" stroke-linecap="round"/>
      <!-- big price mark: a bold S-curve dollar suggestion drawn as shapes -->
      <rect x="1092" y="398" width="94" height="16" rx="8" fill="url(#acc)"/>
      <rect x="1092" y="428" width="128" height="16" rx="8" fill="#0e1a2e"/>
      <rect x="1092" y="458" width="72" height="12" rx="6" fill="#b9c6da"/>
    </g>
  </g>

  <!-- old crossed-out chip, small, grounding the story -->
  <g transform="rotate(-6 380 806)">
    <rect x="330" y="788" width="104" height="34" rx="10" fill="#ffffff" stroke="#d7e0ee" stroke-width="3"/>
    <rect x="346" y="801" width="70" height="9" rx="4.5" fill="#b9c6da"/>
    <line x1="338" y1="806" x2="426" y2="806" stroke="#c0605f" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
