    <circle cx="616" cy="797" r="13"/>
    <circle cx="744" cy="797" r="13"/>
  </g>
  <circle cx="597" cy="448" r="25" fill="url(#g)"/>
  <rect x="584" y="444" width="26" height="8" rx="4" fill="#ffffff"/>
  <rect x="593" y="435" width="8" height="26" rx="4" fill="#ffffff"/>

  <!-- price tags -->
  <path d="M80,494 Q66,504 52,518" stroke="#8299b8" stroke-width="3" fill="none"/>
  <g transform="translate(28,512) rotate(-18)">
