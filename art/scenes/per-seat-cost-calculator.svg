      <circle cx="-64" cy="-13" r="13"/>
      <circle cx="64" cy="-13" r="13"/>
    </g>
  </defs>
  <rect width="1600" height="900" fill="#f7f9fc"/>
  <ellipse cx="1230" cy="300" rx="440" ry="340" fill="url(#wA)"/>
  <ellipse cx="380" cy="680" rx="470" ry="250" fill="url(#wB)"/>
  <ellipse cx="130" cy="140" rx="260" ry="180" fill="url(#wA)"/>

