<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f87171"/><stop offset="1" stop-color="#ef4444"/>
    </linearGradient>
    <radialGradient id="w1"><stop offset="0" stop-color="#f87171" stop-opacity=".13"/><stop offset="1" stop-color="#f87171" stop-opacity="0"/></radialGradient>
    <radialGradient id="w2"><stop offset="0" stop-color="#ef4444" stop-opacity=".09"/><stop offset="1" stop-color="#ef4444" stop-opacity="0"/></radialGradient>
    <pattern id="hatch" width="24" height="24" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <line x1="0" y1="0" x2="0" y2="24" stroke="#f87171" stroke-opacity=".30" stroke-width="5"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="#f7f9fc"/>
  <circle cx="420" cy="190" r="520" fill="url(#w1)"/>
  <circle cx="1330" cy="700" r="470" fill="url(#w2)"/>

  <!-- ground shadows -->
  <ellipse cx="800" cy="650" rx="540" ry="22" fill="#0e1a2e" opacity=".06"/>
  <ellipse cx="800" cy="826" rx="560" ry="20" fill="#0e1a2e" opacity=".05"/>

  <!-- week panel -->
  <rect x="190" y="80" width="1220" height="540" rx="24" fill="#ffffff" stroke="#d7e0ee" stroke-width="3"/>

  <!-- day header pills -->
  <rect x="287" y="114" width="90" height="18" rx="9" fill="#b9c6da"/>
  <rect x="521" y="114" width="90" height="18" rx="9" fill="#b9c6da"/>
  <rect x="755" y="114" width="90" height="18" rx="9" fill="#b9c6da"/>
  <rect x="989" y="114" width="90" height="18" rx="9" fill="#b9c6da"/>
  <rect x="1223" y="114" width="90" height="18" rx="9" fill="#b9c6da"/>
  <line x1="220" y1="156" x2="1380" y2="156" stroke="#d7e0ee" stroke-width="3"/>

  <!-- protected buffer zone above the capacity line -->
  <rect x="220" y="164" width="1160" height="80" fill="#f87171" opacity=".06"/>
  <rect x="220" y="164" width="1160" height="80" fill="url(#hatch)"/>

  <!-- job blocks -->
  <g stroke="#d7e0ee" stroke-width="3" fill="#ffffff">
    <rect x="227" y="480" width="210" height="90" rx="10"/>
    <rect x="227" y="390" width="210" height="80" rx="10"/>
    <rect x="227" y="310" width="210" height="70" rx="10"/>
    <rect x="461" y="490" width="210" height="80" rx="10"/>
    <rect x="461" y="410" width="210" height="70" rx="10"/>
    <rect x="461" y="325" width="210" height="75" rx="10"/>
    <rect x="695" y="495" width="210" height="75" rx="10"/>
    <rect x="695" y="410" width="210" height="75" rx="10"/>
    <rect x="695" y="330" width="210" height="70" rx="10"/>
    <rect x="929" y="480" width="210" height="90" rx="10"/>
    <rect x="929" y="395" width="210" height="75" rx="10"/>
    <rect x="1163" y="485" width="210" height="85" rx="10"/>
  </g>
  <g fill="#f87171" fill-opacity=".15">
    <rect x="227" y="480" width="210" height="90" rx="10"/>
    <rect x="227" y="390" width="210" height="80" rx="10"/>
    <rect x="461" y="490" width="210" height="80" rx="10"/>
    <rect x="461" y="410" width="210" height="70" rx="10"/>
    <rect x="461" y="325" width="210" height="75" rx="10"/>
    <rect x="695" y="495" width="210" height="75" rx="10"/>
    <rect x="695" y="410" width="210" height="75" rx="10"/>
    <rect x="695" y="330" width="210" height="70" rx="10"/>
    <rect x="929" y="480" width="210" height="90" rx="10"/>
    <rect x="1163" y="485" width="210" height="85" rx="10"/>
  </g>
  <!-- left ticks inside blocks -->
  <g fill="#ef4444" opacity=".8">
    <rect x="241" y="492" width="8" height="66" rx="4"/><rect x="241" y="402" width="8" height="56" rx="4"/>
    <rect x="475" y="502" width="8" height="56" rx="4"/><rect x="475" y="422" width="8" height="46" rx="4"/><rect x="475" y="337" width="8" height="51" rx="4"/>
    <rect x="709" y="507" width="8" height="51" rx="4"/><rect x="709" y="422" width="8" height="51" rx="4"/><rect x="709" y="342" width="8" height="46" rx="4"/>
    <rect x="943" y="492" width="8" height="66" rx="4"/>
    <rect x="1177" y="497" width="8" height="61" rx="4"/>
  </g>
  <g fill="#b9c6da">
    <rect x="241" y="322" width="8" height="46" rx="4"/>
    <rect x="943" y="407" width="8" height="51" rx="4"/>
  </g>
  <!-- column 3 top block hits the limit -->
  <rect x="695" y="250" width="210" height="70" rx="10" fill="url(#acc)"/>
  <rect x="695" y="250" width="210" height="14" rx="7" fill="#ef4444" opacity=".35"/>
  <rect x="709" y="262" width="8" height="46" rx="4" fill="#ffffff" opacity=".85"/>

  <!-- capacity line -->
  <line x1="220" y1="250" x2="1380" y2="250" stroke="#ef4444" stroke-width="5" stroke-dasharray="20 12"/>
  <rect x="1312" y="226" width="68" height="48" rx="10" fill="url(#acc)"/>
  <line x1="1326" y1="238" x2="1366" y2="238" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
  <line x1="1346" y1="264" x2="1346" y2="252" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
  <path d="M1338 252 H1354 L1346 244 Z" fill="#ffffff"/>

  <!-- title band bottom -->
  <rect x="190" y="680" width="1220" height="120" rx="20" fill="#ffffff" stroke="#d7e0ee" stroke-width="3"/>
  <rect x="224" y="708" width="64" height="64" rx="14" fill="url(#acc)"/>
  <rect x="224" y="708" width="64" height="14" rx="7" fill="#ef4444" opacity=".3"/>
  <g fill="#ffffff" opacity=".95">
    <rect x="240" y="740" width="10" height="18" rx="3"/>
    <rect x="254" y="730" width="10" height="28" rx="3"/>
    <rect x="268" y="722" width="10" height="36" rx="3"/>
  </g>
  <rect x="312" y="714" width="310" height="20" rx="10" fill="#b9c6da"/>
  <rect x="312" y="748" width="200" height="14" rx="7" fill="#d7e0ee"/>
  <!-- capacity meter -->
  <rect x="1010" y="730" width="320" height="16" rx="8" fill="#d7e0ee"/>
  <rect x="1010" y="730" width="272" height="16" rx="8" fill="url(#acc)"/>
  <line x1="1282" y1="720" x2="1282" y2="756" stroke="#0e1a2e" stroke-width="4" stroke-linecap="round"/>
</svg>
