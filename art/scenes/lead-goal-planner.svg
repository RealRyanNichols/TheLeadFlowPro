<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <radialGradient id="wa"><stop offset="0" stop-color="#22d3ee" stop-opacity=".14"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
    <radialGradient id="wb"><stop offset="0" stop-color="#3b82f6" stop-opacity=".11"/><stop offset="1" stop-color="#3b82f6" stop-opacity="0"/></radialGradient>
    <g id="doc">
      <path d="M0 8 Q0 0 8 0 H36 L54 18 V64 Q54 72 46 72 H8 Q0 72 0 64 Z" fill="#fff" stroke="#8299b8" stroke-width="3"/>
      <path d="M36 0 L54 18 H36 Z" fill="#d7e0ee" stroke="#8299b8" stroke-width="3" stroke-linejoin="round"/>
      <rect x="12" y="32" width="28" height="6" rx="3" fill="#b9c6da"/>
      <rect x="12" y="46" width="20" height="6" rx="3" fill="#b9c6da"/>
    </g>
    <path id="bub" d="M12 0 H40 Q52 0 52 12 V26 Q52 38 40 38 H24 L9 52 L13 38 Q0 38 0 26 V12 Q0 0 12 0 Z"/>
    <g id="per">
      <circle cx="13" cy="8" r="8"/>
      <path d="M0 32 Q0 15 13 15 Q26 15 26 32 Z"/>
    </g>
  </defs>
  <rect width="1600" height="900" fill="#f7f9fc"/>
  <circle cx="1240" cy="230" r="520" fill="url(#wa)"/>
  <circle cx="330" cy="720" r="470" fill="url(#wb)"/>
  <circle cx="760" cy="480" r="300" fill="url(#wa)" opacity=".6"/>

  <!-- goal: target disc with summit flag, top right -->
  <ellipse cx="1275" cy="372" rx="126" ry="15" fill="#0e1a2e" opacity=".07"/>
  <rect x="1271" y="40" width="9" height="84" rx="4" fill="#0e1a2e"/>
  <path d="M1280 46 L1366 70 L1280 94 Z" fill="url(#acc)"/>
  <circle cx="1275" cy="235" r="118" fill="url(#acc)"/>
  <path d="M1173 294 A 118 118 0 0 0 1361 300" fill="none" stroke="#0e1a2e" stroke-width="14" opacity=".12"/>
  <circle cx="1275" cy="235" r="84" fill="#ffffff"/>
  <circle cx="1275" cy="235" r="52" fill="url(#acc)"/>
  <circle cx="1275" cy="235" r="22" fill="#ffffff"/>
  <circle cx="1275" cy="235" r="8" fill="#0e1a2e"/>

  <!-- elbow connectors down the cascade -->
  <g fill="none" stroke="#8299b8" stroke-width="3">
    <path d="M1275 356 V430 H1162"/>
    <path d="M845 508 V590 H812"/>
    <path d="M495 668 V750 H462"/>
  </g>
  <g fill="#3b82f6">
    <circle cx="1275" cy="430" r="5"/>
    <circle cx="845" cy="590" r="5"/>
    <circle cx="495" cy="750" r="5"/>
  </g>
  <g fill="#8299b8">
    <path d="M1162 430 L1178 421 V439 Z"/>
    <path d="M812 590 L828 581 V599 Z"/>
    <path d="M462 750 L478 741 V759 Z"/>
  </g>

  <!-- step 1: quotes -->
  <ellipse cx="970" cy="516" rx="160" ry="12" fill="#0e1a2e" opacity=".06"/>
  <rect x="800" y="355" width="340" height="150" rx="20" fill="#ffffff" stroke="#d7e0ee" stroke-width="3"/>
  <rect x="828" y="381" width="110" height="12" rx="6" fill="#0e1a2e" opacity=".7"/>
  <rect x="1060" y="377" width="52" height="20" rx="10" fill="url(#acc)" opacity=".9"/>
  <use href="#doc" x="832" y="410"/>
  <use href="#doc" x="910" y="410"/>
  <use href="#doc" x="988" y="410"/>

  <!-- step 2: conversations -->
  <ellipse cx="620" cy="676" rx="160" ry="12" fill="#0e1a2e" opacity=".06"/>
  <rect x="450" y="515" width="340" height="150" rx="20" fill="#ffffff" stroke="#d7e0ee" stroke-width="3"/>
  <rect x="478" y="541" width="110" height="12" rx="6" fill="#0e1a2e" opacity=".7"/>
  <rect x="686" y="537" width="76" height="20" rx="10" fill="url(#acc)" opacity=".9"/>
  <g stroke="#8299b8" stroke-width="3" stroke-linejoin="round">
    <use href="#bub" x="476" y="574" fill="#fff"/>
    <use href="#bub" x="536" y="574" fill="url(#acc)" stroke="none"/>
    <use href="#bub" x="596" y="574" fill="#fff"/>
    <use href="#bub" x="656" y="574" fill="#fff"/>
    <use href="#bub" x="716" y="574" fill="url(#acc)" stroke="none"/>
  </g>

  <!-- step 3: leads -->
  <ellipse cx="270" cy="836" rx="160" ry="12" fill="#0e1a2e" opacity=".06"/>
  <rect x="100" y="675" width="340" height="150" rx="20" fill="#ffffff" stroke="#d7e0ee" stroke-width="3"/>
  <rect x="128" y="701" width="110" height="12" rx="6" fill="#0e1a2e" opacity=".7"/>
  <rect x="312" y="697" width="100" height="20" rx="10" fill="url(#acc)" opacity=".9"/>
  <use href="#per" x="128" y="738" fill="url(#acc)"/>
  <use href="#per" x="167" y="738" fill="#8299b8"/>
  <use href="#per" x="206" y="738" fill="#b9c6da"/>
  <use href="#per" x="245" y="738" fill="#8299b8"/>
  <use href="#per" x="284" y="738" fill="url(#acc)"/>
  <use href="#per" x="323" y="738" fill="#b9c6da"/>
  <use href="#per" x="362" y="738" fill="#8299b8"/>
  <use href="#per" x="401" y="738" fill="#b9c6da"/>
</svg>
