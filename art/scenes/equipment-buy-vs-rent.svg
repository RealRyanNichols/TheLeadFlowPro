<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="acc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <radialGradient id="w1"><stop offset="0" stop-color="#38bdf8" stop-opacity=".13"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></radialGradient>
    <radialGradient id="w2"><stop offset="0" stop-color="#2563eb" stop-opacity=".08"/><stop offset="1" stop-color="#2563eb" stop-opacity="0"/></radialGradient>
    <g id="mach">
      <path d="M56 -184 L156 -308 L238 -176" stroke="#0e1a2e" stroke-width="34" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
      <path d="M92 -220 L148 -278" stroke="#8299b8" stroke-width="10" stroke-linecap="round"/>
      <path d="M180 -262 L222 -198" stroke="#8299b8" stroke-width="10" stroke-linecap="round"/>
      <path d="M238 -180 c30 -2 50 18 48 46 l-14 34 c-34 -8 -50 -34 -44 -66 z" fill="#0e1a2e"/>
      <rect x="-214" y="-152" width="54" height="58" rx="14" fill="#0e1a2e"/>
      <rect x="-200" y="-162" width="290" height="68" rx="16" fill="#8299b8"/>
      <rect x="-160" y="-370" width="180" height="214" rx="22" fill="url(#acc)"/>
      <rect x="-160" y="-184" width="180" height="28" rx="14" fill="#2563eb" opacity=".4"/>
      <rect x="-144" y="-352" width="120" height="112" rx="12" fill="#ffffff"/>
      <line x1="-88" y1="-352" x2="-88" y2="-240" stroke="#d7e0ee" stroke-width="3"/>
      <rect x="-170" y="-382" width="198" height="16" rx="8" fill="#0e1a2e"/>
      <rect x="-190" y="-92" width="360" height="92" rx="46" fill="#0e1a2e"/>
      <circle cx="-132" cy="-46" r="24" fill="#8299b8"/><circle cx="-132" cy="-46" r="8" fill="#0e1a2e"/>
      <circle cx="-57" cy="-46" r="24" fill="#8299b8"/><circle cx="-57" cy="-46" r="8" fill="#0e1a2e"/>
      <circle cx="18" cy="-46" r="24" fill="#8299b8"/><circle cx="18" cy="-46" r="8" fill="#0e1a2e"/>
      <circle cx="93" cy="-46" r="24" fill="#8299b8"/><circle cx="93" cy="-46" r="8" fill="#0e1a2e"/>
    </g>
    <g id="tick">
      <rect x="-95" y="-40" width="190" height="80" rx="10" fill="#ffffff" stroke="#d7e0ee" stroke-width="2"/>
      <path d="M35 -40 h50 a10 10 0 0 1 10 10 v60 a10 10 0 0 1 -10 10 h-50 z" fill="url(#acc)"/>
      <line x1="35" y1="-34" x2="35" y2="34" stroke="#b9c6da" stroke-width="2" stroke-dasharray="5 6"/>
      <circle cx="65" cy="0" r="7" fill="#f7f9fc"/>
      <rect x="-78" y="-18" width="86" height="10" rx="5" fill="#8299b8"/>
      <rect x="-78" y="4" width="60" height="9" rx="4.5" fill="#b9c6da"/>
    </g>
  </defs>
  <rect width="1600" height="900" fill="#f7f9fc"/>
  <ellipse cx="430" cy="340" rx="500" ry="340" fill="url(#w1)"/>
  <ellipse cx="1260" cy="480" rx="430" ry="330" fill="url(#w2)"/>

  <!-- center seam -->
  <line x1="800" y1="140" x2="800" y2="600" stroke="#b9c6da" stroke-width="3" stroke-dasharray="2 14" stroke-linecap="round"/>

  <!-- same machine, two paths -->
  <ellipse cx="400" cy="568" rx="300" ry="22" fill="#0e1a2e" opacity=".07"/>
  <ellipse cx="1200" cy="568" rx="300" ry="22" fill="#0e1a2e" opacity=".07"/>
  <use href="#mach" transform="translate(400 560) scale(1.2)"/>
  <use href="#mach" transform="translate(1200 560) scale(-1.2 1.2)"/>

  <!-- rental day tickets (left) -->
  <use href="#tick" transform="translate(305 712) rotate(-8)"/>
  <use href="#tick" transform="translate(490 712) rotate(8)"/>
  <use href="#tick" transform="translate(397 700)"/>

  <!-- ownership ledger (right) -->
  <g>
    <rect x="1035" y="636" width="340" height="150" rx="14" fill="#ffffff" stroke="#d7e0ee" stroke-width="2"/>
    <circle cx="1090" cy="636" r="8" fill="#f7f9fc" stroke="#8299b8" stroke-width="3"/>
    <circle cx="1130" cy="636" r="8" fill="#f7f9fc" stroke="#8299b8" stroke-width="3"/>
    <rect x="1063" y="664" width="110" height="10" rx="5" fill="#b9c6da"/>
    <rect x="1290" y="664" width="56" height="10" rx="5" fill="#8299b8"/>
    <line x1="1063" y1="690" x2="1346" y2="690" stroke="#d7e0ee" stroke-width="2"/>
    <rect x="1063" y="702" width="88" height="10" rx="5" fill="#b9c6da"/>
    <rect x="1290" y="702" width="56" height="10" rx="5" fill="#8299b8"/>
    <line x1="1063" y1="728" x2="1346" y2="728" stroke="#d7e0ee" stroke-width="2"/>
    <rect x="1063" y="748" width="80" height="12" rx="6" fill="#0e1a2e"/>
    <rect x="1266" y="740" width="84" height="28" rx="8" fill="url(#acc)"/>
  </g>

  <!-- crossover chart on the seam -->
  <g>
    <rect x="655" y="632" width="290" height="188" rx="14" fill="#ffffff" stroke="#d7e0ee" stroke-width="2"/>
    <line x1="679" y1="694" x2="921" y2="694" stroke="#d7e0ee" stroke-width="2"/>
    <line x1="679" y1="744" x2="921" y2="744" stroke="#d7e0ee" stroke-width="2"/>
    <path d="M680 792 L920 664" stroke="#8299b8" stroke-width="5" stroke-linecap="round" fill="none"/>
    <path d="M680 700 L920 716" stroke="#2563eb" stroke-width="5" stroke-linecap="round" fill="none"/>
    <line x1="833" y1="710" x2="833" y2="800" stroke="#b9c6da" stroke-width="2" stroke-dasharray="3 7"/>
    <circle cx="833" cy="710" r="9" fill="#0e1a2e"/>
    <circle cx="833" cy="710" r="3.5" fill="#ffffff"/>
  </g>
</svg>
