      <circle cx="962" cy="303" r="9" fill="#8299b8"/><path d="M946 326 a16 16 0 0 1 32 0 z" fill="#8299b8"/>
      <rect x="1000" y="292" width="130" height="14" rx="7" fill="#8299b8"/>
      <rect x="1000" y="318" width="80" height="10" rx="5" fill="#b9c6da"/>
