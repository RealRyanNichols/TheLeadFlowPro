      <line x1="948" y1="352" x2="1242" y2="352" stroke="#d7e0ee" stroke-width="2"/>
    </g>
    <g>
      <circle cx="962" cy="406" r="24" fill="#b9c6da"/>
      <circle cx="962" cy="399" r="9" fill="#8299b8"/><path d="M946 422 a16 16 0 0 1 32 0 z" fill="#8299b8"/>
      <rect x="1000" y="388" width="108" height="14" rx="7" fill="#8299b8"/>
      <rect x="1000" y="414" width="92" height="10" rx="5" fill="#b9c6da"/>
      <circle cx="1210" cy="406" r="16" fill="url(#acc)"/>
      <path d="M1216 400 L1204 412 M1204 404 v8 h8" stroke="#ffffff" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="948" y1="448" x2="1242" y2="448" stroke="#d7e0ee" stroke-width="2"/>
    </g>
    <g>
      <circle cx="962" cy="502" r="24" fill="#d7e0ee"/>
      <circle cx="962" cy="495" r="9" fill="#8299b8"/><path d="M946 518 a16 16 0 0 1 32 0 z" fill="#8299b8"/>
      <rect x="1000" y="484" width="140" height="14" rx="7" fill="#8299b8"/>
      <rect x="1000" y="510" width="72" height="10" rx="5" fill="#b9c6da"/>
      <circle cx="1210" cy="502" r="16" fill="url(#acc)"/>
      <path d="M1216 496 L1204 508 M1204 500 v8 h8" stroke="#ffffff" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="948" y1="544" x2="1242" y2="544" stroke="#d7e0ee" stroke-width="2"/>
    </g>
    <g>
      <circle cx="962" cy="598" r="24" fill="#b9c6da"/>
      <circle cx="962" cy="591" r="9" fill="#8299b8"/><path d="M946 614 a16 16 0 0 1 32 0 z" fill="#8299b8"/>
      <rect x="1000" y="580" width="118" height="14" rx="7" fill="#8299b8"/>
      <rect x="1000" y="606" width="86" height="10" rx="5" fill="#b9c6da"/>
      <circle cx="1210" cy="598" r="16" fill="url(#acc)"/>
      <path d="M1216 592 L1204 604 M1204 596 v8 h8" stroke="#ffffff" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="948" y1="640" x2="1242" y2="640" stroke="#d7e0ee" stroke-width="2"/>
    </g>
    <g>
      <circle cx="962" cy="694" r="24" fill="#d7e0ee"/>
      <circle cx="962" cy="687" r="9" fill="#8299b8"/><path d="M946 710 a16 16 0 0 1 32 0 z" fill="#8299b8"/>
      <rect x="1000" y="676" width="126" height="14" rx="7" fill="#8299b8"/>
      <rect x="1000" y="702" width="78" height="10" rx="5" fill="#b9c6da"/>
      <circle cx="1210" cy="694" r="16" fill="url(#acc)"/>
      <path d="M1216 688 L1204 700 M1204 692 v8 h8" stroke="#ffffff" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <rect x="1040" y="758" width="80" height="6" rx="3" fill="#b9c6da"/>
  </g>

  <!-- notification pills popping off the phone -->
  <g transform="rotate(-5 810 190)">
    <rect x="700" y="158" width="220" height="64" rx="32" fill="#ffffff" stroke="#d7e0ee" stroke-width="2"/>
    <circle cx="738" cy="190" r="18" fill="url(#acc)"/>
    <path d="M745 183 L731 197 M731 188 v9 h9" stroke="#ffffff" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="768" y="176" width="112" height="12" rx="6" fill="#8299b8"/>
    <rect x="768" y="196" width="70" height="10" rx="5" fill="#b9c6da"/>
  </g>
  <g transform="rotate(4 840 290)">
    <rect x="752" y="258" width="186" height="58" rx="29" fill="#ffffff" stroke="#d7e0ee" stroke-width="2"/>
    <circle cx="786" cy="287" r="16" fill="url(#acc)"/>
    <path d="M792 281 L780 293 M780 285 v8 h8" stroke="#ffffff" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="812" y="274" width="94" height="11" rx="5.5" fill="#8299b8"/>
    <rect x="812" y="293" width="58" height="9" rx="4.5" fill="#b9c6da"/>
  </g>
  <!-- corner badge on the phone -->
  <circle cx="1272" cy="152" r="26" fill="url(#acc)" stroke="#f7f9fc" stroke-width="5"/>
  <path d="M1282 142 L1264 160 M1264 148 v12 h12" stroke="#ffffff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
