<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="acc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <radialGradient id="w1"><stop offset="0" stop-color="#38bdf8" stop-opacity=".14"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></radialGradient>
    <radialGradient id="w2"><stop offset="0" stop-color="#2563eb" stop-opacity=".09"/><stop offset="1" stop-color="#2563eb" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1600" height="900" fill="#f7f9fc"/>
  <ellipse cx="1160" cy="450" rx="600" ry="430" fill="url(#w1)"/>
  <ellipse cx="380" cy="760" rx="420" ry="270" fill="url(#w2)"/>

  <!-- ground shadows -->
  <ellipse cx="1080" cy="830" rx="290" ry="24" fill="#0e1a2e" opacity=".07"/>
  <ellipse cx="330" cy="802" rx="180" ry="15" fill="#0e1a2e" opacity=".06"/>

  <!-- owner busy on a job (left, small) -->
  <g>
    <!-- appliance unit being repaired -->
    <rect x="392" y="668" width="120" height="128" rx="12" fill="#b9c6da"/>
    <rect x="404" y="682" width="96" height="68" rx="8" fill="#ffffff"/>
    <circle cx="452" cy="716" r="20" fill="none" stroke="#8299b8" stroke-width="3"/>
    <circle cx="452" cy="716" r="4" fill="#8299b8"/>
    <line x1="410" y1="696" x2="424" y2="696" stroke="#d7e0ee" stroke-width="3"/>
    <line x1="480" y1="738" x2="494" y2="738" stroke="#d7e0ee" stroke-width="3"/>
    <rect x="404" y="762" width="96" height="14" rx="7" fill="#8299b8"/>
    <!-- toolbox -->
    <rect x="148" y="754" width="86" height="44" rx="8" fill="#0e1a2e"/>
    <path d="M169 754 v-8 a22 22 0 0 1 44 0 v8" fill="none" stroke="#0e1a2e" stroke-width="7"/>
    <rect x="184" y="762" width="14" height="8" rx="3" fill="#f7f9fc"/>
    <!-- kneeling worker -->
    <g stroke="#0e1a2e" fill="none" stroke-linecap="round">
      <path d="M264 636 L296 720" stroke-width="46"/>
      <path d="M296 720 L352 742" stroke-width="34"/>
      <path d="M352 742 L346 792" stroke-width="24"/>
      <path d="M290 726 L252 788" stroke-width="24"/>
      <path d="M272 650 L326 684 L382 698" stroke-width="21"/>
    </g>
    <circle cx="276" cy="592" r="27" fill="#0e1a2e"/>
    <rect x="280" y="576" width="40" height="11" rx="5.5" fill="#0e1a2e"/>
    <!-- wrench -->
    <path d="M382 698 L404 705" stroke="#0e1a2e" stroke-width="8" stroke-linecap="round"/>
    <path d="M401 693 a12 12 0 1 0 10 20" fill="none" stroke="#0e1a2e" stroke-width="6"/>
  </g>

  <!-- phone stacking missed calls (right two-thirds) -->
  <g transform="rotate(3 1080 470)">
    <rect x="892" y="268" width="9" height="54" rx="4.5" fill="#0e1a2e"/>
    <rect x="892" y="336" width="9" height="54" rx="4.5" fill="#0e1a2e"/>
    <rect x="1259" y="308" width="9" height="88" rx="4.5" fill="#0e1a2e"/>
    <rect x="900" y="140" width="360" height="660" rx="52" fill="#0e1a2e"/>
    <rect x="909" y="149" width="342" height="642" rx="45" fill="none" stroke="#8299b8" stroke-width="2" opacity=".45"/>
    <rect x="918" y="158" width="324" height="624" rx="36" fill="#ffffff"/>
    <rect x="1044" y="172" width="72" height="14" rx="7" fill="#0e1a2e"/>
