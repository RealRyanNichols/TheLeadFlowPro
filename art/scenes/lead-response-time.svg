<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <radialGradient id="washL"><stop offset="0" stop-color="#38bdf8" stop-opacity=".16"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></radialGradient>
    <radialGradient id="washR"><stop offset="0" stop-color="#8299b8" stop-opacity=".12"/><stop offset="1" stop-color="#8299b8" stop-opacity="0"/></radialGradient>
    <radialGradient id="washB"><stop offset="0" stop-color="#2563eb" stop-opacity=".08"/><stop offset="1" stop-color="#2563eb" stop-opacity="0"/></radialGradient>
  </defs>

  <rect width="1600" height="900" fill="#f7f9fc"/>
  <!-- fast half lit, slow half dimmed -->
  <rect width="800" height="900" fill="#ffffff" opacity=".5"/>
  <rect x="800" width="800" height="900" fill="#0e1a2e" opacity=".02"/>
  <ellipse cx="380" cy="300" rx="580" ry="430" fill="url(#washL)"/>
  <ellipse cx="1280" cy="620" rx="540" ry="410" fill="url(#washR)"/>
  <ellipse cx="640" cy="820" rx="480" ry="260" fill="url(#washB)"/>

  <!-- center seam -->
  <line x1="800" y1="88" x2="800" y2="808" stroke="#d7e0ee" stroke-width="4"/>

  <!-- fast side: answered notifications -->
  <ellipse cx="320" cy="512" rx="220" ry="18" fill="#0e1a2e" opacity=".05"/>
  <rect x="120" y="210" width="390" height="130" rx="20" fill="#ffffff" stroke="#d7e0ee" stroke-width="3"/>
  <circle cx="185" cy="275" r="34" fill="url(#acc)"/>
  <rect x="240" y="246" width="200" height="18" rx="9" fill="#8299b8"/>
  <rect x="240" y="278" width="140" height="12" rx="6" fill="#b9c6da"/>
  <circle cx="508" cy="214" r="30" fill="url(#acc)" stroke="#ffffff" stroke-width="6"/>
  <path d="M494 214 l10 10 l20 -20" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="160" y="380" width="340" height="116" rx="20" fill="#ffffff" stroke="#d7e0ee" stroke-width="3"/>
  <circle cx="222" cy="438" r="30" fill="#b9c6da"/>
  <rect x="270" y="414" width="170" height="16" rx="8" fill="#8299b8"/>
  <rect x="270" y="444" width="110" height="12" rx="6" fill="#b9c6da"/>
  <circle cx="500" cy="384" r="26" fill="url(#acc)" stroke="#ffffff" stroke-width="6"/>
  <path d="M488 384 l9 9 l17 -17" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- slow side: unread stack, askew -->
  <ellipse cx="1300" cy="726" rx="220" ry="18" fill="#0e1a2e" opacity=".05"/>
  <g transform="rotate(4 1290 330)">
    <rect x="1120" y="272" width="340" height="112" rx="20" fill="#ffffff" opacity=".9" stroke="#d7e0ee" stroke-width="3"/>
    <circle cx="1180" cy="328" r="28" fill="#b9c6da"/>
    <rect x="1226" y="306" width="160" height="14" rx="7" fill="#b9c6da"/>
    <rect x="1226" y="334" width="104" height="11" rx="5" fill="#b9c6da" opacity=".7"/>
    <circle cx="1452" cy="282" r="14" fill="#8299b8"/>
  </g>
  <g transform="rotate(-3 1320 480)">
    <rect x="1150" y="428" width="340" height="112" rx="20" fill="#ffffff" opacity=".9" stroke="#d7e0ee" stroke-width="3"/>
    <circle cx="1210" cy="484" r="28" fill="#b9c6da"/>
    <rect x="1256" y="462" width="160" height="14" rx="7" fill="#b9c6da"/>
    <rect x="1256" y="490" width="104" height="11" rx="5" fill="#b9c6da" opacity=".7"/>
    <circle cx="1482" cy="438" r="14" fill="#8299b8"/>
  </g>
  <g transform="rotate(2 1300 640)">
    <rect x="1130" y="586" width="340" height="112" rx="20" fill="#ffffff" opacity=".9" stroke="#d7e0ee" stroke-width="3"/>
    <circle cx="1190" cy="642" r="28" fill="#b9c6da"/>
    <rect x="1236" y="620" width="160" height="14" rx="7" fill="#b9c6da"/>
    <rect x="1236" y="648" width="104" height="11" rx="5" fill="#b9c6da" opacity=".7"/>
    <circle cx="1462" cy="596" r="14" fill="#8299b8"/>
  </g>

  <!-- stopwatch on the seam -->
  <ellipse cx="800" cy="802" rx="310" ry="30" fill="#0e1a2e" opacity=".07"/>
  <rect x="780" y="186" width="40" height="60" fill="#0e1a2e"/>
  <rect x="764" y="152" width="72" height="40" rx="12" fill="#0e1a2e"/>
  <g transform="rotate(-38 800 500)"><rect x="782" y="176" width="36" height="52" rx="10" fill="#0e1a2e"/></g>
  <g transform="rotate(38 800 500)"><rect x="782" y="176" width="36" height="52" rx="10" fill="#0e1a2e"/></g>
  <circle cx="800" cy="500" r="260" fill="#0e1a2e"/>
  <circle cx="800" cy="500" r="232" fill="#ffffff"/>
  <circle cx="800" cy="500" r="208" fill="none" stroke="#d7e0ee" stroke-width="3"/>
  <circle cx="800" cy="500" r="246" fill="none" stroke="#ffffff" stroke-width="12" opacity=".4" stroke-dasharray="150 1400" transform="rotate(-155 800 500)"/>

  <!-- ticks -->
  <g fill="#0e1a2e">
    <rect x="795" y="306" width="10" height="28"/>
    <rect x="795" y="306" width="10" height="28" transform="rotate(90 800 500)"/>
    <rect x="795" y="306" width="10" height="28" transform="rotate(180 800 500)"/>
    <rect x="795" y="306" width="10" height="28" transform="rotate(270 800 500)"/>
  </g>
  <g fill="#8299b8">
    <rect x="797" y="308" width="6" height="17" transform="rotate(30 800 500)"/>
    <rect x="797" y="308" width="6" height="17" transform="rotate(60 800 500)"/>
    <rect x="797" y="308" width="6" height="17" transform="rotate(120 800 500)"/>
    <rect x="797" y="308" width="6" height="17" transform="rotate(150 800 500)"/>
    <rect x="797" y="308" width="6" height="17" transform="rotate(210 800 500)"/>
    <rect x="797" y="308" width="6" height="17" transform="rotate(240 800 500)"/>
    <rect x="797" y="308" width="6" height="17" transform="rotate(300 800 500)"/>
    <rect x="797" y="308" width="6" height="17" transform="rotate(330 800 500)"/>
  </g>

  <!-- elapsed wedge: barely any time gone, leaning to the fast side -->
  <path d="M800 500 L800 310 A190 190 0 0 0 635.5 405 Z" fill="url(#acc)" opacity=".92"/>
  <path d="M800 500 L800 310 A190 190 0 0 0 635.5 405 Z" fill="none" stroke="#2563eb" stroke-width="4" opacity=".35"/>
  <line x1="839.8" y1="523" x2="616.4" y2="394" stroke="#0e1a2e" stroke-width="11" stroke-linecap="round"/>
  <circle cx="800" cy="500" r="17" fill="#0e1a2e"/>
  <circle cx="800" cy="500" r="7" fill="#ffffff"/>
</svg>
