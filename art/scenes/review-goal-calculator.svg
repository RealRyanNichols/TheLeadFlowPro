<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <defs>
    <path id="rg-star" d="M0,-1 L0.264,-0.364 L0.951,-0.309 L0.428,0.139 L0.588,0.809 L0,0.45 L-0.588,0.809 L-0.428,0.139 L-0.951,-0.309 L-0.264,-0.364 Z"/>
    <linearGradient id="rg-g" x1="510" y1="460" x2="1000" y2="230" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f87171"/><stop offset="1" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="rg-gd" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f87171"/><stop offset="1" stop-color="#ef4444"/>
    </linearGradient>
    <radialGradient id="rg-w1"><stop offset="0" stop-color="#f87171" stop-opacity=".12"/><stop offset="1" stop-color="#f87171" stop-opacity="0"/></radialGradient>
    <radialGradient id="rg-w2"><stop offset="0" stop-color="#ef4444" stop-opacity=".09"/><stop offset="1" stop-color="#ef4444" stop-opacity="0"/></radialGradient>
  </defs>

  <rect width="1600" height="900" fill="#f7f9fc"/>
  <circle cx="1230" cy="220" r="470" fill="url(#rg-w1)"/>
  <circle cx="300" cy="620" r="470" fill="url(#rg-w2)"/>
  <circle cx="800" cy="120" r="300" fill="url(#rg-w1)"/>

  <!-- dial ticks -->
  <line x1="480" y1="460" x2="452" y2="460" stroke="#8299b8" stroke-width="4" stroke-linecap="round"/>
  <line x1="573" y1="234" x2="554" y2="214" stroke="#8299b8" stroke-width="4" stroke-linecap="round"/>
  <line x1="800" y1="140" x2="800" y2="112" stroke="#8299b8" stroke-width="4" stroke-linecap="round"/>
  <line x1="1027" y1="234" x2="1046" y2="214" stroke="#8299b8" stroke-width="4" stroke-linecap="round"/>
  <line x1="1120" y1="460" x2="1148" y2="460" stroke="#8299b8" stroke-width="4" stroke-linecap="round"/>

  <!-- dial track -->
  <path d="M510,460 A290,290 0 0 1 1090,460" fill="none" stroke="#d7e0ee" stroke-width="34" stroke-linecap="round"/>
  <!-- climbed arc: current average -->
  <path d="M510,460 A290,290 0 0 1 986,238" fill="none" stroke="url(#rg-g)" stroke-width="34" stroke-linecap="round"/>
  <!-- remaining climb to target, dashed -->
  <path d="M1005,250 A290,290 0 0 1 1073,361" fill="none" stroke="#ef4444" stroke-width="9" stroke-dasharray="2 20" stroke-linecap="round" opacity=".7"/>
  <!-- current marker -->
  <circle cx="986" cy="238" r="15" fill="#ffffff" stroke="#ef4444" stroke-width="6"/>
  <!-- target marker: star just outside the track -->
  <line x1="1063" y1="345" x2="1085" y2="332" stroke="#8299b8" stroke-width="4" stroke-linecap="round"/>
  <use href="#rg-star" transform="translate(1124,320) scale(30)" fill="url(#rg-gd)"/>

  <!-- needle -->
  <path d="M807,466 L947,290 L793,454 Z" fill="#0e1a2e"/>
  <circle cx="800" cy="460" r="26" fill="#0e1a2e"/>
  <circle cx="800" cy="460" r="9" fill="#ffffff"/>

  <!-- review cards stacking up beneath the dial -->
  <ellipse cx="800" cy="836" rx="230" ry="16" fill="#0e1a2e" opacity=".07"/>
  <g>
    <rect x="630" y="726" width="340" height="92" rx="12" fill="#ffffff" stroke="#d7e0ee" stroke-width="3"/>
    <circle cx="672" cy="772" r="15" fill="#b9c6da"/>
    <use href="#rg-star" transform="translate(716,762) scale(12)" fill="url(#rg-gd)"/>
    <use href="#rg-star" transform="translate(748,762) scale(12)" fill="url(#rg-gd)"/>
    <use href="#rg-star" transform="translate(780,762) scale(12)" fill="url(#rg-gd)"/>
    <use href="#rg-star" transform="translate(812,762) scale(12)" fill="url(#rg-gd)"/>
    <use href="#rg-star" transform="translate(844,762) scale(12)" fill="#d7e0ee"/>
    <rect x="704" y="786" width="180" height="8" rx="4" fill="#d7e0ee"/>
  </g>
  <g transform="rotate(-2 790 680)">
    <rect x="614" y="634" width="340" height="92" rx="12" fill="#ffffff" stroke="#d7e0ee" stroke-width="3"/>
    <circle cx="656" cy="680" r="15" fill="#b9c6da"/>
    <use href="#rg-star" transform="translate(700,670) scale(12)" fill="url(#rg-gd)"/>
    <use href="#rg-star" transform="translate(732,670) scale(12)" fill="url(#rg-gd)"/>
    <use href="#rg-star" transform="translate(764,670) scale(12)" fill="url(#rg-gd)"/>
    <use href="#rg-star" transform="translate(796,670) scale(12)" fill="url(#rg-gd)"/>
    <use href="#rg-star" transform="translate(828,670) scale(12)" fill="url(#rg-gd)"/>
    <rect x="688" y="694" width="160" height="8" rx="4" fill="#d7e0ee"/>
  </g>
  <g transform="rotate(2.5 830 588)">
    <rect x="660" y="542" width="340" height="92" rx="12" fill="#ffffff" stroke="#d7e0ee" stroke-width="3"/>
    <circle cx="702" cy="588" r="15" fill="#b9c6da"/>
    <use href="#rg-star" transform="translate(746,578) scale(12)" fill="url(#rg-gd)"/>
    <use href="#rg-star" transform="translate(778,578) scale(12)" fill="url(#rg-gd)"/>
    <use href="#rg-star" transform="translate(810,578) scale(12)" fill="url(#rg-gd)"/>
    <use href="#rg-star" transform="translate(842,578) scale(12)" fill="url(#rg-gd)"/>
    <use href="#rg-star" transform="translate(874,578) scale(12)" fill="url(#rg-gd)"/>
    <rect x="734" y="602" width="180" height="8" rx="4" fill="#d7e0ee"/>
  </g>
</svg>
