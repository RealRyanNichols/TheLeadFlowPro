<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f87171"/><stop offset="1" stop-color="#ef4444"/>
    </linearGradient>
    <radialGradient id="w1"><stop offset="0" stop-color="#f87171" stop-opacity=".13"/><stop offset="1" stop-color="#f87171" stop-opacity="0"/></radialGradient>
    <radialGradient id="w2"><stop offset="0" stop-color="#ef4444" stop-opacity=".09"/><stop offset="1" stop-color="#ef4444" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1600" height="900" fill="#f7f9fc"/>
  <circle cx="1150" cy="220" r="520" fill="url(#w1)"/>
  <circle cx="330" cy="680" r="430" fill="url(#w2)"/>

  <!-- work truck, small at left -->
  <ellipse cx="420" cy="678" rx="215" ry="16" fill="#0e1a2e" opacity=".07"/>
  <g>
    <rect x="230" y="506" width="200" height="70" rx="8" fill="#0e1a2e"/>
    <path d="M420 560 V416 Q420 404 434 404 H496 Q508 404 514 414 L554 478 L588 484 Q600 487 600 500 V560 Z" fill="#0e1a2e"/>
    <rect x="230" y="560" width="380" height="70" rx="10" fill="#0e1a2e"/>
    <path d="M446 420 H500 L536 474 H446 Z" fill="#ffffff"/>
    <rect x="596" y="576" width="18" height="28" rx="6" fill="#8299b8"/>
    <rect x="584" y="566" width="12" height="16" rx="4" fill="#ffffff" opacity=".9"/>
    <line x1="424" y1="486" x2="424" y2="624" stroke="#ffffff" stroke-width="3" opacity=".3"/>
    <circle cx="310" cy="630" r="38" fill="#0e1a2e" stroke="#f7f9fc" stroke-width="8"/>
    <circle cx="310" cy="630" r="15" fill="#ffffff"/><circle cx="310" cy="630" r="6" fill="#0e1a2e"/>
    <circle cx="530" cy="630" r="38" fill="#0e1a2e" stroke="#f7f9fc" stroke-width="8"/>
    <circle cx="530" cy="630" r="15" fill="#ffffff"/><circle cx="530" cy="630" r="6" fill="#0e1a2e"/>
  </g>

  <!-- schedule document, center right -->
  <ellipse cx="1095" cy="820" rx="280" ry="18" fill="#0e1a2e" opacity=".07"/>
  <!-- signed loan papers behind -->
  <g transform="rotate(-5 1090 470)">
    <rect x="816" y="158" width="470" height="600" rx="10" fill="#ffffff" stroke="#d7e0ee" stroke-width="3"/>
    <line x1="852" y1="212" x2="1000" y2="212" stroke="#d7e0ee" stroke-width="8" stroke-linecap="round"/>
  </g>
  <!-- front sheet with folded corner -->
  <path d="M870 180 H1272 L1330 238 V790 A10 10 0 0 1 1320 800 H870 A10 10 0 0 1 860 790 V190 A10 10 0 0 1 870 180 Z" fill="#ffffff" stroke="#d7e0ee" stroke-width="3"/>
  <path d="M1272 180 L1330 238 H1272 Z" fill="#d7e0ee"/>

  <!-- header -->
  <rect x="900" y="232" width="190" height="18" rx="9" fill="#8299b8"/>
  <rect x="900" y="262" width="120" height="12" rx="6" fill="#d7e0ee"/>
  <line x1="900" y1="302" x2="1290" y2="302" stroke="#d7e0ee" stroke-width="3"/>

  <!-- payment rows -->
  <g>
    <rect x="900" y="330" width="95" height="14" rx="7" fill="#b9c6da"/><rect x="1210" y="330" width="80" height="14" rx="7" fill="#8299b8"/>
    <rect x="900" y="378" width="95" height="14" rx="7" fill="#d7e0ee"/><rect x="1210" y="378" width="80" height="14" rx="7" fill="#8299b8"/>
    <rect x="900" y="426" width="95" height="14" rx="7" fill="#d7e0ee"/><rect x="1210" y="426" width="80" height="14" rx="7" fill="#8299b8"/>
    <rect x="900" y="474" width="95" height="14" rx="7" fill="#d7e0ee"/><rect x="1210" y="474" width="80" height="14" rx="7" fill="#8299b8"/>
    <rect x="900" y="522" width="95" height="14" rx="7" fill="#d7e0ee"/><rect x="1210" y="522" width="80" height="14" rx="7" fill="#8299b8"/>
  </g>

  <!-- total interest line -->
  <rect x="890" y="566" width="410" height="56" rx="12" fill="url(#acc)"/>
  <rect x="890" y="566" width="410" height="14" rx="7" fill="#ef4444" opacity=".35"/>
  <rect x="914" y="586" width="130" height="16" rx="8" fill="#ffffff" opacity=".95"/>
  <rect x="1176" y="584" width="100" height="20" rx="10" fill="#ffffff" opacity=".95"/>

  <!-- fine print + signature -->
  <rect x="900" y="648" width="140" height="10" rx="5" fill="#d7e0ee"/>
  <rect x="900" y="670" width="100" height="10" rx="5" fill="#d7e0ee"/>
  <path d="M920 726 C945 700 958 742 986 712 C1002 696 1010 730 1040 706" fill="none" stroke="#0e1a2e" stroke-width="4" stroke-linecap="round"/>
  <line x1="910" y1="748" x2="1120" y2="748" stroke="#d7e0ee" stroke-width="3"/>
  <circle cx="1232" cy="722" r="26" fill="url(#acc)"/>
  <circle cx="1232" cy="722" r="14" fill="none" stroke="#ffffff" stroke-width="3" opacity=".75"/>
</svg>
