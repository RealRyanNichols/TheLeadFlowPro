  <g stroke="#f97316" stroke-width="4" stroke-linecap="round" opacity=".45">
    <line x1="468" y1="330" x2="512" y2="306"/>
    <line x1="452" y1="376" x2="502" y2="348"/>
  </g>

  <!-- the link, tapped -->
  <ellipse cx="272" cy="702" rx="130" ry="13" fill="#0e1a2e" opacity=".07"/>
  <rect x="150" y="600" width="240" height="76" rx="38" fill="#ffffff" stroke="#d7e0ee" stroke-width="3"/>
  <g transform="rotate(-45 246 638)" fill="none" stroke="url(#acc)" stroke-width="7">
    <rect x="200" y="626" width="54" height="26" rx="13"/>
    <rect x="238" y="626" width="54" height="26" rx="13"/>
  </g>
  <circle cx="352" cy="672" r="12" fill="#0e1a2e" opacity=".85"/>
  <circle cx="352" cy="672" r="27" fill="none" stroke="#f97316" stroke-width="3" opacity=".5"/>
  <circle cx="352" cy="672" r="42" fill="none" stroke="#f97316" stroke-width="3" opacity=".25"/>
</svg>
