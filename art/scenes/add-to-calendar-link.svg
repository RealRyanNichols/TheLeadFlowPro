<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbbf24"/><stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <radialGradient id="wa"><stop offset="0" stop-color="#fbbf24" stop-opacity=".13"/><stop offset="1" stop-color="#fbbf24" stop-opacity="0"/></radialGradient>
    <radialGradient id="wb"><stop offset="0" stop-color="#f97316" stop-opacity=".09"/><stop offset="1" stop-color="#f97316" stop-opacity="0"/></radialGradient>
    <rect id="cell" width="36" height="36" rx="8" fill="#ffffff" stroke="#d7e0ee" stroke-width="2"/>
  </defs>
  <rect width="1600" height="900" fill="#f7f9fc"/>
  <circle cx="1160" cy="380" r="540" fill="url(#wa)"/>
  <circle cx="360" cy="620" r="430" fill="url(#wb)"/>

  <!-- phone calendar -->
  <ellipse cx="1180" cy="840" rx="210" ry="18" fill="#0e1a2e" opacity=".07"/>
  <g transform="rotate(4 1175 475)">
    <rect x="990" y="130" width="370" height="690" rx="56" fill="#0e1a2e"/>
    <rect x="1014" y="158" width="322" height="634" rx="34" fill="#ffffff"/>
    <rect x="1044" y="196" width="140" height="16" rx="8" fill="#0e1a2e" opacity=".8"/>
    <path d="M1272 198 L1262 206 L1272 214 Z" fill="#b9c6da"/>
    <path d="M1298 198 L1308 206 L1298 214 Z" fill="#b9c6da"/>
    <g fill="#b9c6da" opacity=".85">
      <rect x="1032" y="242" width="24" height="8" rx="4"/>
      <rect x="1076" y="242" width="24" height="8" rx="4"/>
      <rect x="1120" y="242" width="24" height="8" rx="4"/>
      <rect x="1164" y="242" width="24" height="8" rx="4"/>
      <rect x="1208" y="242" width="24" height="8" rx="4"/>
      <rect x="1252" y="242" width="24" height="8" rx="4"/>
      <rect x="1296" y="242" width="24" height="8" rx="4"/>
    </g>
    <g>
      <use href="#cell" x="1030" y="272"/><use href="#cell" x="1074" y="272"/><use href="#cell" x="1118" y="272"/><use href="#cell" x="1162" y="272"/><use href="#cell" x="1206" y="272"/><use href="#cell" x="1250" y="272"/><use href="#cell" x="1294" y="272"/>
      <use href="#cell" x="1030" y="318"/><use href="#cell" x="1074" y="318"/><use href="#cell" x="1118" y="318"/><use href="#cell" x="1206" y="318"/><use href="#cell" x="1250" y="318"/><use href="#cell" x="1294" y="318"/>
      <use href="#cell" x="1030" y="364"/><use href="#cell" x="1074" y="364"/><use href="#cell" x="1118" y="364"/><use href="#cell" x="1162" y="364"/><use href="#cell" x="1206" y="364"/><use href="#cell" x="1250" y="364"/><use href="#cell" x="1294" y="364"/>
      <use href="#cell" x="1030" y="410"/><use href="#cell" x="1074" y="410"/><use href="#cell" x="1118" y="410"/><use href="#cell" x="1162" y="410"/><use href="#cell" x="1206" y="410"/><use href="#cell" x="1250" y="410"/><use href="#cell" x="1294" y="410"/>
    </g>
    <circle cx="1092" cy="345" r="3.5" fill="#b9c6da"/>
    <circle cx="1268" cy="391" r="3.5" fill="#b9c6da"/>
    <circle cx="1136" cy="437" r="3.5" fill="#b9c6da"/>
    <!-- the tapped date -->
    <rect x="1162" y="318" width="36" height="36" rx="8" fill="url(#acc)"/>
    <circle cx="1180" cy="336" r="5" fill="#ffffff"/>
    <rect x="1155" y="311" width="50" height="50" rx="12" fill="none" stroke="#f97316" stroke-width="2.5" opacity=".45"/>
    <!-- agenda below -->
    <line x1="1030" y1="480" x2="1320" y2="480" stroke="#d7e0ee" stroke-width="2.5"/>
    <g fill="#f7f9fc" stroke="#d7e0ee" stroke-width="2.5">
      <rect x="1032" y="500" width="288" height="50" rx="10"/>
      <rect x="1032" y="566" width="288" height="50" rx="10"/>
    </g>
    <circle cx="1062" cy="525" r="12" fill="none" stroke="#b9c6da" stroke-width="2.5"/>
    <rect x="1090" y="519" width="110" height="10" rx="5" fill="#b9c6da"/>
    <circle cx="1062" cy="591" r="12" fill="none" stroke="#b9c6da" stroke-width="2.5"/>
    <rect x="1090" y="585" width="90" height="10" rx="5" fill="#b9c6da"/>
    <!-- landing slot -->
    <rect x="1024" y="624" width="304" height="80" rx="16" fill="none" stroke="#f97316" stroke-width="2.5" opacity=".5"/>
    <rect x="1014" y="614" width="324" height="100" rx="20" fill="none" stroke="#f97316" stroke-width="2.5" opacity=".22"/>
    <rect x="1032" y="632" width="288" height="64" rx="12" fill="url(#acc)"/>
    <path d="M1032 680 H1320 V684 Q1320 696 1308 696 H1044 Q1032 696 1032 684 Z" fill="#f97316" opacity=".4"/>
    <circle cx="1064" cy="664" r="14" fill="none" stroke="#ffffff" stroke-width="3" opacity=".9"/>
    <path d="M1064 656 V664 L1070 668" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity=".9"/>
    <rect x="1094" y="648" width="120" height="12" rx="6" fill="#ffffff" opacity=".92"/>
    <rect x="1094" y="670" width="80" height="9" rx="4.5" fill="#ffffff" opacity=".6"/>
