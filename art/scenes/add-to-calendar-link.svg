  <!-- flight path from tapped link to slot -->
  <path d="M300 622 C420 380, 660 240, 1040 640" fill="none" stroke="#f97316" stroke-width="5" stroke-dasharray="1 17" stroke-linecap="round" opacity=".55"/>
  <path d="M1043 646 L1013 622 L1041 612 Z" fill="#f97316" opacity=".7"/>

  <!-- event card mid-flight -->
  <g transform="translate(560,290) rotate(-8)">
    <rect x="0" y="0" width="250" height="130" rx="16" fill="#ffffff" stroke="#d7e0ee" stroke-width="3"/>
    <rect x="10" y="10" width="10" height="110" rx="5" fill="url(#acc)"/>
    <circle cx="56" cy="46" r="20" fill="none" stroke="url(#acc)" stroke-width="5"/>
    <path d="M56 34 V46 L65 52" fill="none" stroke="#0e1a2e" stroke-width="4" stroke-linecap="round"/>
    <rect x="90" y="32" width="120" height="13" rx="6.5" fill="#0e1a2e" opacity=".8"/>
    <rect x="90" y="56" width="86" height="10" rx="5" fill="#8299b8"/>
    <rect x="38" y="88" width="24" height="22" rx="4" fill="none" stroke="#8299b8" stroke-width="2.5"/>
    <line x1="38" y1="96" x2="62" y2="96" stroke="#8299b8" stroke-width="2.5"/>
    <rect x="74" y="92" width="110" height="10" rx="5" fill="#b9c6da"/>
