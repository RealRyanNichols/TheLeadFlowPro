<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#0ea371"/>
    </linearGradient>
    <radialGradient id="wa"><stop offset="0" stop-color="#34d399" stop-opacity=".13"/><stop offset="1" stop-color="#34d399" stop-opacity="0"/></radialGradient>
    <radialGradient id="wb"><stop offset="0" stop-color="#0ea371" stop-opacity=".09"/><stop offset="1" stop-color="#0ea371" stop-opacity="0"/></radialGradient>
    <clipPath id="scr"><rect x="972" y="150" width="296" height="620" rx="30"/></clipPath>
    <g id="vis">
      <circle cx="0" cy="-58" r="20"/>
      <path d="M-26 0 Q-26 -38 0 -38 Q26 -38 26 0 Z"/>
    </g>
  </defs>
  <rect width="1600" height="900" fill="#f7f9fc"/>
  <circle cx="1120" cy="300" r="500" fill="url(#wa)"/>
  <circle cx="340" cy="620" r="440" fill="url(#wb)"/>

  <!-- phone with broken mobile layout -->
  <ellipse cx="1120" cy="812" rx="200" ry="18" fill="#0e1a2e" opacity=".07"/>
  <rect x="950" y="120" width="340" height="680" rx="54" fill="#0e1a2e"/>
  <rect x="1085" y="133" width="70" height="7" rx="3.5" fill="#8299b8" opacity=".6"/>
  <rect x="972" y="150" width="296" height="620" rx="30" fill="#ffffff"/>
  <g clip-path="url(#scr)">
    <rect x="990" y="164" width="40" height="8" rx="4" fill="#b9c6da"/>
    <circle cx="1222" cy="168" r="4" fill="#b9c6da"/>
    <circle cx="1238" cy="168" r="4" fill="#b9c6da"/>
    <!-- header bar askew, running off the screen -->
    <g transform="rotate(-8 1120 220)">
      <rect x="960" y="196" width="360" height="52" fill="#eef3fa" stroke="#d7e0ee" stroke-width="2.5"/>
      <circle cx="1004" cy="222" r="10" fill="#8299b8"/>
      <rect x="1026" y="216" width="92" height="12" rx="6" fill="#b9c6da"/>
      <rect x="1210" y="216" width="60" height="12" rx="6" fill="#b9c6da"/>
    </g>
    <!-- hero image torn in two, halves out of register -->
    <path d="M990 282 H1124 L1104 322 L1128 360 L1108 420 H990 Z" fill="url(#acc)"/>
    <path d="M996 414 L1044 348 L1078 384 L1098 362 V414 Z" fill="#ffffff" opacity=".75"/>
    <g transform="translate(14,20) rotate(3 1186 350)">
      <path d="M1130 282 H1250 V420 H1114 L1134 360 L1110 322 Z" fill="url(#acc)"/>
      <path d="M1128 372 L1162 334 L1204 378 L1246 336 V414 H1140 Z" fill="#ffffff" opacity=".75"/>
      <circle cx="1216" cy="310" r="12" fill="#ffffff" opacity=".85"/>
    </g>
    <!-- text lines with a block crashed on top -->
    <rect x="990" y="470" width="200" height="13" rx="6" fill="#b9c6da"/>
    <rect x="990" y="498" width="238" height="13" rx="6" fill="#b9c6da"/>
    <g transform="rotate(8 1164 496)">
      <rect x="1074" y="458" width="180" height="66" rx="8" fill="#ffffff" stroke="#d7e0ee" stroke-width="2.5"/>
      <rect x="1092" y="476" width="110" height="10" rx="5" fill="#8299b8"/>
      <rect x="1092" y="496" width="80" height="10" rx="5" fill="#8299b8"/>
    </g>
    <!-- element wider than the viewport, cut off both sides -->
    <rect x="900" y="556" width="520" height="46" rx="10" fill="#e4eaf4" stroke="#d7e0ee" stroke-width="2.5"/>
    <rect x="930" y="571" width="180" height="16" rx="8" fill="#b9c6da"/>
    <!-- tiny tap targets under one big fingertip -->
    <rect x="1006" y="648" width="40" height="18" rx="9" fill="#8299b8"/>
    <rect x="1058" y="648" width="40" height="18" rx="9" fill="#8299b8"/>
    <rect x="1110" y="648" width="40" height="18" rx="9" fill="#8299b8"/>
    <circle cx="1085" cy="662" r="46" fill="#0e1a2e" opacity=".1"/>
    <circle cx="1085" cy="662" r="46" fill="none" stroke="#0e1a2e" stroke-width="2.5" opacity=".3"/>
    <!-- horizontal scrollbar pushed sideways -->
    <rect x="990" y="736" width="260" height="8" rx="4" fill="#e4eaf4"/>
    <rect x="1186" y="736" width="64" height="8" rx="4" fill="#b9c6da"/>
  </g>

  <!-- turn-away path -->
  <path d="M932 590 C860 486, 740 486, 692 566" fill="none" stroke="#8299b8" stroke-width="3" stroke-dasharray="3 11" stroke-linecap="round"/>
  <path d="M708 556 L688 576 L682 550 Z" fill="#8299b8"/>

  <!-- visitors leaving, one after another -->
  <line x1="230" y1="780" x2="910" y2="780" stroke="#d7e0ee" stroke-width="3"/>
  <use href="#vis" x="800" y="762" fill="#0e1a2e"/>
  <use href="#vis" x="602" y="762" fill="#8299b8" opacity=".8"/>
  <use href="#vis" x="418" y="762" fill="#8299b8" opacity=".45"/>
  <use href="#vis" x="256" y="762" fill="#b9c6da" opacity=".4"/>
  <g stroke="#b9c6da" stroke-width="3" stroke-linecap="round" opacity=".8">
    <line x1="838" y1="716" x2="866" y2="716"/>
    <line x1="846" y1="736" x2="878" y2="736"/>
    <line x1="640" y1="716" x2="666" y2="716"/>
    <line x1="454" y1="716" x2="478" y2="716"/>
  </g>
</svg>
