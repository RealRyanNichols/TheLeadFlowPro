<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <radialGradient id="wA"><stop offset="0" stop-color="#22d3ee" stop-opacity=".12"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
    <radialGradient id="wB"><stop offset="0" stop-color="#3b82f6" stop-opacity=".10"/><stop offset="1" stop-color="#3b82f6" stop-opacity="0"/></radialGradient>
    <path id="st" d="M0,-70 L16.5,-22.7 L66.6,-21.6 L26.6,8.7 L41.1,56.6 L0,28 L-41.1,56.6 L-26.6,8.7 L-66.6,-21.6 L-16.5,-22.7 Z"/>
    <clipPath id="sc"><use href="#st" transform="translate(1290,170) rotate(14)"/></clipPath>
  </defs>
  <rect width="1600" height="900" fill="#f7f9fc"/>
  <ellipse cx="350" cy="300" rx="400" ry="290" fill="url(#wA)"/>
  <ellipse cx="1100" cy="430" rx="490" ry="390" fill="url(#wB)"/>
  <ellipse cx="1450" cy="800" rx="280" ry="140" fill="url(#wA)"/>

  <line x1="560" y1="810" x2="1560" y2="810" stroke="#d7e0ee" stroke-width="3"/>
  <ellipse cx="1130" cy="826" rx="240" ry="22" fill="#0e1a2e" opacity=".06"/>
  <ellipse cx="768" cy="808" rx="110" ry="13" fill="#0e1a2e" opacity=".07"/>

  <!-- floating outline star, negative space left -->
  <use href="#st" transform="translate(300,540) scale(.45)" fill="none" stroke="#8299b8" stroke-width="7"/>

  <!-- finished job: toolbox -->
  <path d="M735,718 Q765,690 795,718" fill="none" stroke="#0e1a2e" stroke-width="8" stroke-linecap="round"/>
  <rect x="690" y="720" width="150" height="76" rx="10" fill="#0e1a2e"/>
  <line x1="694" y1="746" x2="836" y2="746" stroke="#ffffff" stroke-width="3" opacity=".3"/>
  <rect x="756" y="738" width="18" height="16" rx="3" fill="url(#g)"/>
  <path d="M862,690 l5,12 12,5 -12,5 -5,12 -5,-12 -12,-5 12,-5 Z" fill="#22d3ee"/>
  <path d="M676,672 l4,10 10,4 -10,4 -4,10 -4,-10 -10,-4 10,-4 Z" fill="#22d3ee"/>

  <!-- customer hand: forearm + palm behind phone -->
  <path d="M1150,900 Q1158,832 1206,798 L1298,760 Q1338,745 1352,783 L1428,900 Z" fill="#0e1a2e"/>
  <ellipse cx="1160" cy="772" rx="95" ry="60" fill="#0e1a2e" transform="rotate(-12 1160 772)"/>

  <!-- phone in hand -->
  <g transform="rotate(-12 1060 470)">
    <rect x="920" y="180" width="280" height="580" rx="48" fill="#0e1a2e"/>
    <rect x="938" y="198" width="244" height="544" rx="34" fill="#ffffff"/>
    <circle cx="1060" cy="224" r="7" fill="#0e1a2e"/>
    <circle cx="1060" cy="268" r="24" fill="#b9c6da"/>
    <circle cx="1060" cy="261" r="8" fill="#ffffff"/>
    <path d="M1044,281 a16,12 0 0 1 32,0 Z" fill="#ffffff"/>
    <line x1="956" y1="308" x2="1164" y2="308" stroke="#d7e0ee" stroke-width="3"/>
    <!-- thank-you message -->
    <path d="M956,398 v14 l-16,14 h16 Z" fill="#f7f9fc" stroke="#d7e0ee" stroke-width="3"/>
    <rect x="956" y="326" width="186" height="92" rx="18" fill="#f7f9fc" stroke="#d7e0ee" stroke-width="3"/>
    <rect x="974" y="348" width="126" height="10" rx="5" fill="#8299b8"/>
    <rect x="974" y="368" width="94" height="9" rx="4.5" fill="#b9c6da"/>
    <rect x="974" y="386" width="110" height="9" rx="4.5" fill="#b9c6da"/>
    <!-- star prompt -->
    <rect x="956" y="442" width="206" height="76" rx="18" fill="url(#g)"/>
    <rect x="956" y="502" width="206" height="16" rx="8" fill="#3b82f6" opacity=".35"/>
    <use href="#st" transform="translate(986,480) scale(.2)" fill="#ffffff"/>
    <use href="#st" transform="translate(1024,480) scale(.2)" fill="#ffffff"/>
    <use href="#st" transform="translate(1062,480) scale(.2)" fill="#ffffff"/>
    <use href="#st" transform="translate(1100,480) scale(.2)" fill="#ffffff"/>
    <use href="#st" transform="translate(1138,480) scale(.2)" fill="#ffffff" opacity=".45"/>
    <!-- reply bar -->
    <rect x="956" y="640" width="170" height="44" rx="22" fill="#f7f9fc" stroke="#d7e0ee" stroke-width="3"/>
    <circle cx="988" cy="662" r="5" fill="#b9c6da"/>
    <circle cx="1008" cy="662" r="5" fill="#b9c6da"/>
    <circle cx="1028" cy="662" r="5" fill="#b9c6da"/>
    <circle cx="1152" cy="662" r="20" fill="url(#g)"/>
    <polygon points="1144,653 1166,662 1144,671 1149,662" fill="#ffffff"/>
  </g>

  <!-- fingers wrapping the bottom edge, thumb up the side -->
  <ellipse cx="1067" cy="773" rx="20" ry="13" fill="#0e1a2e" transform="rotate(-12 1067 773)"/>
  <ellipse cx="1122" cy="761" rx="20" ry="13" fill="#0e1a2e" transform="rotate(-12 1122 761)"/>
  <ellipse cx="1177" cy="749" rx="20" ry="13" fill="#0e1a2e" transform="rotate(-12 1177 749)"/>
  <ellipse cx="1226" cy="739" rx="20" ry="13" fill="#0e1a2e" transform="rotate(-12 1226 739)"/>
  <ellipse cx="947" cy="700" rx="40" ry="17" fill="#0e1a2e" transform="rotate(78 947 700)"/>

  <!-- review flying off -->
  <use href="#st" transform="translate(1290,170) rotate(14)" fill="url(#g)"/>
  <g clip-path="url(#sc)"><rect x="1290" y="60" width="150" height="250" fill="#3b82f6" opacity=".3"/></g>
  <path d="M1180,84 l5,12 12,5 -12,5 -5,12 -5,-12 -12,-5 12,-5 Z" fill="#22d3ee"/>
  <path d="M1408,296 l4,10 10,4 -10,4 -4,10 -4,-10 -10,-4 10,-4 Z" fill="#22d3ee"/>
</svg>
