  <rect x="1030" y="727" width="30" height="8" rx="4" fill="#ffffff" opacity=".85"/>
  <path d="M1128,731 l8,8 l15,-17" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
