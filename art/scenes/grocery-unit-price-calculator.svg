  <rect x="1005" y="656" width="170" height="100" rx="8" fill="#ffffff" stroke="#d7e0ee" stroke-width="3"/>
  <rect x="1023" y="674" width="64" height="14" rx="7" fill="#8299b8"/>
  <line x1="1017" y1="708" x2="1163" y2="708" stroke="#d7e0ee" stroke-width="2.5"/>
