<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="lv-g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#0ea371"/>
    </linearGradient>
    <linearGradient id="lv-gv" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#0ea371"/>
    </linearGradient>
    <radialGradient id="lv-w1"><stop offset="0" stop-color="#34d399" stop-opacity=".13"/><stop offset="1" stop-color="#34d399" stop-opacity="0"/></radialGradient>
    <radialGradient id="lv-w2"><stop offset="0" stop-color="#0ea371" stop-opacity=".10"/><stop offset="1" stop-color="#0ea371" stop-opacity="0"/></radialGradient>
    <radialGradient id="lv-w3"><stop offset="0" stop-color="#34d399" stop-opacity=".08"/><stop offset="1" stop-color="#34d399" stop-opacity="0"/></radialGradient>
  </defs>

  <rect width="1600" height="900" fill="#f7f9fc"/>
  <circle cx="380" cy="200" r="460" fill="url(#lv-w1)"/>
  <circle cx="1240" cy="560" r="560" fill="url(#lv-w2)"/>
  <circle cx="850" cy="140" r="330" fill="url(#lv-w3)"/>

  <!-- ground shadows -->
  <ellipse cx="320" cy="814" rx="205" ry="15" fill="#0e1a2e" opacity=".07"/>
  <ellipse cx="800" cy="814" rx="215" ry="15" fill="#0e1a2e" opacity=".07"/>
  <ellipse cx="1280" cy="814" rx="230" ry="16" fill="#0e1a2e" opacity=".07"/>

  <!-- stage platforms, rising left to right -->
  <rect x="140" y="720" width="360" height="84" rx="14" fill="#ffffff" stroke="#d7e0ee" stroke-width="3"/>
  <line x1="158" y1="742" x2="482" y2="742" stroke="#d7e0ee" stroke-width="2.5" opacity=".8"/>
  <rect x="620" y="680" width="360" height="124" rx="14" fill="#ffffff" stroke="#d7e0ee" stroke-width="3"/>
  <line x1="638" y1="702" x2="962" y2="702" stroke="#d7e0ee" stroke-width="2.5" opacity=".8"/>
  <rect x="1100" y="640" width="360" height="164" rx="14" fill="#ffffff" stroke="#d7e0ee" stroke-width="3"/>
  <line x1="1118" y1="662" x2="1442" y2="662" stroke="#d7e0ee" stroke-width="2.5" opacity=".8"/>

  <!-- flow arrows -->
  <path d="M430,598 C520,560 570,552 648,548" fill="none" stroke="#8299b8" stroke-width="4.5" stroke-dasharray="13 11" stroke-linecap="round"/>
  <path d="M645,538 L660,548 L645,558" fill="none" stroke="#8299b8" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M935,470 C1020,430 1050,425 1103,420" fill="none" stroke="#8299b8" stroke-width="4.5" stroke-dasharray="13 11" stroke-linecap="round"/>
  <path d="M1100,410 L1115,420 L1100,430" fill="none" stroke="#8299b8" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- stage 1: the lead card at quote -->
  <rect x="225" y="585" width="190" height="135" rx="14" fill="#ffffff" stroke="#d7e0ee" stroke-width="3"/>
  <circle cx="259" cy="621" r="20" fill="#b9c6da"/>
  <rect x="292" y="606" width="90" height="9" rx="4.5" fill="#d7e0ee"/>
  <rect x="292" y="624" width="60" height="9" rx="4.5" fill="#d7e0ee"/>
  <line x1="245" y1="660" x2="395" y2="660" stroke="#d7e0ee" stroke-width="2.5"/>
  <rect x="245" y="680" width="150" height="14" rx="7" fill="#d7e0ee"/>
  <rect x="245" y="680" width="48" height="14" rx="7" fill="url(#lv-g)"/>
  <!-- quote badge: document -->
  <circle cx="415" cy="585" r="26" fill="#ffffff" stroke="#d7e0ee" stroke-width="3"/>
  <path d="M404,570 h13 l10,10 v20 h-23 z" fill="#ffffff" stroke="#0e1a2e" stroke-width="3.5" stroke-linejoin="round"/>
  <path d="M417,570 v10 h10" fill="none" stroke="#0e1a2e" stroke-width="3.5" stroke-linejoin="round"/>
  <path d="M409,589 h11 M409,595 h11" stroke="#0e1a2e" stroke-width="3" stroke-linecap="round"/>
  <!-- one coin -->
  <rect x="418" y="708" width="52" height="12" fill="#0ea371"/>
  <ellipse cx="444" cy="720" rx="26" ry="8" fill="#0ea371"/>
  <ellipse cx="444" cy="708" rx="26" ry="8" fill="url(#lv-g)"/>
  <ellipse cx="444" cy="708" rx="15" ry="4.5" fill="none" stroke="#ffffff" stroke-width="2.5" opacity=".7"/>

  <!-- stage 2: the lead card at sale -->
  <rect x="680" y="510" width="240" height="170" rx="14" fill="#ffffff" stroke="#d7e0ee" stroke-width="3"/>
  <circle cx="722" cy="554" r="25" fill="#b9c6da"/>
  <rect x="762" y="536" width="110" height="10" rx="5" fill="#d7e0ee"/>
  <rect x="762" y="558" width="76" height="10" rx="5" fill="#d7e0ee"/>
  <line x1="704" y1="606" x2="896" y2="606" stroke="#d7e0ee" stroke-width="2.5"/>
  <rect x="704" y="632" width="192" height="16" rx="8" fill="#d7e0ee"/>
  <rect x="704" y="632" width="105" height="16" rx="8" fill="url(#lv-g)"/>
  <!-- sale badge: price tag -->
  <circle cx="920" cy="510" r="28" fill="#ffffff" stroke="#d7e0ee" stroke-width="3"/>
  <g transform="rotate(38 920 510)">
    <rect x="907" y="497" width="26" height="26" rx="6" fill="#ffffff" stroke="#0e1a2e" stroke-width="3.5"/>
    <circle cx="914" cy="504" r="3.5" fill="#0e1a2e"/>
  </g>
  <!-- two coins -->
  <rect x="922" y="694" width="56" height="13" fill="#0ea371"/>
  <ellipse cx="950" cy="707" rx="28" ry="8.5" fill="#0ea371"/>
  <ellipse cx="950" cy="694" rx="28" ry="8.5" fill="url(#lv-g)"/>
  <rect x="922" y="672" width="56" height="13" fill="#0ea371"/>
  <ellipse cx="950" cy="672" rx="28" ry="8.5" fill="url(#lv-g)"/>
  <ellipse cx="950" cy="672" rx="16" ry="5" fill="none" stroke="#ffffff" stroke-width="2.5" opacity=".7"/>

  <!-- stage 3: the lead card at repeat customer -->
  <rect x="1130" y="425" width="300" height="215" rx="14" fill="#ffffff" stroke="#d7e0ee" stroke-width="3"/>
  <circle cx="1182" cy="479" r="31" fill="#b9c6da"/>
  <rect x="1230" y="456" width="140" height="12" rx="6" fill="#d7e0ee"/>
  <rect x="1230" y="482" width="95" height="12" rx="6" fill="#d7e0ee"/>
  <rect x="1160" y="530" width="120" height="10" rx="5" fill="#d7e0ee"/>
  <line x1="1160" y1="560" x2="1400" y2="560" stroke="#d7e0ee" stroke-width="2.5"/>
  <rect x="1160" y="586" width="200" height="20" rx="10" fill="#d7e0ee"/>
  <rect x="1160" y="586" width="172" height="20" rx="10" fill="url(#lv-g)"/>
  <rect x="1160" y="597" width="172" height="9" rx="4.5" fill="#0ea371" opacity=".3"/>
  <!-- repeat badge: circular arrow -->
  <circle cx="1430" cy="425" r="31" fill="#ffffff" stroke="#d7e0ee" stroke-width="3"/>
  <path d="M1410,425 a20,20 0 1 1 20,20" fill="none" stroke="#0e1a2e" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M1439,438 L1428,445 L1439,452" fill="none" stroke="#0e1a2e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- four coins, overlapping card corner -->
  <g>
    <rect x="1378" y="628" width="60" height="13" fill="#0ea371"/>
    <ellipse cx="1408" cy="641" rx="30" ry="9" fill="#0ea371"/>
    <ellipse cx="1408" cy="628" rx="30" ry="9" fill="url(#lv-g)"/>
    <rect x="1378" y="605" width="60" height="13" fill="#0ea371"/>
    <ellipse cx="1408" cy="605" rx="30" ry="9" fill="url(#lv-g)"/>
    <rect x="1378" y="582" width="60" height="13" fill="#0ea371"/>
    <ellipse cx="1408" cy="582" rx="30" ry="9" fill="url(#lv-g)"/>
    <rect x="1378" y="559" width="60" height="13" fill="#0ea371"/>
    <ellipse cx="1408" cy="559" rx="30" ry="9" fill="url(#lv-g)"/>
    <ellipse cx="1408" cy="559" rx="17" ry="5" fill="none" stroke="#ffffff" stroke-width="2.5" opacity=".7"/>
  </g>
</svg>
