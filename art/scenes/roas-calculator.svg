<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <radialGradient id="w1"><stop offset="0" stop-color="#38bdf8" stop-opacity=".14"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></radialGradient>
    <radialGradient id="w2"><stop offset="0" stop-color="#2563eb" stop-opacity=".1"/><stop offset="1" stop-color="#2563eb" stop-opacity="0"/></radialGradient>
    <clipPath id="adImg"><rect x="172" y="232" width="296" height="216" rx="14"/></clipPath>
    <clipPath id="profitClip"><rect x="1400" y="496" width="150" height="214" rx="16"/></clipPath>
  </defs>

  <rect width="1600" height="900" fill="#f7f9fc"/>
  <ellipse cx="330" cy="330" rx="520" ry="400" fill="url(#w1)"/>
  <ellipse cx="1380" cy="560" rx="480" ry="380" fill="url(#w2)"/>
  <ellipse cx="820" cy="180" rx="480" ry="220" fill="url(#w1)" opacity=".7"/>

  <!-- the ad creative -->
  <ellipse cx="320" cy="716" rx="230" ry="24" fill="#0e1a2e" opacity=".07"/>
  <rect x="140" y="200" width="360" height="490" rx="24" fill="#ffffff" stroke="#d7e0ee" stroke-width="3"/>
  <rect x="172" y="232" width="296" height="216" rx="14" fill="url(#acc)"/>
  <g clip-path="url(#adImg)">
    <path d="M172 448 L292 330 L352 390 L424 312 L468 448 Z" fill="#ffffff" opacity=".3"/>
    <circle cx="252" cy="296" r="24" fill="#ffffff" opacity=".55"/>
    <rect x="380" y="232" width="88" height="216" fill="#2563eb" opacity=".3"/>
  </g>
  <rect x="172" y="482" width="240" height="16" rx="8" fill="#8299b8"/>
  <rect x="172" y="512" width="180" height="12" rx="6" fill="#b9c6da"/>
  <rect x="172" y="576" width="168" height="58" rx="29" fill="url(#acc)"/>
  <path d="M232 590 l26 15 -26 15 Z" fill="#ffffff"/>
  <circle cx="452" cy="605" r="16" fill="none" stroke="#d7e0ee" stroke-width="3"/>

  <!-- order stream flowing right -->
  <path d="M520 480 C 690 434 880 434 1058 478" fill="none" stroke="#d7e0ee" stroke-width="5" stroke-linecap="round" stroke-dasharray="1 20"/>
  <g>
    <path d="M617 404 h46 l11 62 h-68 Z" fill="#ffffff" stroke="#8299b8" stroke-width="4" stroke-linejoin="round"/>
    <path d="M626 404 v-4 a14 15 0 0 1 28 0 v4" fill="none" stroke="#8299b8" stroke-width="4"/>
  </g>
  <g>
    <path d="M781 366 h42 l10 56 h-62 Z" fill="#ffffff" stroke="#8299b8" stroke-width="4" stroke-linejoin="round"/>
    <path d="M789 366 v-4 a13 14 0 0 1 26 0 v4" fill="none" stroke="#8299b8" stroke-width="4"/>
  </g>
  <g>
    <path d="M939 394 h46 l11 62 h-68 Z" fill="#ffffff" stroke="#8299b8" stroke-width="4" stroke-linejoin="round"/>
    <path d="M948 394 v-4 a14 15 0 0 1 28 0 v4" fill="none" stroke="#8299b8" stroke-width="4"/>
  </g>

  <!-- splitter -->
  <rect x="1073" y="458" width="44" height="44" rx="9" fill="#ffffff" stroke="#8299b8" stroke-width="5" transform="rotate(45 1095 480)"/>
  <path d="M1116 460 C 1146 420 1158 402 1182 384" fill="none" stroke="#8299b8" stroke-width="5" stroke-linecap="round"/>
  <path d="M1170 376 l18 4 -8 17" fill="none" stroke="#8299b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M1118 498 C 1230 546 1300 560 1388 570" fill="none" stroke="#8299b8" stroke-width="5" stroke-linecap="round"/>
  <path d="M1372 560 l18 9 -13 14" fill="none" stroke="#8299b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- revenue: the whole stack -->
  <ellipse cx="1290" cy="726" rx="170" ry="18" fill="#0e1a2e" opacity=".06"/>
  <rect x="1190" y="654" width="160" height="56" rx="12" fill="#ffffff" stroke="#d7e0ee" stroke-width="3"/>
  <rect x="1190" y="596" width="160" height="56" rx="12" fill="#ffffff" stroke="#d7e0ee" stroke-width="3"/>
  <rect x="1190" y="538" width="160" height="56" rx="12" fill="#ffffff" stroke="#d7e0ee" stroke-width="3"/>
  <rect x="1190" y="480" width="160" height="56" rx="12" fill="#ffffff" stroke="#d7e0ee" stroke-width="3"/>
  <rect x="1190" y="422" width="160" height="56" rx="12" fill="#ffffff" stroke="#d7e0ee" stroke-width="3"/>
  <rect x="1190" y="364" width="160" height="56" rx="12" fill="#ffffff" stroke="#d7e0ee" stroke-width="3"/>
  <ellipse cx="1270" cy="392" rx="32" ry="15" fill="none" stroke="#b9c6da" stroke-width="4"/>

  <!-- profit: what's actually kept -->
  <ellipse cx="1478" cy="726" rx="110" ry="16" fill="#0e1a2e" opacity=".06"/>
  <circle cx="1475" cy="468" r="36" fill="url(#acc)"/>
  <circle cx="1475" cy="468" r="22" fill="none" stroke="#ffffff" stroke-width="4" opacity=".65"/>
  <g clip-path="url(#profitClip)">
    <rect x="1400" y="496" width="150" height="214" fill="url(#acc)"/>
    <rect x="1516" y="496" width="34" height="214" fill="#2563eb" opacity=".35"/>
  </g>

  <line x1="1150" y1="712" x2="1580" y2="712" stroke="#d7e0ee" stroke-width="4"/>
</svg>
