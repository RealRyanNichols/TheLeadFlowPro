# The LeadFlow Pro on the DigitalOcean droplet, next to the central brain.
# Run through deploy/droplet/deploy.sh, not by hand. See docs/infrastructure/droplet.md.
#
#   web     Next.js standalone server, bound to 127.0.0.1:3100. The droplet's
#           Caddy terminates HTTPS and proxies to it; the brain keeps :3000.
#   cron    Replaces Vercel Cron. Idle until /etc/theleadflowpro/cron-enabled
#           exists (deploy/droplet/cutover.sh crons-on).
#   worker  Content Command queue worker. Opt in with COMPOSE_PROFILES=worker.
#   db      PROPOSED: the site's own database (docs/infrastructure/database.md).
#           Off until Ryan says yes: deploy.sh never starts it; db.sh setup does.

name: theleadflowpro

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  web:
    image: theleadflowpro-web:latest
    build:
      context: ../..
      dockerfile: deploy/droplet/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
      secrets:
        - webenv
    env_file:
      - ${WEB_ENV_FILE:-/etc/theleadflowpro/web.env}
    ports:
      - "127.0.0.1:3100:3000"
    restart: unless-stopped
    logging: *logging

  cron:
    image: node:22-alpine
    working_dir: /app
    command: ["node", "/app/deploy/droplet/cron-runner.mjs"]
    env_file:
      - ${WEB_ENV_FILE:-/etc/theleadflowpro/web.env}
    environment:
      CRON_TARGET: http://web:3000
      CRON_VERCEL_JSON: /app/vercel.json
      CRON_FLAG_FILE: /config/cron-enabled
      CRON_STATUS_FILE: /state/cron-status.json
    volumes:
      - ../..:/app:ro
      - ${CONFIG_DIR:-/etc/theleadflowpro}:/config:ro
      - cron-state:/state
    depends_on:
      - web
    restart: unless-stopped
    logging: *logging

  worker:
    profiles: ["worker"]
    image: node:22-alpine
    working_dir: /app
    command: ["node", "/app/worker/content-command-worker.mjs"]
    env_file:
      - ${WEB_ENV_FILE:-/etc/theleadflowpro/web.env}
    environment:
      CONTENT_COMMAND_BASE_URL: http://web:3000
      CONTENT_COMMAND_WORKER_ID: droplet-worker
    volumes:
      - ../..:/app:ro
    depends_on:
      - web
    restart: unless-stopped
    logging: *logging

  # The site's own database, proposed and waiting on Ryan's yes
  # (docs/infrastructure/database.md). Its profile keeps it off: deploy.sh
  # never starts it, and nothing in the site reads it yet. "db.sh setup" starts
  # it once; Docker then keeps it running across restarts. No port is
  # published, so the internet cannot reach it; the site's containers use
  # db:5432. Small memory settings: the droplet is short on memory (Sep 28, 2026).
  db:
    profiles: ["db"]
    # Pinned to the tested build: a new image can change how text sorts (ICU).
    image: postgres:17.11-alpine3.24
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=20"]
    environment:
      POSTGRES_DB: leadflow
      POSTGRES_PASSWORD_FILE: /run/leadflow/db-password
      # Sort text the way Supabase does (ICU, en-US). Used on the first start only.
      POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=en-US"
    volumes:
      - db-data:/var/lib/postgresql/data
      # Written by db.sh setup (root only). A missing file stops the start
      # instead of Docker creating an empty folder in its place.
      - type: bind
        source: ${CONFIG_DIR:-/etc/theleadflowpro}/db-password
        target: /run/leadflow/db-password
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      # Over TCP, so it passes only once the real server is up (the first-run
      # setup server listens on the socket alone).
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "leadflow"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    mem_limit: 512m
    restart: unless-stopped
    logging: *logging

secrets:
  webenv:
    file: ${WEB_ENV_FILE:-/etc/theleadflowpro/web.env}

volumes:
  cron-state:
  db-data:
