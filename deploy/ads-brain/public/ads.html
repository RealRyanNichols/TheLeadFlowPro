<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Ads Brain | The LeadFlow Pro</title>
  <style>
    :root { color-scheme: dark; --navy:#0e1a2e; --panel:#15243d; --line:#2c3f5f; --text:#f8fafc; --muted:#a9b7ca; --blue:#19a9ff; --green:#3ddc97; --gold:#ffca58; --red:#ff646e; }
    * { box-sizing:border-box; }
    body { margin:0; background:linear-gradient(145deg,#07111f,var(--navy) 55%,#102a46); color:var(--text); font:15px/1.5 Inter,system-ui,sans-serif; min-height:100vh; }
    main { width:min(1180px,calc(100% - 28px)); margin:auto; padding:24px 0 70px; }
    header { display:flex; gap:16px; align-items:flex-start; justify-content:space-between; margin-bottom:20px; }
    h1,h2,h3,p { margin-top:0; } h1 { font-size:clamp(28px,5vw,48px); line-height:1; margin-bottom:10px; } h2 { font-size:18px; margin-bottom:12px; }
    .eyebrow { color:var(--blue); font-weight:900; letter-spacing:.16em; text-transform:uppercase; font-size:12px; }
    .muted { color:var(--muted); }
    .lock { background:#143522; border:1px solid #2c6e49; color:#bdfbd6; border-radius:999px; padding:9px 14px; font-weight:850; white-space:nowrap; }
    .grid { display:grid; gap:14px; grid-template-columns:repeat(12,1fr); }
    .panel,.metric { border:1px solid var(--line); background:rgba(21,36,61,.88); border-radius:18px; box-shadow:0 18px 45px rgba(0,0,0,.2); }
    .panel { padding:18px; grid-column:span 12; } .metric { padding:16px; grid-column:span 3; }
    .metric b { display:block; font-size:27px; line-height:1.1; margin:5px 0; } .metric small { color:var(--muted); }
    .two { grid-column:span 6; } .status { display:flex; align-items:center; gap:9px; font-weight:800; }
    .dot { width:10px; height:10px; border-radius:50%; background:var(--green); box-shadow:0 0 0 5px rgba(61,220,151,.12); }
    .dot.off { background:var(--gold); box-shadow:0 0 0 5px rgba(255,202,88,.12); }
    .alert { padding:13px 14px; border-left:4px solid var(--gold); background:#1c2940; border-radius:9px; margin:10px 0; }
    .alert.critical,.alert.high { border-color:var(--red); } .alert b { display:block; margin-bottom:3px; }
    ol { margin:0; padding-left:24px; } li { margin:10px 0; } li span { display:block; color:var(--muted); }
    table { width:100%; border-collapse:collapse; } th,td { text-align:left; padding:10px 8px; border-bottom:1px solid var(--line); } th { color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.08em; }
    .scroll { overflow:auto; } a { color:#91d9ff; } .error { color:#ffc1c6; }
    @media (max-width:800px) { header { display:block; } .lock { display:inline-block; margin-top:10px; } .metric,.two { grid-column:span 12; } main { width:min(100% - 18px,1180px); } }
  </style>
</head>
<body><main>
  <header>
    <div><div class="eyebrow">The LeadFlow Pro</div><h1>Ads Brain</h1><p class="muted">Read only campaign intelligence tied to the leads and outcomes in your own system.</p></div>
    <div class="lock">🔒 Spend lock is on</div>
  </header>
  <div id="app"><section class="panel"><p>Loading the latest verified snapshot...</p></section></div>
</main>
<script>
const $=s=>document.querySelector(s), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=v=>'$'+Number(v||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const num=v=>Number(v||0).toLocaleString();
function metric(label,value,note){return `<div class="metric"><small>${esc(label)}</small><b>${esc(value)}</b><small>${esc(note||'')}</small></div>`}
function render(data){
  if(!data.snapshot){$('#app').innerHTML='<section class="panel"><h2>No snapshot yet</h2><p class="muted">The worker is installed but has not completed its first run.</p></section>';return}
  const p=data.snapshot.payload||{}, m=p.meta||{}, l=p.leads||{}, t=l.totals||{}, seven=m.last_7_days||{}, thirty=m.last_30_days||{};
  const alerts=(data.alerts||[]).map(a=>`<div class="alert ${esc(a.severity)}"><b>${esc(a.title)}</b><span>${esc(a.detail)}</span></div>`).join('')||'<p class="muted">No open exceptions.</p>';
  const recs=(p.recommendations||[]).map(r=>`<li><b>${esc(r.action)}</b><span>${esc(r.reason)}</span></li>`).join('');
  const campaigns=(l.campaigns||[]).map(c=>`<tr><td>${esc(c.campaign)}</td><td>${num(c.leads)}</td><td>${num(c.contacted)}</td><td>${num(c.proposals)}</td><td>${num(c.won)}</td></tr>`).join('');
  const latest=data.runs&&data.runs[0];
  $('#app').innerHTML=`<div class="grid">
    ${metric('Meta connection',m.connected?'Connected':'Needs attention',m.connected?'Aggregate read access only':m.error||'Disconnected')}
    ${metric('Active ads',num((m.active_ads||[]).length),(m.active_ads||[]).length?'Review Ads Manager now':'Delivery lock looks clean')}
    ${metric('Meta leads',num(t.total),'All live, non test CRM rows')}
    ${metric('No first contact',num(t.uncontacted),'Work these before new spend')}
    ${metric('Spend, 7 days',money(seven.spend),`${num(seven.platform_leads)} platform leads`) }
    ${metric('CRM leads, 7 days',num(t.d7),`${num(t.proposal)} proposals open`) }
    ${metric('Spend, 30 days',money(thirty.spend),`${num(thirty.clicks)} clicks`) }
    ${metric('CRM leads, 30 days',num(t.d30),`${num(t.won)} won recorded`) }
    <section class="panel two"><h2>What needs attention</h2>${alerts}</section>
    <section class="panel two"><h2>Next moves</h2><ol>${recs}</ol></section>
    <section class="panel"><h2>Lead performance by campaign tag</h2><div class="scroll"><table><thead><tr><th>Campaign</th><th>Leads</th><th>Contacted</th><th>Proposals</th><th>Won</th></tr></thead><tbody>${campaigns}</tbody></table></div></section>
    <section class="panel"><div class="status"><i class="dot ${m.connected?'':'off'}"></i><span>Last worker run: ${esc(latest?new Date(latest.finished_at).toLocaleString():'none')}</span></div><p class="muted" style="margin:10px 0 0">Account ${esc(p.identity&&p.identity.ad_account_id)}. Mode ${esc(p.hard_stops&&p.hard_stops.mode)}. This system has no campaign write, publish, email or messaging capability.</p></section>
  </div>`;
}
fetch('/api/ads',{credentials:'same-origin'}).then(r=>{if(!r.ok)throw new Error('The private Ads Brain could not be loaded.');return r.json()}).then(render).catch(e=>{$('#app').innerHTML=`<section class="panel"><h2 class="error">Ads Brain unavailable</h2><p>${esc(e.message)}</p></section>`});
</script></body></html>
